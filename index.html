  {"id":"pre-table","name":"Win Before the Table","what":"Sets up the outcome before the meeting starts.","steps":["Build the relationship early, before there's anything to negotiate.","Build credibility through results. That is what makes your word carry weight.","Prepare your numbers, your strategy and how you'll open.","Signals start the moment you walk in: what you lead with, how you listen and how relaxed you seem."],"def":"Much of a negotiation's outcome is settled before the meeting starts, through relationships, reputation and preparation."},
  {"id":"intangibles","name":"Intangibles","what":"Uses what isn't money to close the gap on a deal.","steps":["Ask what the other person needs to show their boss or team to count this as a win.","Ask about their timing and any pressures they're under.","Ask whose reputation is at stake, and how.","Offer things that cost you little but matter to them, such as a quick start, public credit or a favorable announcement."],"def":"Intangibles are the parts of a deal that aren't money, such as credit, timing or reputation. They can close gaps that price can't."},
  {"id":"ethics","name":"Ethics Line","what":"Separates tough tactics from deception.","steps":[["**Acceptable:**",["an ambitious opening offer","keeping your deadline or walkaway point private","holding firm"]],["**Not acceptable:**",["making promises you won't keep","misstating facts","getting information through improper means"]],"When unsure, ask yourself: would I be comfortable if the other side later learned exactly what I did?"],"watch":"Trust is the most valuable and most fragile currency in a negotiation. Deception can win a round and lose the relationship, and it can carry legal risk.","def":"The ethics line marks where tough negotiating ends and deception begins. Staying on the right side protects your reputation, the relationship and sometimes your legal standing."},
  {"id":"culture","name":"Across Cultures","what":"Reads the other side's cultural defaults.","steps":[["Check three dimensions:",["**Direct or indirect:** is disagreement said plainly or only implied?","**Individual or group:** does one person decide, or the group?","**Task-first or relationship-first:** do people want to get straight to business, or get to know you first?"]],"Adjust your style. Directness can feel rude in indirect cultures, and silence may just mean the group hasn't agreed yet.","In relationship-first cultures, invest time in the relationship before pushing on the deal."],"def":"People from different cultures bring different default expectations to a negotiation. Reading them avoids friction that has nothing to do with the deal itself."},
  {"id":"steady","name":"Staying Steady","what":"Keeps emotion from driving concessions.","steps":["Pause before you respond, even for a few seconds.","Name the emotion to yourself, such as “I'm feeling pressured,” without letting it drive your reply.","Repeat the other side's point back to them before making yours. They feel heard, and you gain time to think.","Speak in short, clear sentences, cut filler words and check that your key point landed."],"def":"Emotions can make people concede too much or walk away too soon. These four habits keep you steady under pressure."}
 ]},
{id:"ai",name:"Applied AI",q:"How do I use and build with AI?",idea:"AI earns its place only when it solves a real business problem. The hard part is judgment. You have to know **where it belongs, what it can be trusted with and how you prove it pays off**.",use:["Your team loses hours to research, first drafts or copy-paste work","You're deciding whether an AI idea is worth building","You're building an AI product or agent and need it to be reliable","You need AI answers you can trust and check","You're rolling out an AI tool and need to show it's paying off"],
 tools:[
  {"id":"hitl","why":"AI is fastest where the work is repetitive and the cost of a small error is low. People are essential where trust is at stake and a mistake is hard to take back. Most workflows mix both, and the damage comes from failing to separate them. Either AI touches a moment that needed a person, or people spend hours on drafting that AI could have done in minutes.","example":"A sales team maps its deal process. Researching the prospect, drafting the first outreach, logging the call and scheduling the follow-up are tagged research, drafting and execution. AI leads them. The discovery call, the pricing conversation and the response to a complaint are tagged trust moments. A person owns them. The team's time shifts from admin to the conversations that close deals.","name":"Human-in-the-Loop Map","what":"Splits a workflow between AI and people.","steps":["Map the workflow you want to improve, one step per line from start to finish. A user journey map works well here.",["Label every step with one of four tags:",["**Research:** gathering or summarizing information.","**Drafting:** writing a first version of an email, summary or report.","**Execution:** routine actions, such as scheduling, sending reminders or updating records.","**Trust moment:** anything where a customer's or colleague's trust is on the line, such as a demo, a negotiation, a hard decision or a sensitive message."]],"Let AI lead the research, drafting and execution steps. They are repetitive and easy to check.","Keep a person in charge of every trust moment. A mistake there costs more than the time AI would save.","Add a human review before anything AI made reaches a customer, even on the steps AI leads."],"def":"A human-in-the-loop map shows which steps of a workflow AI can handle on its own and which steps need a person. Use it before adding AI to a process. It speeds up the routine work and keeps people on the moments that need judgment.","watch":"The customer-facing step is usually the most tedious and the most tempting to automate. It's also where trust is won or lost."},
  {"id":"adoption","why":"Buying the tool is the easy part. The usual approach, a mandate and a training session, produces a quiet return to the old way within a month. What sticks is a visible win from a few early users and clear rules before the tool spreads.","example":"An operations team spends two hours a day re-entering supplier details from emails into a tracking system. The lead starts there, with three volunteers using an AI tool to extract the details. After two weeks they report ninety minutes saved a day each and one error caught. The lead shares that in the team meeting, writes down which data may go into the tool, and rolls it out to the rest of the team the following month.","name":"AI Adoption Plan","what":"Rolls out AI in a team as a change-management project.","steps":["**Start small.** Pick one team or one workflow where the frustration is most visible, such as hours spent retyping the same information.",["**Learn how the work happens.** Before introducing anything, ask the people doing it:",["“Walk me through a typical day.”","“Where do things slow down?”","“Where do you copy or retype the same information?”"]],"**Build momentum.** Help a few curious people use the tool first, then share their small wins, such as an hour saved each week or fewer errors.",["**Set guardrails** before use spreads. Agree on:",["what data can go into the tool and what must stay out","who has access","who reviews AI output before it's used"]],"**Measure, then expand.** Write down what worked and what didn't, give each next step an owner, then roll out to the next team."],"watch":"Mandates rarely stick on their own. If people can't see what the tool saves them, they go back to the old way.","def":"An AI adoption plan is a step-by-step way to get a team using a new AI tool consistently. People change habits when a tool removes a frustration they already feel. The plan starts with their daily work and grows from small wins."},
  {"id":"fit-check","why":"The check matters because the two things that stall most AI projects show up in it early. One is data that isn't ready. The other is a team without the skills or time to run what gets built. Finding either before you commit is far cheaper than finding it after.","example":"A ten-person accounting firm wants AI to draft client emails. Scale is small, customisation is low, the data is moderately sensitive and nobody on staff is technical. The lightest option wins, a ready-made assistant with a business data agreement. A hospital network that wants AI to read its own radiology notes has the opposite profile. High privacy, high customisation and a data team. That points to a model running on its own systems, trained on its own notes.","name":"AI Project Fit Check","what":"Tests whether an AI idea fits your needs and resources before you build.","steps":[["Answer six questions about what you **need**:",["**Scale:** how many people will use it?","**Customization:** how specific to your business must it be?","**Interaction:** will people chat with it, or will it run quietly in the background?","**Privacy:** how sensitive is the data it will see?","**Speed:** how fast must it respond?","**Connectivity:** will it run online, offline or on a device like a phone?"]],["Answer three questions about what you **have**:",["people with AI skills","budget","time"]],"Compare the two lists. Heavy needs, such as high customisation, strict privacy or working offline, push you towards a heavier option. Light needs, or little budget, time and AI skill, keep you at the light end.",["Pick the lightest option that meets your needs. From lightest to heaviest:",["**Ready-made tool:** an AI product you can buy and use today.","**Adjusted model:** an existing AI model trained further on your own data, often called fine-tuning.","**Custom build:** a system designed for you from scratch."]],"Check your data before you commit. It should be accurate, complete and easy to reach."],"watch":"Most AI projects stall on data and people. A strong model can't fix messy data or a team that won't use it.","def":"A fit check is a short set of questions to answer before building anything with AI. It tells you whether the idea is worth doing and which kind of AI solution matches it. That saves months on a custom build when a ready-made tool would do."},
  {"id":"two-way","why":"Each half fails on its own. A strategy set only from the top ends up as licences nobody uses, because it solves problems the people doing the work don't have. A strategy that grows only from the ground up ends up as a dozen tools with no shared data, no rules and no way to show a result.","example":"A regional insurer's leadership picks two goals for AI. The first is to cut the time it takes to process a claim. The second is to shorten call-centre handling time. In the same quarter, it invites every claims adjuster to try an approved AI assistant on their own tasks and post what worked in one shared channel. Within weeks the adjusters surface a use leadership had never considered, summarising long medical reports before review. Leadership adds it to the list as a third goal, with its own target.","name":"Top-Down Meets Bottom-Up","what":"Sets an AI strategy that leaders steer and employees will use.","steps":["**From the top:** leaders set the goal for AI and choose two or three uses with clear business value, such as faster customer replies or less time spent on monthly reporting.","**From the ground up:** invite employees to try AI in their own work and share what helps. Collect their ideas in one place.",["**Invest in what both groups need to succeed:**",["data that is clean and that people are allowed to reach","tools the company already pays for, to avoid buying twice","training on how to use those tools well"]],"**Set responsible AI rules early.** Agree on security, privacy and fairness before use spreads. Bad habits are hard to undo later.","**Measure against business goals,** such as time saved or revenue gained, and keep the uses that move them."],"watch":"A vision with no bottom-up experiments stays a slide. Experiments with no vision scatter into tools nobody maintains.","def":"This is a way to set an AI strategy that combines direction from leaders with ideas from employees. Leaders know where the business needs to go. Employees know where the daily work is slow. A strategy that uses both gets adopted."},
  {"id":"prompting","why":"Most disappointing AI output comes from a vague ask rather than a weak model. The patterns in the last step are for the second attempt, when the first answer misses in a specific way. Wrong format, wrong tone and wrong logic each have a different fix.","example":"A vague prompt reads “Analyse our sales data.” A clear one reads “I'm a product manager deciding whether to raise prices by 5%. Using the attached twelve months of sales by product, estimate the change in monthly revenue if demand falls 3% for every 5% price increase. Give me a table with base case, 5% and 10%, and show the formula.” The second gets a checkable answer on the first try.","name":"Prompting Well","what":"Gets useful, checkable answers from AI, and shows you how to fix a weak one.","steps":["**Give context.** Say who you are, what decision you're making and why it matters. For example, “I'm a product manager deciding whether to raise our price.”","**Give the exact inputs.** Paste or attach the numbers, files or data the AI should use, and say which ones matter most.","**State the task in one sentence.** For example, “Estimate how revenue changes if we raise the price by 5%.”","**Say what you want back.** A table, a chart, a short memo or a file, and how long it should be.",["**Ask in stages,** so you can check each one:",["first a base case","then variations, such as a higher and a lower price","then a chart"]],"**Ask it to show its formulas or reasoning,** so you can check the math yourself.",["If the answer misses, change how you ask rather than asking again. A wrong format usually needs an example. A wrong tone needs a role. Wrong logic needs the steps written out so you can check them. The patterns:",["**Zero-shot:** just ask, with no examples. Good for simple tasks.","**Few-shot:** show one or more examples of the output you want. Good when format matters.","**Role:** tell it who to act as, such as “a CFO reviewing this budget,” to set its tone and focus.","**Chaining:** split a big task into smaller prompts and feed each answer into the next.","**Step-by-step:** ask it to reason through the problem one step at a time. Good for logic and math.","**Prompt improvement:** ask the AI to rewrite your prompt so it's clearer, then use the better version."]],"Save prompts that work as templates your team can reuse."],"def":"A prompt is the instruction you give an AI tool. A good prompt reads like a clear brief to a capable colleague. It says who you are, what you need, from which data and in what form. When an answer misses, changing how you ask, such as adding an example or asking for steps, usually fixes it.","watch":"A fluent answer is easy to accept. Ask for the formula or the reasoning before you trust it."},
  {"id":"grounding","why":"A general model knows the public internet up to a point in time. It does not know your policies, your prices or what changed last week, and when asked it fills the gap with a plausible guess. Grounding closes that gap and lets people check where an answer came from.","example":"An HR team deploys an assistant to answer staff questions. Without grounding, it describes a parental leave policy that sounds reasonable and is wrong. With grounding, it retrieves the current policy document, answers from that text and links to the paragraph. When the policy changes, the team updates one document and every answer updates with it.","name":"Grounding and RAG","what":"Ties AI answers to your own documents so they stay accurate and current.","steps":["Collect the documents the AI should rely on, such as policies, product information and past work. Remove duplicates and old versions.",["Sort them into two groups:",["**Stable knowledge** that rarely changes, such as definitions and policies.","**Project knowledge** that changes often, such as this quarter's numbers or a current client."]],["When someone asks a question, the system works in three moves:",["**Retrieve:** it searches your documents for the most relevant passages.","**Augment:** it adds those passages to the question it sends the AI.","**Generate:** the AI writes an answer from those passages and cites them."]],"Review the documents regularly. Update or remove anything out of date."],"watch":"The answer can only be as good as what gets retrieved. Messy, outdated or duplicate documents produce confident wrong answers.","def":"Grounding means making an AI answer from your own trusted documents instead of from its general memory. The most common method is **RAG** (retrieval-augmented generation). It keeps answers accurate and current, and shows people where each answer came from."},
  {"id": "ai-data","why":"Most teams connect a model first and prepare the data later, because connecting is quick and preparing is slow. The result is an assistant that gives three answers to one question, because the same metric is defined three ways. Fixing the definitions is the part that makes the model useful.","example":"Two regional managers ask an AI assistant for last month's “active customers.” One region counts anyone who logged in. The other counts anyone who paid. The assistant returns two different numbers, and both managers trust theirs. A better model won't fix this. One glossary definition of active customer will, backed by one semantic model and a semantic layer that every question goes through.", "name": "Data Ready for AI", "what": "Organizes your data so AI can find it, understand it and give the same answer every time.", "steps": ["Use this map to check whether your data is ready for AI. AI answers well only when it can tell what your data means and reads every metric the same way.", ["Ask three questions. Each one has its own track:", ["**How is it stored?** The design track.", "**What does it mean?** The meaning track.", "**How is it used?** The consumption track."]], ["**Design track:** describe the data from plain to technical.", ["**Conceptual model:** the main parts of the business, such as customers, orders and products, and how they relate. No technology yet.", "**Logical model:** the details of each thing, such as its fields, IDs and rules.", "**Physical model:** the actual tables in your systems."]], ["**Meaning track:** agree on what words mean.", ["**Business glossary:** one shared definition for each term, such as “active customer.”", "**Ontology:** those definitions written formally, in a form machines can read.", "**Knowledge graph:** real facts linked through those definitions, such as which customer holds which account."]], ["**Consumption track:** turn data into answers.", ["**Business value:** the metrics and decisions the data should support.", "**Semantic model:** each metric defined once, with the measures, categories and joins behind it.", "**Semantic layer:** the software that turns a question into a database query using those definitions and applies access rules. It's why two people asking the same question get the same number."]], "Check that the three tracks agree with each other. Each term in the glossary should match a thing in the conceptual model and a metric people use.", ["Clean data in stages, often called **medallion architecture**. It's a way to stage data, separate from the models above:", ["**Bronze:** raw data, as it arrived.", "**Silver:** cleaned and made consistent.", "**Gold:** curated and ready for business use. Point AI here."]], ["Keep the foundation under all of it:", ["**metadata and a catalog**, which let people find data", "**lineage**, which traces where a number came from", "**data contracts**, written agreements on what a data source will deliver", "**governance**, meaning who owns and approves what"]]], "watch": "Pointing AI at raw tables invites confident wrong answers. If two teams define the same metric differently, AI will repeat both.", "def": "AI-ready data is stored cleanly, defined in shared business terms and served through one consistent layer. AI can then find the right numbers and give the same answer every time."},
  {"id":"verify","why":"The errors are rarely random. They cluster in specific numbers, names, dates, quotes and citations, and in silent assumptions about which data or time period to use. A five-minute check aimed at those spots catches most of what matters.","example":"An analyst asks AI to summarise quarterly growth from a spreadsheet. The summary reads well and cites 14% growth. Recomputing one number shows the AI compared the quarter to the wrong prior period. Asking it to list its assumptions reveals it excluded one region's data as “incomplete.” Two checks, five minutes, and a wrong figure stays out of the board deck.","name":"Verify the Output","what":"Catches confident AI mistakes before they reach anyone.","steps":["Recompute one or two key numbers yourself, by hand or in a spreadsheet.","Check the method. Did it use the formula, data and time period you asked for?","Ask it to list its assumptions, then check each one.","Look up any names, dates, quotes and figures it states. Made-up details, called **hallucinations**, most often appear there.","If a part is wrong, tell it exactly which and ask it to redo that part."],"def":"AI can sound confident and still be wrong. A quick check belongs in every important use.","watch":"Asking the AI whether it is sure doesn't count as a check. It will say yes."},
  {"id":"guardrails","why":"Users judge an AI product by its worst answer. Guardrails lower the worst case with a check at each stage, from what goes into the model to what comes out and what happens after launch. They cost some speed and some engineering, and far less than a public mistake.","example":"A bank's support assistant strips account numbers before any text reaches the model. Its instructions limit it to account questions, and it declines to give investment advice. When its confidence is low it adds “please confirm with an advisor.” It compares each answer to the policy document and flags mismatches. After launch, a “report a wrong answer” button routes to a reviewer who reads every report each week.","name":"Guardrails in the Pipeline","what":"Builds checks into an AI product so mistakes get caught before users see them.","steps":["**Before the AI sees anything:** remove personal data, such as emails, phone numbers and card numbers.","**In the instructions:** state the exact task, the audience and the level of detail. That keeps the AI on topic.","**After it answers:** check how confident it is. When confidence is low, show the user a “please verify” note.","**Against the source:** compare the answer with the documents it was given. If they don't match, warn the user.","**After launch:** filter harmful or biased language, and give users a “report a wrong answer” button. Make sure someone reads the reports."],"watch":"Guardrails cost speed. Put the heaviest checks where an error would hurt most.","def":"Guardrails are automatic checks built into an AI product. They catch mistakes and risks before a user sees them, at every stage from the question going in to the answer coming out."},
  {"id":"agents","why":"The word “agent” is used loosely, which makes it hard to scope one or judge a vendor's claim. Naming the parts turns a vague promise into specific decisions. What it can touch, what it may do with each tool and when a person has to approve. Those decisions, more than the model, decide whether an agent is safe to run.","example":"An agent for staff travel has a clear goal, a flight and hotel booked within policy. Its tools are the travel site, the company calendar and the expense system. Its autonomy is set to “act after a person approves,” so it finds options and drafts the booking, and a human clicks confirm. It can read the calendar but never move meetings. Six months in, with a clean record, the team lets it book trips under a set cost on its own.","name":"Agent Anatomy","what":"Explains what an AI agent is made of, to help you scope one.","steps":["**Define the goal.** Describe what a finished task looks like, such as “a meeting booked with the right people.”",["**Name its three parts:**",["**Model:** the AI that does the thinking.","**Reasoning loop:** how it works. It observes, decides, acts, then repeats until the goal is met.","**Tools:** what it uses to act, such as search, a calendar or a database. Tools reach other software through **connectors**, and increasingly through **MCP** (Model Context Protocol), a shared standard that lets one agent plug into many systems the same way."]],["**Choose the type:**",["**Rule-based:** follows fixed steps. Predictable, but rigid.","**Generative:** decides its own steps. Flexible, but less predictable."]],["**Set its freedom,** also called autonomy. It can:",["only suggest actions","act after a person approves","act on its own"]],"Match the freedom to the stakes. Anything involving money, health or a step that is hard to undo keeps a person approving each action. Low-risk, repeatable tasks can run with more autonomy.","**List every tool it can touch** and exactly what it may do with each, such as read the calendar but never delete events."],"def":"An AI agent is an AI system that works toward a goal by taking actions on its own, such as searching, booking or updating records. Breaking an agent into its parts helps you decide what it should do and how much freedom to give it.","watch":"A good demo is the most common reason an agent gets full autonomy on day one. Let it earn that the way a new hire would."},
  {"id":"north-star","why":"Usage is easy to grow and easy to fool yourself with. An AI product can log thousands of messages while helping nobody, because people retry, get frustrated and give up. Counting finished results keeps the team honest and gives leadership a number that ties to value.","example":"A customer-support AI reports 50,000 conversations a month, up 40%. Impressive, until the team counts questions resolved without a human. 18,000, and flat. The growth in conversations was people asking again. The outcome metric becomes resolved questions, with supporting numbers for first-answer accuracy and time to resolution, and the roadmap changes.","name":"Outcome Metric for AI","what":"Picks one metric that shows an AI product is helping its users.","steps":["Define a **completed outcome** for the user, such as a task finished, a question resolved or a purchase made.",["Check that it shows value for everyone involved at once:",["the **user**, who got a task done","any **partners**, such as sellers or providers","the **business**, which earns from it"]],"Choose it over usage counts, such as logins or messages. Usage can grow while nobody is helped.","Track a few supporting numbers under it, such as success rate, time saved and errors caught."],"def":"An outcome metric is the one number that shows an AI product is helping people. It counts finished results, such as questions resolved, instead of activity, such as messages sent.","watch":"Three “north star” metrics at once means none of them steers. Pick one."},
  {"id": "value-tree","why":"“AI is saving us time” is a claim. Net hours per month is a number. Breaking the number into drivers you can inspect shows which branch moved when the total changes. You fix the cause rather than pushing harder on usage.","example":"A finance team's tree shows net hours falling even though adoption is rising. Walking down the branches, successful tasks are up, but time saved per task has halved because reviewers now spend longer fixing output. The quality branch confirms it, with golden set accuracy down after a model change. The fix is in quality, and pushing more usage would have made it worse.", "name": "AI Value Tree", "what": "Measures the hours AI gives your team back, after its cost, and shows which lever to pull.", "steps": ["Use this tree to prove AI is paying off and to find what's holding it back. It starts from one goal and breaks it into drivers you can move.", "**Set the goal** as **net hours per month**: the working hours AI saves, minus what AI costs, converted into hours. AI cost in hours = AI spend ÷ average hourly cost of the people doing the work.", ["**Impact:** count the hours AI adds.", ["**Successful tasks:** how many real jobs, such as a report drafted or a ticket resolved, AI completed this month.", "**Time saved per task:** the manual time before AI, minus the time with AI. Include the time people spend reviewing and fixing its output.", "**Realized hours:** how many freed hours went into new work. Time saved only counts once it's used."]], ["**Cost:** price what AI costs you.", ["**Tokens per successful task:** a **token** is the small chunk of text AI models bill by. Divide all tokens used by the tasks that succeeded.", "**Price:** what you pay per million tokens, plus licenses and computing.", "**Waste:** tokens spent on oversized answers, loops, errors and failed attempts. Failed attempts cost money and return nothing."]], ["**Adoption:** check that people use it as a habit.", ["share of people who use AI on most working days, week after week", "share of people who come back after their first try", "share of tasks done through ready-made, tested workflows"]], ["**Quality:** check that it gets the job done.", ["**Task success rate:** the share of tasks AI finishes correctly.", "**Golden set accuracy:** the score on a fixed list of reference questions with known answers.", "**Eval coverage:** the share of AI workflows that have tests, an owner and a version, and were re-tested after their last change."]], ["**Data:** check that AI works from healthy data.", ["share of business areas with data AI can understand", "share of AI answers drawn from certified metrics and current documents"]], ["Review the tree monthly, from the bottom up. A drop at the top usually starts in one branch. Fix that branch first. The common patterns:",["Net hours rising means AI is paying for itself. Keep scaling.","High adoption with a low success rate means people are trying it and getting burned. Fix quality before you push usage.","Low cost with low net hours means AI is cheap but doing little real work. Aim it at bigger tasks.","Cost per successful task rising means waste. Check failed attempts and loops first."]]], "formula": "Net hours = (Successful tasks × Hours saved per task) − AI cost in hours", "watch": "Usage can look great while net hours stay flat. Count only tasks that succeeded, and include the time people spend checking the output.", "def": "An AI value tree breaks one goal, the working hours AI frees up after its cost, into the drivers underneath: impact, cost, adoption, quality and data. It shows whether AI is paying off and which driver to fix."},
  {"id":"phases","why":"Trust in an AI tool is built one phase at a time and lost in one bad week. A spending cap and a success measure at each phase mean that if the tool fails, it fails small, and if it succeeds, you have evidence for the next investment.","example":"A law firm pilots an AI tool to summarise contracts. In the prototype phase, one practice group uses it, a lawyer reads every summary, spending is capped, and the success measure is 95% of summaries rated accurate. In the integrate phase, it connects to the document system and three practice groups use it with the same review. In the scale phase, summaries of standard contract types go out with spot checks only, and the firm adds clause comparison as a new use.","name":"Phased Rollout","what":"Scales an AI tool without losing trust.","steps":["**Prototype:** use it for one narrow task, with a person reviewing every output.","**Integrate:** connect it to your real systems and data, and let a wider group use it.","**Scale:** automate the parts that proved reliable, then add new uses.",["Before each phase, set two things:",["a **cost limit:** the most you'll spend","a **success measure:** the result that lets you move on, such as 95% of answers correct"]],"Move to the next phase only when the success measure is met."],"def":"A phased rollout brings in an AI tool in stages. Each stage proves the tool works before more people depend on it, and trust grows along with use.","watch":"A finished-looking vendor demo is the usual reason the prototype phase gets skipped. Run it anyway."},
  {"id":"risk","why":"A team that tries to fix every risk before launch never launches. A team that fixes none of them launches into a scandal. A score gives you a short list to act on and a defensible reason for what you fixed first.","example":["A retailer launching an AI shopping assistant lists four risks and scores each one.", "Out-of-stock recommendation = likely 4 × minor 2 = 8 → give it an owner", "Wrong price quoted = possible 3 × serious 4 = 12 → owner and a plan", "Another customer's order history shown = unlikely 2 × severe 5 = 10 → owner and a plan", "Unsafe advice about using a product = possible 3 × severe 5 = 15 → fix before launch", "Only the last one blocks the launch. The other three get owners and a date to recheck."],"name":"Risk Scoring","what":"Decides which AI risks to fix before launch.","steps":[["List what could go wrong. Common risks:",["wrong or made-up answers","private data leaking","breaking a law or regulation","users losing trust"]],"Score each risk from 1 to 5 on **likelihood** (how likely it is to happen) and from 1 to 5 on **impact** (how much harm it would do).","Score = likelihood × impact. The result runs from 1 (rare and minor) to 25 (almost certain and severe). A risk that's likely (4) and severe (5) scores 4 × 5 = 20.",["Act on each risk by its score:",["**15 to 25:** fix it before launch.","**8 to 14:** give it an owner and a plan to reduce it.","**1 to 7:** keep an eye on it and recheck after launch."]]],"def":"Not every risk deserves the same attention. Scoring them shows which ones to fix before launch and which ones to watch.","watch":"A score is a snapshot. A product change can move a risk from 6 to 20. Score again after every major release."}
 ]},
{id:"leadership",name:"Career & Influence",q:"How do I land the role and grow in it?",idea:"Careers are built on **clear communication and real relationships**. Land the role first, then grow in it by earning trust and sponsorship.",use:["You have an interview coming up","You want a network that doesn't feel transactional","You're starting a new job or internship","You need people to back your idea or your work"],
 tools:[
  {"id":"interviews","name":"Interview Answers","what":"Structures answers so they land.","steps":[["**Behavioral questions** (“Tell me about a time…”): use **STAR**.",["**Situation:** the context, in a sentence or two","**Task:** what you were responsible for","**Action:** what you did. Spend most of your time here.","**Result:** what happened, with a number if you can"]],"**Product or case questions:** walk through the problem, the users, the constraints, possible solutions, the trade-offs and your recommendation.","**Lead with the answer:** give your recommendation first, keep the context brief and group your supporting points in threes."],"def":"A clear structure keeps you focused under pressure and makes your answer easy to remember."},
  {"id":"networking","name":"The Networking Loop","what":"Builds relationships that turn into advocacy.","steps":["**Know your why:** tie your outreach to a longer-term goal. Reaching out only when you need a job feels transactional.",["**Group your contacts:**",["senior leaders, best reached through introductions","recruiters and coordinators, who open the first door","peers who share your background or path"]],"**Keep notes** after every conversation: their role, details worth remembering and what they suggested.","**Follow up like a friend:** share an article or an introduction they'd value, celebrate their news and tell them how their advice turned out.","**Let advocacy follow:** referrals and introductions come naturally once you've invested in the relationship."],"watch":"Quality beats volume. One good conversation tied to your goal is worth more than twenty.","def":"The networking loop builds professional relationships that last and, over time, turn into people who recommend you. It works best when you start well before you need anything."},
  {"id":"thanks","name":"Thank-yous and Follow-ups","what":"Closes every conversation well.","steps":["Send a thank-you note the same day, or within 24 hours.","Mention one specific moment or idea from the conversation to make it clearly personal.","About a week after an interview, follow up: say what you enjoyed, restate your interest and ask politely about next steps."],"def":"How you close a conversation is often what people remember. A prompt, specific thank-you and a well-timed follow-up keep the connection warm."},
  {"id":"mentors","name":"Working with Mentors","what":"Makes mentorship a two-way relationship.","steps":["Bring a specific challenge and a specific ask to each conversation. “Any advice?” is too broad to answer well.","Offer value in return, such as a perspective they don't have, knowledge of a market or a skill.","Book the next conversation before the current one ends."],"def":"Mentorship works best when you manage it. Bring focus to each conversation and give value back."},
  {"id":"new-role","name":"Starting a New Role","what":"Sets up a strong first few months.","steps":["Ask your manager what great looks like in this role and what the team is trying to achieve this year.","Set small, realistic weekly goals and review them honestly each week.",["Send short weekly updates in three parts:",["what I did","what's next","what's blocking me"]],"Ask a trusted colleague to review important emails before they go to senior people.","Make time to meet people across the organization, including alumni from your school."],"def":"The first few months in a new role shape how people see you. A deliberate start builds trust quickly."},
  {"id":"feedback","name":"Feedback and Hard Moments","what":"Keeps conversations productive under pressure.","steps":["**When you disagree:** start from the goal you share, then check that you've understood their view before giving yours.","**When you get criticism:** listen fully, thank them and ask one clarifying question before responding.","**When you feel pushed:** slow down before you reply. The habits in Staying Steady, in the Negotiation playbook, work here too."],"def":"Hard conversations go better with a plan. These three moves keep them productive."},
  {"id":"stakeholders","name":"Lead with Their Value","what":"Gets alignment by showing each person what's in it for them.","steps":["List everyone affected by your idea or decision, including people outside your team.","For each person, write what they gain and what they worry about losing.","Shape your message to each person around their gain, and address their worry directly.","Look at everyone around a product: the people who pay for it, use it, approve it and deliver it. Each needs a reason to say yes."],"def":"People back ideas when they can see what's in it for them. Leading with their value means shaping your message around what each person gains."}
 ]}
];

/* ---------- GLOSSARY ---------- */
const GLOSS = [
 ["Route to market", "The path a product takes from the company to the buyer. Field sales, inside sales, self-serve, partners or marketplaces."],
 ["Account-based marketing", "Treating a short list of target companies as markets of one, with research and messages for each person in the buying committee."],
 ["Buying committee", "The group of people inside a company who together decide a purchase. Each has a role and a concern of their own."],
 ["Reference call", "A conversation between a prospect and an existing customer, with no seller present, used to close business deals."],
 ["Brand equity", "The value a brand adds beyond the product itself. Built in four layers, awareness, associations, perceived quality and loyalty."],
 ["Unaided awareness", "The share of people who name a brand without being prompted when asked about its category. The strictest test of awareness."],
 ["Share of wallet", "The share of a customer's spending in a category that goes to one brand."],
 ["Line extension", "A new version of an existing product in the same category, such as a new flavour, size or format."],
 ["Brand extension", "Taking an existing brand into a new product category. Works when the brand's position carries over."],
 ["Cannibalisation", "Sales a new product takes from the company's own existing products rather than from competitors."],
 ["Value-based pricing", "Setting a price from what the product is worth to the customer compared with their next best option, rather than from cost or from competitors."],
 ["Willingness to pay", "The most a customer would pay for a product. Measured through price-threshold or trade-off surveys, never assumed."],
 ["Cost-plus pricing", "Adding a fixed margin to what a product costs to make. Simple, and blind to what the customer values."],
 ["SAFE", "Simple agreement for future equity. Money invested now that turns into shares at the next priced round, with no interest or repayment date."],
 ["Convertible note", "A loan to a start-up that converts into shares at the next priced round, usually at a discount and often under a valuation cap."],
 ["Valuation cap", "The highest company valuation at which a SAFE or convertible note will convert into shares. Protects early investors if the next round prices high."],
 ["Pre-money and post-money", "A company's value before new money comes in, and after. Post-money = pre-money + amount raised."],
 ["Dilution", "The fall in each existing owner's share of the company when new shares are issued. Amount raised ÷ post-money valuation."],
 ["Cap table", "The list of who owns what share of a company, updated after every round and option grant."],
 ["Product-market fit", "When a product has found customers who keep using it and tell others. Seen in a flattening retention curve and growth you did not pay for."],
 ["Retention curve", "The share of a group of customers who started together that is still active each month after. Flattening is the goal."],
 ["Riskiest assumption", "The belief an idea depends on that is most likely to be wrong and most damaging if it is. Test it first."],
 ["MVP (minimum viable product)", "The smallest version of a product that lets you test whether customers want it. Built to learn, not to impress."],
 ["CAC (customer acquisition cost)", "Sales and marketing spend ÷ new customers won in the same period. What it costs to win one customer."],
 ["LTV (lifetime value)", "What one customer is worth over their whole relationship with you. (Monthly revenue per customer × gross margin) ÷ monthly churn."],
 ["CAC payback", "How many months it takes for a customer's gross profit to repay what it cost to win them. CAC ÷ monthly gross profit per customer."],
 ["ARR (annual recurring revenue)", "Subscription revenue a company expects every year from current customers. MRR × 12. Excludes one-off fees."],
 ["MRR (monthly recurring revenue)", "Subscription revenue a company expects every month from current customers."],
 ["Bookings", "The value of contracts signed in a period, whether or not the product has been delivered yet. Larger than revenue early on."],
 ["Churn", "The share of customers, or revenue, lost in a period. Customers lost in the month ÷ customers at the start."],
 ["Net revenue retention (NRR)", "Revenue from last year's customers today, as a share of what they paid then, after upgrades, downgrades and churn. Above 100% means customers grow on their own."],
 ["Runway", "How many months a company can keep going at its current burn rate. Cash in the bank ÷ net monthly burn."],
 ["Token (AI)", "A small chunk of text, often part of a word, that AI models read and write. AI usage is usually billed per token."],
 ["Golden set", "A fixed list of test questions with known correct answers. Scoring AI against it shows whether quality holds over time."],
 ["Eval (AI)", "A repeatable test that checks whether an AI tool gives correct, safe answers. Short for evaluation."],
 ["Semantic layer", "Software that sits between data and the people or AI asking questions. It applies one shared definition for each metric, and everyone gets the same number."],
 ["Ontology", "A formal, machine-readable model of what business terms mean and how they relate."],
 ["Knowledge graph", "A network of real facts linked by defined relationships, such as which customer holds which account."],
 ["Medallion architecture", "A way to stage data in three steps: raw (bronze), cleaned (silver) and business-ready (gold)."],
 ["Data lineage", "A record of where a piece of data came from and every step it went through."],
 ['Willingness to pay','The highest price a customer would pay for a product. Asking about it directly helps set prices.'],
 ['Standard deviation','A measure of how spread out numbers are around their average. In investing, it measures how much returns swing.'],
 ['Required return','The minimum yearly return you\'d accept for an investment at its level of risk. Also called the hurdle rate.'],
 ['Pareto principle','The pattern where a few causes drive most of the effect, often about 80% of results from 20% of causes. Also called the 80/20 rule.'],
 ['Operating cash flow','The cash a business generates from its normal operations, before any borrowing or investing.'],
 ['Net debt','A company\'s debt minus its cash.'],
 ['Money multiple','What an investor gets back divided by what they put in. Turning $10 into $25 is a 2.5 times money multiple.'],
 ['Fine-tuning (AI)','Training an existing AI model further on your own examples so it fits your task, style or data better.'],
 ['Event study','A method that measures how a one-time event, such as an announcement, moved a stock by comparing its returns with the overall market before and after.'],
 ['Depreciation','Spreading the cost of a physical asset, such as a machine or building, over the years it is used. It lowers reported profit without using cash.'],
 ['Amortization','Spreading the cost of an intangible asset, such as a patent or software, over the years it is used.'],
 ['Acquisition premium','The amount a buyer pays above a company\'s market value to win control of it.'],
 ['Agent (AI)','An AI system that works toward a goal by taking actions, such as searching, booking or updating records, often over several steps.'],
 ['Anchor','The first number put on the table in a negotiation. It tends to pull the final outcome toward it.'],
 ['Asset turnover','Revenue divided by total assets. It shows how much in sales a company generates from what it owns.'],
 ['Assets','Everything a company owns that has value: cash, inventory, equipment, buildings, patents.'],
 ['Basis point','One hundredth of a percentage point. 50 basis points equals 0.5%.'],
 ['BATNA','Best alternative to a negotiated agreement. What you will do if this deal falls through. The better it is, the more power you have.'],
 ['Beachhead','A small, specific market segment a startup targets first, to win clearly before expanding.'],
 ['Bias (in data)','A systematic error that makes results lean one way, for example when some groups are missing from a survey.'],
 ['Break-even','The point where total revenue equals total costs. You neither make nor lose money.'],
 ['Burn rate','How much cash a company spends each month beyond what it brings in.'],
 ['Buying committee','The group of people inside a business who together decide on a purchase.'],
 ['CAGR (compound annual growth rate)','The steady yearly growth rate that would take a number from its starting value to its ending value over a period. It smooths out ups and downs, which lets you compare growth across different spans of time.'],
 ['Cannibalization','Sales a new product takes away from a company\'s existing products instead of from competitors.'],
 ['Cash flow','The cash moving in and out of a business over a period, as opposed to profit on paper.'],
 ['Champion','A person inside a customer\'s organization who wants your product and argues for it internally.'],
 ['Channel','A route to reach or sell to customers, such as search ads, a retailer, a distributor or a sales team.'],
 ['Chi-square test','A statistical test that checks whether two categories are related, or whether a sample matches a population.'],
 ['COGS (cost of goods sold)','The direct costs of making the products a company sold, such as materials and factory labor.'],
 ['Competitive advantage','Something that lets a company win customers or earn higher profits than rivals over time.'],
 ['Contribution margin','Sales minus variable costs. The money each sale brings in to help pay fixed costs and then profit.'],
 ['Cost of equity','The return shareholders expect for the risk of owning a company\'s stock.'],
 ['Credit rating','A grade from agencies such as S&P or Moody\'s showing how likely a borrower is to repay. AAA is safest.'],
 ['Discount rate','The rate used to convert future money into today\'s value. Higher risk means a higher rate.'],
 ['Diversification','Spreading investments across assets that don\'t move together. One loss then can\'t sink the whole portfolio.'],
 ['Dividend','A share of profits a company pays out to its shareholders, usually in cash.'],
 ['EBITDA','Earnings before interest, taxes, depreciation and amortisation. Operating profit + depreciation + amortisation. A measure of the cash the operations generate before financing and accounting choices, which is why buyers price companies as a multiple of it.'],
 ['Economic buyer','The person in a buying committee who controls the budget and gives final approval.'],
 ['Enterprise value','The value of a whole company: its equity plus its debt, minus its cash.'],
 ['Equity','The owners\' stake in a company: what would be left if all debts were paid. Also called shareholders\' equity.'],
 ['Equity multiplier','Total assets divided by equity. It shows how much of the company is funded with debt.'],
 ['Exit','How investors eventually get their money back, usually through a sale of the company or a stock market listing.'],
 ['Exit multiple','The price a future buyer is expected to pay, expressed as a multiple of EBITDA or earnings.'],
 ['Fixed costs','Costs that stay the same whatever you sell, such as rent, salaries and insurance.'],
 ['Go-to-market','The plan for how a product reaches and wins its first customers: who, where, what price and through which channels.'],
 ['Grounding (AI)','Tying an AI\'s answers to trusted sources such as your own documents. It then answers from facts instead of guessing.'],
 ['Gross margin','Revenue minus cost of goods sold, as a share of revenue. What\'s left after making the product.'],
 ['Hallucination (AI)','When an AI states a false or invented detail as if it were true.'],
 ['Human in the loop','A design where a person reviews or approves AI output at key points before it takes effect.'],

/* flow(): stages left to right, one box per tool, so every tool in the playbook appears in its sketch */
function flow(pid,title,stages){
  const p = PB.find(x=>x.id===pid), name = id => p.tools.find(t=>t.id===id).name;
  const n = stages.length, gap = 15, W = 720, cw = (W-gap*(n-1))/n, nodes = [], arrows = [];
  let most = 0;
  stages.forEach(([lab,sub,ids],i) => {
    const x = 20 + i*(cw+gap);
    nodes.push(['h'+i,x,20,cw,80,(i+1)+' '+lab,sub,ids[0],i===0]);
    ids.forEach((id,j) => nodes.push(['n'+i+'_'+j,x+8,128+j*70,cw-16,60,name(id),'',id,false,'']));
    if (i<n-1) arrows.push([x+cw+1,55,x+cw+gap-1,55,0]);
    most = Math.max(most,ids.length);
  });
  return {h:128+most*70+6,title,nodes,arrows};
}
/* biggest size (up to cap) at which a label fits a box width, on one line or split over two */
function fitLabel(label, w, cap){
  const est = l => l.length*0.43, one = {size:Math.min(cap, w/est(label)), lines:[label]};
  const parts = label.match(/[^\s-]+-?/g) || [label]; let best = one;
  for (let k=1;k<parts.length;k++){
    const join = a => a.reduce((s,t,i) => s + (i && !a[i-1].endsWith('-') ? ' ' : '') + t, '');
    const lines = [join(parts.slice(0,k)), join(parts.slice(k))], size = Math.min(cap, w/Math.max(...lines.map(est)));
    if (size > best.size + .5) best = {size, lines};
  }
  return best;
}

function scrollToTool(tid){
  const [id, find] = String(tid).split('#');
  const t = document.getElementById('t-'+id); if (!t) return;
  let target = t;
  if (find) { const li = [...t.querySelectorAll('ol>li')].find(l => l.textContent.startsWith(find)); if (li) { target = li; li.classList.add('flash'); setTimeout(()=>li.classList.remove('flash'), 2400); } }
  target.scrollIntoView({behavior: reduce()?'auto':'smooth', block: find ? 'center' : 'start'});
}

function renderSearch(q){
  cleanup(); setNav(null); setCrumb('Search');
  const s = q.toLowerCase(); const hits = [];
  PB.forEach(p => p.tools.forEach(t => { const hay = [t.name,t.what,t.def||'',(t.steps||[]).flat(2).join(' '),t.ex||'',t.formula||''].join(' ').toLowerCase(); if (hay.includes(s)) hits.push([p,t]); }));
  const gh = GLOSS.filter(([t,d]) => t.toLowerCase().includes(s));
  view.innerHTML = `<section class="gut sec"><div class="in">${gh.length?`<div class="sechead"><h2>In the glossary</h2></div><div class="results" style="margin-bottom:34px">${gh.map(([t,d])=>`<button data-g="${esc(t)}"><b>${esc(t)}</b><small>${esc(d)}</small></button>`).join('')}</div>`:''}<div class="sechead"><h2>${hits.length} ${hits.length===1?'tool':'tools'} for “${esc(q)}”</h2></div>
   <div class="results">${hits.map(([p,t])=>`<button data-p="${p.id}" data-t="${t.id}"><b>${esc(t.name)}</b><small>${esc(p.name)}. ${md(t.what)}</small></button>`).join('') || '<p class="muted">No tools match. Try a framework name like SWOT, or a word like price.</p>'}</div></div></section>`;
  view.querySelectorAll('.results button[data-p]').forEach(b => b.onclick = () => { $('#q').value=''; go(b.dataset.p,b.dataset.t); });
  view.querySelectorAll('.results button[data-g]').forEach(b => b.onclick = () => { $('#q').value=''; try { history.replaceState(null,'','#glossary'); } catch(e){} renderGlossary(b.dataset.g); });
}
function go(p,t){
  const h = t ? `${p}.${t}` : (p||'');
  try { history.replaceState(null,'',h?'#'+h:location.pathname); } catch(e){}
  route(h);
}
function route(h){
  const [p,t] = (h||'').split('.');
  if (p==='glossary') renderGlossary(); else if (p==='about') renderAbout(); else if (PB.some(x=>x.id===p)) renderPlaybook(p,t); else { renderHome(); window.scrollTo({top:0}); }
}
/* light / dark */
$('#about-link').onclick = () => go('about');
$('#home-link').onclick = $('#home-link-m').onclick = () => { $('#q').value=''; homeFilter='all'; go(''); };
let st; $('#q').addEventListener('input', e => { clearTimeout(st); const v=e.target.value.trim(); st=setTimeout(()=> v ? renderSearch(v) : route(location.hash.slice(1)),120); });

/* ---------- sound: soft clicks on buttons, always on (like recent.design) ---------- */
const Sound = (() => {
  let ctx = null;
  const ac = () => { if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); } if (ctx.state === 'suspended') ctx.resume(); return ctx; };
  const tone = (f1, f2, dur, vol, type='sine', delay=0) => {
    const c = ac(); if (!c) return; const t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  };
  return { play(kind){
    try {
      if (kind === 'open') { tone(620, 760, 0.07, 0.04, 'sine'); tone(930, 1100, 0.08, 0.025, 'sine', 0.045); }
      else if (kind === 'back') tone(760, 560, 0.08, 0.035, 'sine');
      else tone(1250, 950, 0.035, 0.03, 'triangle');
    } catch(e){}
  }};
})();
document.addEventListener('click', e => {
  const t = e.target.closest('button,a,.sk .node'); if (!t) return;
  if (t.matches('.story,.nextblock,.navgroup button,.results button')) Sound.play('open');
  else if (t.matches('.back,#crumb-home,.brand')) Sound.play('back');
  else Sound.play('tick');
}, true);

route(location.hash.slice(1));
</script>
