  {"id":"bonds","name":"Bond Yield and Spread","what":"Tells you whether a bond pays enough for its risk.","def":"This test shows whether a company's bond pays enough extra interest to make up for the risk of lending to that company, compared with lending to the US government.","why":"A bond's yield on its own tells you little. A 6% yield is generous when government bonds pay 2% and thin when they pay 5%. The spread strips out the part of the yield that everyone gets and leaves the part you are paid for trusting this particular borrower. Compared with bonds of the same rating, it tells you whether the market is offering a bargain or warning you.","formula":"Spread = Bond yield to maturity − Treasury yield (same maturity)","steps":["Find the bond's **yield to maturity**, the yearly return you'd earn if you bought it at today's price and held it until it's repaid. In Excel, use the YIELD function.","Find the yield on a US **Treasury** bond that matures at about the same time. Treasuries are treated as risk-free.","Subtract the Treasury yield from the bond's yield. The difference is the **spread**, your extra reward for taking on the company's risk.","Compare that spread with the average for bonds with the same **credit rating**, a grade such as AAA or BB that shows how likely a borrower is to repay.","Read the spread against its peers. Wider than average means a possible bargain or a risk the market has priced before the rating agencies. Narrower means you are paid less than usual for the risk."],"example":["The snack company's 7-year bond is priced to yield 5.9%. An investor checks whether that pays for the risk.","7-year Treasury yield = 4.2%","Spread = 5.9% − 4.2% = 1.7 percentage points","Average spread for BBB-rated bonds of the same maturity = 1.3 percentage points","The bond pays 0.4 points more than its rating peers. Either the market sees the new plant's debt as a risk the rating has not caught up with, or the bond is cheap. The investor reads the debt affordability numbers before deciding which."],"watch":"A spread that looks generous often is not. Check whether leverage, a lawsuit or a sector problem explains it before you buy the yield."},
  {"id":"sharpe","name":"Sharpe Ratio","what":"Judges a return against the risk taken to earn it.","def":"The Sharpe ratio measures how much return an investment earns for each unit of risk it takes. It lets you compare investments fairly, even when one is much riskier than another.","why":"A fund that returned 14% has not beaten one that returned 10% until you know how much each one swung to get there. Risk is the price of return, and the Sharpe ratio is the price tag. It is also the reason diversification works. Adding assets that move differently lowers the swings without lowering the return by as much, which pushes the ratio up.","formula":"Sharpe = (Portfolio return − Risk-free rate) ÷ Volatility","steps":["Gather the investment's monthly returns over several years.","Calculate its average yearly return.","Calculate its **volatility**, how much its returns swing up and down, measured as standard deviation.","Sharpe ratio = (return − **risk-free rate**) ÷ volatility. The risk-free rate is what you'd earn on short-term Treasury bills.","Compare the result with a benchmark, such as the S&P 500.","Read it against a benchmark such as the S&P 500. Higher is better, more return for each unit of risk. To raise it, add assets that don't move together. Diversifying cuts volatility without giving up much return."],"example":["An investor compares a consumer-staples fund that holds the snack company against the S&P 500. The risk-free rate is 4%.","Fund Sharpe = (9% − 4%) ÷ 10% volatility = 0.50","S&P 500 Sharpe = (11% − 4%) ÷ 16% volatility = 0.44","The index earned more, and the fund earned more per unit of risk. For an investor who cannot stomach a 16% swing, the fund is the better holding. Adding a bond fund that moves differently from both would raise the ratio further."],"watch":"Sharpe ratios computed over a calm period flatter everything. Use at least one full market cycle, including a bad year."},
  {"id":"affordability","name":"Debt Affordability","what":"Tests whether a business can safely carry a loan.","def":"This tests whether a business earns enough cash to keep up with loan payments, including if interest rates rise. Lenders run the same check before they lend.","why":"Debt is cheap growth until the year it is not. The coverage ratio asks the question a lender asks. After every other bill, does the business generate enough cash to pay this loan, and would it still if rates rose a point and sales had a bad year. Running the test yourself, before the bank does, keeps the borrowing decision in your hands.","formula":"Coverage ratio = Operating cash flow ÷ Yearly loan payments","steps":["Find the business's **operating cash flow**, the cash it generates from its normal operations in a year.","Add up the yearly loan payments, both interest and repayment, including the new loan.","Divide operating cash flow by those payments. This is the **debt service coverage ratio**, how many times over the business can cover its payments.","Recalculate with the interest rate 1 percentage point higher. Check that the ratio still holds up.","Name the trade-off. A smaller loan is safer but funds less growth.","Read the ratio. Above about 1.25 is comfortable, and many lenders look for at least that. Close to 1 means one bad year could make payments hard to meet. Below 1 means the business can't cover its payments from operations."],"example":["The snack company wants a $50M loan for the plant, on top of its existing debt.","Operating cash flow = $60M a year","Existing yearly loan payments = $20M, new loan payments = $8M, total = $28M","Coverage ratio = $60M ÷ $28M = 2.14","With rates 1 point higher, new loan payments = $8.5M and coverage = $60M ÷ $28.5M = 2.11","If a bad year cuts operating cash flow to $45M, coverage = $45M ÷ $28.5M = 1.58","The loan is affordable with room to spare, even in a weak year. The treasurer still prices a $40M loan as the alternative, because the extra $10M buys a second line the plan can live without."],"watch":"Operating cash flow in a good year is the number that gets a loan approved. Operating cash flow in the worst recent year is the one that decides whether it gets repaid."},
  {"id":"buyout","name":"Buyout Returns","what":"Checks whether an acquisition returns enough to the investor.","def":"This checks whether buying a company, often with a lot of borrowed money, will pay back enough to the investors who put in their own cash. Private equity firms use it to judge buyouts.","why":"A buyout is bought with borrowed money and sold five years later, and the investor's return is whatever is left after the debt is repaid. That structure is why private equity cares about three things above all. The price paid, the growth in operating profit, and the multiple a buyer will pay at exit. The model makes each one explicit, which is also how you spot a deal that only works if the exit multiple rises.","formula":"Enterprise value = Equity value + Net debt","steps":["Find the **entry price** of the whole company, called its **enterprise value**. Enterprise value = owners' equity + debt − cash.",["Work out today's **EBITDA**, then project it five years out. EBITDA = operating profit + depreciation + amortisation. Buyers use it instead of net income because it ignores how the company is financed and when it bought its assets, which makes two companies' operating engines comparable.",["**Depreciation** is the yearly write-down of physical assets such as plant and vehicles.","**Amortisation** is the same write-down for intangible assets such as software or acquired brands."]],"Estimate the **exit value**. Exit value = future EBITDA × **exit multiple**, the price-to-EBITDA ratio you expect a buyer to pay.","Subtract the debt still owed at exit. What's left is the investors' **exit equity**.","Money multiple = exit equity ÷ cash the investors put in.","List the specific moves that would grow EBITDA, such as new products, better margins or selling directly to customers.","Read the multiple. Investors often look for about 2 to 3 × over five years. If the return only works when you sell at a higher multiple than you paid, treat that as a risk rather than a plan."],"example":["A private equity firm considers buying the snack company.","EBITDA = $38M operating profit + $10M depreciation + $2M amortisation = $50M","Enterprise value at entry = $300M equity + $100M net debt = $400M, or 8 × EBITDA","Funded with $250M of new debt and $150M of the firm's own cash","Year-5 EBITDA after a margin programme and two new lines = $70M","Exit value at the same 8 × multiple = $70M × 8 = $560M","Exit equity = $560M exit value − $170M debt still owed = $390M","Money multiple = $390M ÷ $150M = 2.6 ×","The deal clears the 2 to 3 × range without assuming a higher exit multiple. The return depends on the EBITDA growth, and the firm's plan names the moves that deliver it."],"watch":"Debt magnifies the return in both directions. If EBITDA falls instead of rising, the equity absorbs the whole loss before the lenders feel any of it."}
 ]},
{id:"data",name:"Data & Research",q:"Can I trust this finding?",idea:"A finding earns trust only once you know **who is in the data, who is missing and what else could explain the result**. Start with a precise question, listen to the right people, pull the right data, run the analysis that isolates the real driver, then show it in a way someone can act on.",use:["Designing a survey or study","Someone hands you a striking statistic","Choosing which analysis to run"],
 tools:[
  {"id":"process","name":"The 8-Step Research Process","what":"Takes you from a question to a decision.","def":"The research process takes you from a business question to a decision backed by data, in eight steps. Use it to plan your own study or to judge someone else's.","why":"Most bad conclusions were decided at step one, when the question was vague, or skipped at step four, when nobody asked what else could explain the result. The eight steps exist to slow those two moments down. They also give you a checklist for reading other people's research. A report that cannot say what decision it informs, or what alternative explanations it ruled out, has not earned its conclusion.","steps":["**Question:** what decision will this research inform? If no decision changes with the answer, stop here.","**Outcome:** what exactly will you measure to answer it? For example, monthly sales per store.",["**Hypothesis:** what do you expect to find?",["The **null hypothesis** is the opposite, that there's no effect at all. Your data has to give you good reason to reject it."]],"**Alternatives:** what else could explain the result? Most people skip this step, and it catches most bad conclusions.","**Measure:** define the units, the time period and any cutoffs before you collect data.","**Sample:** decide who or what you'll collect data from, and check that it represents the group you care about.","**Method:** choose the test that fits the question. See Choosing a Method.","**Interpret and recommend:** say how big the effect is in everyday words, how sure you are and what to do about it."],"example":"A gym chain with 40 clubs is losing members, and the operations director wants to know whether it is a pricing problem or a scheduling problem. Question, should the chain cut prices or add classes. Outcome, monthly cancellations per club. Hypothesis, clubs with fewer peak-hour classes lose more members. Null, class count makes no difference. Alternatives, local competition, club age, a price rise last spring. Measure, cancellations per 100 members per month, over the last twelve months. Sample, all 40 clubs. Method, regression on class count, price and competition. Interpret, in members and dollars, with the confidence stated.","watch":"A hypothesis written after the data comes in is a story, and data can be made to fit any story. Write it first."},
  {"id":"methods","name":"Choosing a Method","what":"Matches the question to the right test.","def":"Each kind of question has a statistical test built for it. Choosing the right one keeps you from drawing a conclusion the data can't support.","why":"The test is the part most people outsource to software and never question, and it is where a finding either holds or quietly collapses. Each test answers one kind of question. A t-test on a relationship, or a regression on a two-group comparison, produces a number that looks like evidence and is not. Matching the question to the test first takes a minute and is the whole difference.","steps":[["**Comparing the averages of two groups,** such as sales in stores with and without a promotion.",["use a **t-test**"]],["**Checking whether two categories are related,** such as region and product choice, or whether a sample matches a population.",["use a **chi-square test**"]],["**Understanding how several factors together drive an outcome,** such as price, ads and season on sales.",["use **regression**","read each factor's direction and size","read its **p-value**. Below 0.05 suggests the effect is unlikely to be chance","read **R²**, the share of the ups and downs in the outcome that the model explains"]],["**Measuring the impact of a one-time event,** such as an announcement, on a stock.",["use an **event study**, which compares the stock's returns before and after the event with the overall market"]]],"example":["The chain's question is what drives cancellations across 40 clubs, with several factors at once, which calls for regression.","Cancellations per 100 members = 2.1 − 0.18 × peak classes per week + 0.04 × price + 0.9 × competitors within 2 miles","Peak classes p-value = 0.003, price p-value = 0.41, competitors p-value = 0.02","R² = 0.46","Each extra peak-hour class a week is linked to 0.18 fewer cancellations per 100 members, and the effect is unlikely to be chance. Price shows no reliable effect. The model explains under half the variation, which is enough to act on scheduling and a reason to keep looking at the rest."],"watch":"A significant model can still explain little. A regression with R² of 0.20 leaves 80% of the variation unexplained."},
  {"id":"query","name":"Pulling Data with SQL","what":"Turns a business question into a database query, and checks the answer before you trust it.","def":"Most of the data a business has is already sitting in its systems, and SQL is the language for asking those systems a question. Tools such as Tableau and Power BI write SQL for you behind a drag-and-drop screen, which is why the thinking matters more than the syntax. A query is four decisions. What one row represents, which rows to keep, how tables connect and what to count.","why":"A query always returns a number, and the number always looks right. The errors are in the definition. A join that doubles rows, a filter that drops last month's cancellations because they were logged this month, a “customer” that means three different things in three tables. Writing the definition before the query, and checking the result against a known total afterwards, catches nearly all of it. The query below is the one in the example, in plain SQL.","formula":"SELECT club, month, COUNT(*) AS cancellations\nFROM memberships\nWHERE end_date BETWEEN '2025-01-01' AND '2025-12-31'\n  AND reason <> 'transfer' AND staff = false\nGROUP BY club, month","steps":["Write the question as a sentence with every term defined. “Cancellations per 100 members per month, by club, for the last twelve months, where a cancellation is a membership ending for any reason other than a transfer.”","Decide the **grain**, what one row of the answer represents. One row per club per month, in this case. Everything else follows from it.",["Name the four parts of the query. In SQL they map to four clauses.",["**Source**, the FROM clause, which tables hold members, memberships and clubs","**Filters**, the WHERE clause, the date window and the rows to leave out, such as staff memberships and transfers","**Joins**, the JOIN clause, how the tables connect, and whether a join could multiply rows","**Aggregation**, the GROUP BY clause, what gets counted, summed or averaged at the chosen grain"]],"Run it, then check the total against a number you already trust, such as finance's cancellation count for one month. If they differ, find out why before you go further.","Look at the extremes. The best and worst clubs, the biggest month. An extreme that has no story behind it is usually a data problem.","Save the definition with the result. The query that produced a number is part of the finding, and the next person needs it."],"example":["The chain's analyst pulls cancellations from the membership system.","Grain = one row per club per month, 40 clubs × 12 months = 480 rows","Filters = memberships ended between 1 Jan and 31 Dec, excluding staff and transfers between clubs","Joins = memberships to members for age and visit time, memberships to clubs for region and class count","Check = query total 9,200 against finance's figure of 9,214, a gap of 14 explained by two clubs that changed systems in March","Extreme = one club with 31 cancellations per 100 members in July, which turns out to be a pool closure, and it is flagged rather than removed","The 480-row table is the input to the regression and the Pareto chart. The definition is saved with it."],"watch":"A join that multiplies rows is the most common silent error. If a member has two memberships, a careless join counts them twice everywhere. Check the row count after every join."},
  {"id":"representativeness","name":"Representativeness Check","what":"Finds out who's missing from the sample.","def":"A sample is the group you collected data from. It's only useful if it looks like the larger group you want to learn about. This check finds out who is over- or under-represented.","why":"Every survey is answered by the people who chose to answer, and they are rarely a mirror of the people you care about. The engaged respond, the quiet leave. The check does not fix the sample. It tells you which findings to trust, which to caveat and who to chase next time.","steps":["Pick the traits that matter for your question, such as gender, region or company size.","Find the real population's mix for each trait, for example from census or industry data.","Compare your sample's mix with the population's. A **chi-square test** tells you whether a gap is too big to be chance.","Where a gap is real, add a caveat to any finding about that group.","Next time, close the gap by reaching out directly to the under-represented group."],"example":["The chain compares the 2,400 respondents with its 61,000 members on three traits.","Peak-hour members = 38% of respondents against 52% of all members","Members under 30 = 44% of respondents against 31% of all members","Region mix = within 2 points of the population on all three regions","The chi-square test says the age and visit-time gaps are too large to be chance. Peak-hour members, the group most likely to report full classes, are under-represented. The scheduling finding is reported with that caveat, and probably understates the problem. The next survey goes out through the booking app at peak times."],"watch":"A big sample is not a representative one. Two thousand answers from the wrong people are worse than two hundred from the right ones, because the number makes them look trustworthy."},
  {"id":"survey","name":"Survey Design","what":"Makes sure a survey can answer the question it's for.","def":"Small choices in wording and structure decide whether a survey's results can be trusted. Get them right before you send it.","why":"A survey is the cheapest way to turn a pattern from a few conversations into a number from hundreds of people. It is also the easiest research to get wrong, because once it is sent, nothing can be fixed. The question you forgot, the scale that changed halfway, the background question you did not ask, each one removes an analysis you will later want.","steps":["Write down the one decision the survey must inform. Then make sure you ask the central question directly. It's surprisingly easy to forget.","Use the same rating scale throughout. Decide on purpose whether to include a neutral middle option. Leaving it out pushes people to lean one way.","Add at least one open question. People will tell you things you didn't think to ask.","If price matters to the decision, ask about **willingness to pay**, the most they would pay.","Include the background questions you'll need to compare groups later, such as age, role or region. You can't add them after the survey closes."],"example":"The chain surveys 2,400 current and former members. The decision is whether to add classes or cut prices, and the central question is asked directly. “What is the main reason you would cancel or have cancelled?” with scheduling, price, facilities, moved away and other as options. Every rating uses the same 1 to 5 scale with no neutral middle, decided on purpose. One open question, “What would make you stay?” Willingness to pay is asked for the current membership and for one with guaranteed class access. Background questions capture club, membership length, age band and typical visit time, because the analysis will compare peak-hour and off-peak members.","watch":"A leading question gets the answer you hoped for and nothing you can use. “How much do you love our new classes?” is a compliment request, not research."},
  {"id":"qualitative","name":"Research Instruments","what":"Picks the right way to gather evidence for the question, then shows how to run a focus group and read across conversations.","def":"A research instrument is the method you use to gather evidence. Interviews, focus groups, surveys, observation, experiments and existing data each answer a different kind of question, and each has a cost. Choosing the instrument comes before designing it. The rules for a single interview are in Problem Framing, in the Innovation playbook, and survey design has its own tool next.","why":"Teams default to the instrument they know, usually a survey, and then wonder why the results are thin. A survey cannot tell you why, an interview cannot tell you how many, and neither can tell you what people actually do, which is often different from what they say. Matching the instrument to the question is the first research decision, and the one that decides whether the rest is worth doing.","steps":[["Pick the instrument for the question.",["**One-on-one interviews:** why people do what they do, and anything private or sensitive. Eight to twelve people. Use them first, before you know what to ask everyone.","**Focus groups:** how people react to a concept, the words they use and how opinions form in a group. Six to eight people, 60 to 90 minutes, one moderator who keeps the loud voice from running the room.","**Surveys:** how many people think or do a thing, and how groups differ. Hundreds of people. Use them once interviews have told you what to ask.","**Observation:** what people actually do, watched in their own setting. Use it when what people say and what they do are likely to differ, such as how staff really use a system.","**Experiments:** which of two options works better, tested on real behaviour. A/B tests on a website, a price tested in two regions, a conjoint survey that trades features against price. Use them when you can change one thing and hold the rest still.","**Existing data:** what has already happened, pulled from the company's own systems. Often the cheapest and most honest instrument, and the one most teams forget. Pulling Data with SQL covers it."]],"Sequence them. Interviews or observation to find the question, a survey or existing data to size it, an experiment to prove the fix.","For a focus group, write a discussion guide. Current behaviour first, then the concept or stimulus, then reactions. Keep the same guide across sessions or you cannot compare them.","Run two or three groups per customer segment. Stop when the third session tells you nothing the first two did not.","Read across sessions, never within one. Tag every quote with a theme and count how many people raised each theme unprompted. A pattern across sessions is evidence. One memorable quote is an anecdote.","Expect the simplest idea that fits people's existing routine to win. Groups often praise the ambitious concept and then describe a daily life it would never fit into."],"example":"The gym chain's question has three parts, and each gets its own instrument. Why members leave is a focus group question, because cancellers will compare experiences and the chain wants their words. The chain runs three groups of recent cancellers, one per region, with the same guide and a new class schedule as the concept. Across the sessions, fourteen of twenty-two raise the same theme unprompted. They could never get into a class after work. How many members share that problem is a survey question. Whether more classes fix it is an experiment, run later at twelve clubs. And what cancellations already look like by club is existing data, pulled before any of the above.","watch":"A focus group tells you what people say in front of others. For anything private, such as money or health, use interviews. For what people actually do, watch them."},
  {"id":"pareto","name":"Pareto Analysis","what":"Finds the few causes driving most of the effect.","def":"Pareto analysis finds the few causes behind most of a problem. It rests on the Pareto principle. Often about 80% of results come from about 20% of causes.","why":"Problems arrive as long lists, and long lists get fixed in the order someone shouts about them. Sorting causes by their contribution shows that a handful usually account for most of the effect. Fixing those first is how a small team gets a big result, and it also tells you which complaints to stop chasing.","steps":["List the causes and how much each contributes, such as delay minutes by reason, revenue by customer or complaints by issue.","Sort them from largest to smallest.","Add a running total, each cause's share added to all the ones before it.","Find where the running total crosses 80%. The causes up to that point are your short list.","Fix those first. They give the most improvement for the effort."],"example":["The chain sorts last year's 9,200 cancellations by the reason members gave.","Could not get into classes = 3,680, running total 40%","Moved away = 1,840, running total 60%","Price = 1,380, running total 75%","Facilities = 920, running total 85%","Twelve other reasons = 1,380, the remaining 15%","Three reasons cross 80%. One of them, moving away, cannot be fixed. The short list is class access and price, in that order, and class access alone is 40% of the problem."],"watch":"The chart shows what is large, not what is fixable. Cross off the causes you cannot change before you commit the team."},
  {"id":"viz","name":"Storytelling with Data","what":"Turns an analysis into a story someone will act on, with the right chart for each question and a dashboard that stays honest.","def":"A chart is an argument, and a sequence of charts is a story. The right chart makes a finding obvious in a glance. The story gives the finding a setting, a tension and a resolution, which is what makes a room decide rather than nod. Cole Nussbaumer Knaflic's book of the same name is the standard guide, and these steps follow its order. A dashboard is different. It monitors rather than persuades, and it needs its own rules.","why":"Analysis that nobody acts on was wasted, and whether it gets acted on usually comes down to one chart in one meeting. The common failures are a chart that shows everything and says nothing, a chart type chosen because the tool offered it, slides that walk through the analysis in the order it was done, and a dashboard that monitors twenty numbers nobody has decided what to do about. One question, one chart, one message, and a story with a point, is the rule that fixes all of them.","steps":["**Know the context.** Who is the audience, what do you need them to do, and what do they already believe. A finance director and an operations director need the same finding told two different ways.","**Write the big idea** in one sentence. Your point of view, what is at stake, and what you want them to do. If it takes two sentences, you have two ideas and should pick one.",["**Choose the chart built for the question.** Eight cover almost everything.",["**Compare categories:** a bar chart, sorted largest to smallest. The workhorse. Use it whenever the question is “which is bigger?”","**Show change over time:** a line chart, time on the horizontal axis. Several lines are fine if one is coloured and the rest are grey.","**Show a share of a whole, few parts:** a pie chart. There is no fixed limit, but the eye compares angles badly, so a pie works when it has a few slices, five at most, and one slice is the point. “Four in ten cancellations are class access” is a two-slice pie with the 40% coloured. Twelve cancellation reasons in a pie is a sorted bar chart waiting to happen.","**Show shares across many parts:** a treemap, rectangles sized by value and nested by group. Good for “where does the money go?” across dozens of products or clubs. Poor for exact comparison.","**Show how a total builds up or breaks down:** a waterfall chart, bars that step from a starting value through each addition and subtraction to the end. The chart for a bridge from revenue to profit, or from last year's members to this year's. Start at 61,000 members, up 7,100 for joins, down 9,200 for cancellations, end at 58,900. It is the one chart allowed to start its axis above zero, with a visible break, because the steps are the point.","**Show a relationship between two measures:** a scatter plot, one dot per thing, with a trend line if the relationship is real.","**Show how values are spread:** a histogram. The chart that reveals two groups hiding inside one average.","**Show two dimensions at once:** a heat map, a grid shaded by value, such as cancellations by club and by month. Patterns jump out that a table hides."]],"**Cut the clutter.** Gridlines, legends with one entry, 3D, borders, a second axis. Every mark that does not carry the message competes with it.","**Focus attention.** Colour one bar or one line and grey the rest. Write the message as the title. “Clubs with more peak classes lose fewer members” tells the reader what to see. “Cancellations by club” makes them work it out. Start bar charts at zero.","**Tell it as a story.** Setting, what the business is trying to do. Tension, what the data shows is going wrong. Resolution, what to do about it. Lead with the big idea when the audience is senior or short of time. Build to it when they need to be convinced.",["**Keep dashboards separate.**",["A **dashboard** monitors. It shows the few numbers someone owns, updated on a schedule, with a target or threshold on each, and it answers “is anything wrong?”","An **analysis** decides. It is a short story of charts that builds to one recommendation, made once, and it answers “what should we do?”"]]],"example":"The analyst has the regression and the Pareto result and needs the operations director, who already suspects price, to act. The big idea in one sentence. We are losing members because they cannot get into classes, and two more peak-hour classes a week at the twelve worst clubs will cut cancellations more than any price change. The story is three charts. Setting, a line titled “Cancellations have risen for four quarters.” Tension, a sorted bar titled “Four in ten cancellations are members who could not get into a class,” that bar coloured, the rest grey, with a small bar beside it titled “Price shows no reliable link.” Resolution, a scatter titled “Clubs with more peak classes lose fewer members,” one dot per club, the twelve worst labelled. The recommendation is the last line, in words. Two more charts sit in the appendix for anyone who asks. A two-slice pie, class access against everything else, with the 40% coloured. And a waterfall from 61,000 members in January, up 7,100 joins, down 9,200 cancellations, to 58,900 in December, which shows the chain is shrinking even though it is still signing people up. Afterwards, a dashboard tracks one number per club, cancellations per 100 members, with a threshold line. The director sees whether the classes are working without asking.","watch":"Walking the audience through the analysis in the order you did it is the most common storytelling mistake. They do not need your journey. They need your point, then the evidence for it."},
 ]},
{id:"marketing",name:"Marketing",q:"Who buys, and why us?",idea:"Marketing is the discipline of choosing **who you serve, what you promise them and how you reach them**. Understand the market, select your customer, shape the offer, take it to market, then extend what works.",use:["Positioning or launching a product","Pricing and picking channels","Extending a product line or entering a new market"],
 tools:[
  {"id":"5cs","name":"The 5Cs","what":"Maps the situation before any plan.","def":"The 5Cs is a checklist for understanding a market before you plan anything. It covers the five areas that shape every marketing decision.","why":"Most marketing plans start with the product and work outwards. The 5Cs force the opposite order. By the time you write the plan, you already know who the customer is, who else wants their money and which outside trend is about to change the rules. The two or three facts you carry forward are what make the rest of the plan specific instead of generic.","steps":[["Write a few lines on each area.",["**Customers:** who they are, what they need and how they decide to buy","**Company:** your strengths, limits and goals","**Collaborators:** partners, suppliers and channels that help you reach customers","**Competitors:** direct ones (same product), secondary ones (different product, same need) and indirect ones (competing for the same budget)","**Context:** economic, legal, technology and social trends"]],"Highlight the two or three facts that will shape your plan most. Carry them into STP."],"example":"A sparkling water brand that sells mostly online maps its situation before a push into grocery stores. Customers are 25 to 40, health-conscious and cutting back on soda. The company is strong online and weak on shelves. Collaborators are one national grocery chain willing to trial it and a regional distributor. Direct competitors are the other sparkling waters, secondary ones are diet sodas, indirect ones are the coffees and energy drinks competing for the same lunchtime dollar. Context is a new sugar tax and rising aluminium prices. Two facts shape everything that follows. Shoppers are leaving diet soda, and the brand has almost no presence where those shoppers buy.","watch":"A 5Cs that reads like an encyclopedia entry has failed. If a fact would not change a decision, it does not belong in the plan."},
  {"id":"stp","name":"STP","what":"Chooses who to serve and how to stand out.","def":"STP stands for segment, target and position. It's how you decide who to serve and why they should choose you over the alternatives.","why":"A brand that tries to serve everyone ends up with a message nobody remembers. STP is the discipline of choosing. Segmenting shows the groups, targeting picks the one you can win, and positioning writes the sentence that group would repeat to a friend. The “because” at the end is the part most teams skip, and it is the part that makes the claim believable.","formula":"For [target], [brand] is the [category] that [benefit], because [proof].","steps":[["**Segment:** split the market into groups with different needs. Common ways to group people.",["where they live","who they are, such as age, income or job","what they value","how they behave and buy","the benefit they want most"]],"**Target:** choose the groups with the best mix of size, growth, fit with your strengths and ease of reaching them.","**Position:** write one sentence that says why your target should choose you, using the template above. If you can't fill in the “because,” the position isn't ready yet."],"example":"The sparkling water brand segments by the benefit people want. Hydration, flavour, a soda substitute, or a mixer. It targets the soda substitutes, former diet-soda drinkers who miss the taste but want to drop the sweeteners, because the group is large, growing with the sugar tax, and underserved by plain sparkling waters. The position reads, for former diet-soda drinkers, the brand is the sparkling water that tastes like a soda without the sweeteners, because it uses real fruit extracts and nothing else.","watch":"Targeting the biggest segment is the most common mistake. The biggest segment is where the best-funded competitor already is. Target the one you can win."},
  {"id":"4ps","name":"The 4Ps","what":"Turns the position into a plan.","def":"The 4Ps (product, price, place and promotion) turn your positioning into concrete decisions. All four should tell customers the same story.","why":"Positioning is a promise, and the 4Ps are where the customer checks whether you meant it. A premium claim on a product sold through discount channels at a bargain price tells the customer the claim was marketing. The test for every one of the four decisions is the same. Does it say the same thing the position says.","steps":["**Product:** decide the features, the range of versions and the packaging.","**Price:** decide where the price sits against the customer's alternatives. Price signals quality as well as earning revenue. Value-Based Pricing, next, shows how to set the number.","**Place:** decide where and how people buy, whether online, in stores, through partners or through a sales team.","**Promotion:** decide the message and where you'll say it.","Check all four against your positioning. A premium position with discount pricing, for example, confuses customers."],"example":"For the soda-substitute position, the four decisions line up. Product, four bold flavours in 12-can packs, with cola and cherry leading because they are the flavours soda drinkers miss. Price, 10% above the category leader, since a soda substitute is worth more than plain fizzy water. Place, the grocery chain's soft-drink aisle rather than the water aisle, plus the online subscription. Promotion, a “break up with diet soda” message in the places those drinkers already are. Shelving it in the water aisle at a discount would have contradicted the position on two of the four.","watch":"Going global, keep the brand consistent and adapt the 4Ps to each market's culture, income and channels."},
  {"id":"pricing","name":"Value-Based Pricing","what":"Sets a price from what the product is worth to the customer, with cost as the floor and competitors as a reference.","def":"Value-based pricing sets a price from what the product is worth to the customer compared with their next best option. It is one of three ways to price, and the one that captures what you built. The other two still have jobs. Cost sets the floor, and competitors set the anchor in the customer's mind.","why":"Cost-plus ignores the customer entirely. Two products with the same cost can be worth very different amounts to the people buying them. Competitor-based gives away your differentiation, because if you are better and priced the same, the customer gets the difference for free. Value-based pricing is harder, since it needs research, but it is the only method that connects the price to the positioning you wrote in STP.","formula":"Cost floor ≤ Price ≤ Value to the customer\nValue = What the next best alternative costs + What you add − What you take away","steps":[["Know the three methods and what each one is for.",["**Cost-plus:** price = cost + a fixed margin. Easy to compute, blind to the customer. Use it only to find the floor you cannot price below.","**Competitor-based:** price = what the market charges, matched or undercut. Safe, and it gives your differentiation away for free. Use it to learn where the customer's mind is anchored.","**Value-based:** price = inside the range of what the product is worth to the customer. Harder, since it needs research. Use it to set the number."]],"Name the customer's **next best alternative**, the thing they would buy if you did not exist. Its price is the starting point.","Add what your product gives them that the alternative does not, in money where you can. Subtract what it takes away. The result is the value, and the ceiling on your price.",["Measure **willingness to pay** rather than guessing it. Two common methods.",["**Price thresholds:** ask target customers at what price the product would be too cheap to trust, a bargain, getting expensive, and too expensive to consider. The overlap gives you a range.","**Trade-off surveys**, often called conjoint, where people choose between versions with different features and prices. These show what each feature is worth."]],"Set the price inside the range, above your cost floor. Use competitors as a reference for where the customer's mind is anchored, never as the answer.",["Choose the **structure** as carefully as the number.",["per unit or per pack","subscription, which trades a lower price for predictable volume","good, better, best tiers, which let different segments pay different amounts for the same core product"]],"Test the price in one region or channel before you commit. Watch margin and volume together. A price that lifts margin and holds volume is right. A price that lifts volume and kills margin is a discount."],"example":["The sparkling water brand prices its flavoured 12-can pack three ways. Variable cost is $0.28 a can.","Cost-plus at a 40% markup = $0.28 × 1.4 = $0.39 a can, or $4.70 a pack","Competitor-based, matching the category leader = $0.53 a can, or $6.35 a pack","Next best alternative for the target, a diet soda = $0.60 a can","Value = $0.60 + the sweeteners removed and the sugar tax avoided − the soda taste they give up","Price-threshold survey of 300 target customers puts the range at $0.55 to $0.65 a can","The brand prices at $0.58 a can, $7 a pack, with a subscription at $6.30. Contribution is $0.30 a can instead of the $0.11 cost-plus would have left. The price sits 10% above the category leader, which is the 4Ps decision, and the research is what makes it defensible."],"watch":"Discounting to win a shelf or a customer resets the customer's idea of what the product is worth, and the full price never recovers. Protect the price and give value in other ways, such as a larger pack or a bundled offer."},
  {"id":"brand-equity","name":"Brand Equity","what":"Builds the part of a brand's value that lives in the customer's head, and shows how to measure it.","def":"Brand equity is what a brand is worth beyond the product it sits on. It is the reason a customer pays more for a name, chooses it without comparing, forgives a bad batch and tells a friend. It is built in four layers, and each one rests on the one below. Awareness, then associations, then perceived quality, then loyalty.","why":"Every other marketing decision is a cost until it becomes equity. Advertising that nobody remembers, a price customers will not pay without a discount, a launch that needs a promotion to move, all of them are signs the brand has not earned a place in the customer's head yet. Equity is also the asset an acquirer pays for, which is why brand-led companies sell for multiples their factories could never justify.","formula":"Price premium = Brand's price − Price of an equivalent unbranded product\nUnaided awareness = People who name the brand unprompted ÷ People asked","steps":[["Build the four layers in order, and measure each one.",["**Awareness:** do people know the brand exists. Measured as unaided awareness, the share who name it when asked for brands in the category, and aided awareness, the share who recognise it when shown.","**Associations:** what comes to mind when they think of it. Measured by asking for the first three words. The words should match the position you wrote in STP.","**Perceived quality:** do they believe it is better. Measured by rating against the category leader, and by the price premium customers accept without a discount.","**Loyalty:** do they come back and bring others. Measured by repeat purchase rate, share of wallet and the share of new customers who arrive through recommendation."]],"Say the same thing everywhere. Equity is built by repetition of one idea across packaging, advertising, the shelf and the product itself. Every message that says a different thing spends equity instead of building it.","Protect the price. A discount teaches the customer what the brand is really worth, and the lesson sticks longer than the promotion.","Treat every extension as a loan against the brand. A good one adds associations the position can use. A bad one adds ones it cannot shake.","Track the four measures twice a year against the category leader, and act on the lowest layer first. Loyalty cannot be built on associations nobody holds."],"example":["Two years after the grocery launch, the sparkling water brand measures its equity against the category leader.","Unaided awareness = 310 of 1,000 shoppers name it unprompted = 31%, against 68% for the leader","Top three associations = “no sweeteners”, “bold flavours”, “the soda one”, which match the position","Price premium held = $0.58 a can against $0.53 for the leader, with 70% of volume sold at full price","Repeat purchase within 90 days = 44%, and 55% of new subscribers arrive through recommendation","The associations, quality and loyalty layers are strong. Awareness is the weakest layer, and the next year's budget shifts from promotions, which the brand no longer needs, to reach among diet-soda drinkers who have never seen it."],"watch":"Awareness alone is not equity. A brand everyone has heard of and nobody chooses has spent on the first layer and skipped the other three."},
  {"id":"plc","name":"Product Life Cycle","what":"Matches the move to the product's stage.","def":"The product life cycle describes the four stages most products move through, from launch to decline. The right marketing move depends on which stage yours is in.","why":"The same marketing spend does different work at different stages. Awareness money is wasted on a mature product everyone knows, and a variation launched during introduction splits attention before the original has found its buyers. Knowing the stage tells you which lever is worth pulling, and the stage usually shows up in the growth rate before anyone names it.","steps":["**Introduction:** few people know the product exists. Focus on awareness and getting people to try it.","**Growth:** sales are rising fast. Expand distribution and win new customers before competitors catch up.","**Maturity:** growth slows and competition is fierce. Stand out, launch variations or find new uses.","**Decline:** sales are falling. Cut costs and collect the remaining profit, or reinvent the product."],"example":"The brand's original plain line has been on sale for six years and growth has slowed to 3% a year. It is in maturity, and the right move is variations and new uses, which is where the flavoured line comes from. The flavoured line itself is in introduction, where few people know it exists. Its budget goes to trial, with in-store sampling and a first-pack discount, rather than to the brand advertising the plain line no longer needs.","watch":"Maturity is often mistaken for decline, and a product that needed a new use gets harvested instead. Check whether the category is still growing before you cut."},
  {"id":"messaging","name":"Barrier-Based Messaging","what":"Writes one message for each reason people don't act.","def":"People rarely ignore a useful offer for no reason. A barrier stops them, and each barrier needs its own answer.","why":"One message aimed at everyone answers nobody's worry. The person who has never heard of you and the person who doubts you need different sentences, and a cost worry is not solved by a trust answer. Writing the barrier in the customer's own words first keeps the message about them rather than about the product.","steps":[["List what stands between your audience and the action you want. The usual four.",["**Awareness:** they haven't heard of it","**Trust:** they doubt it","**Cost:** it seems too expensive or risky","**Access:** it seems too hard to get"]],"Write each barrier as the worry in their own words, such as “I've never heard of this” or “Who sees my data?”","Write one clear message that answers each worry directly.","End every message with one next step, such as sign up, call, visit or book."],"example":"The brand lists the four barriers for a diet-soda drinker standing in the aisle. Awareness, “never seen this before.” Trust, “is it just flavoured water full of chemicals?” Cost, “$7 a pack is more than my soda.” Access, “my store doesn't stock it.” Each gets its own message. A shelf talker and sampling for awareness. “Real fruit extracts and nothing else, see the back of the can” for trust. “Less than a coffee a day, and no sugar tax” for cost. A store finder and the subscription link for access. Every one ends with the same next step, try a pack.","watch":"Inform before you persuade. When trust is the barrier, pushy messages make it worse."},
  {"id":"channel-mix","name":"Channel Mix","what":"Splits the budget by the job each channel does.","def":"A channel is a place where you reach people, such as search, social media, email, events or partners. A channel mix splits your budget by the job each channel does best.","why":"Budgets get split by habit, or by whichever channel the loudest person on the team likes. Giving each channel a job turns the split into a decision. Search cannot build awareness and video cannot close a sale, and judging either by the other's measure is how good channels get cut. The job also decides the one number you watch for each.","steps":[["Give each channel one **job**.",["**capture** people already looking (search)","**build awareness** (social, video)","**build trust** (community, referrals)","**convert** interest into sales (email, sales calls)"]],"Decide each channel's share of the budget based on how important its job is right now.","Pick one measure per channel that matches its job, such as cost per sign-up for search or number of referrals for community.","Start small, compare results after a few weeks and move money toward what works."],"example":"The brand's launch budget is $200,000 for the first quarter. Search gets 30% to capture people already typing “sparkling water without sweeteners,” measured on cost per first order. Short video gets 35% to build awareness among diet-soda drinkers, measured on reach within the target. Community and referral gets 15% to build trust, measured on referred orders. Email gets 20% to convert subscribers to the new line, measured on conversion rate. After six weeks, video reach is on target but referral orders are double the plan, and $20,000 moves from video to referral.","watch":"Judging every channel on sales is the fastest way to kill the ones that build awareness. Measure each channel against its job, and the mix against sales."},
  {"id":"base-incremental","name":"Base vs. Incremental Sales","what":"Separates what sells anyway from what promotions add.","def":"**Base sales** are what you'd sell with no promotion running. **Incremental sales** are the extra units a promotion brings in. Separating the two shows whether promotions pay off.","why":"A promotion week always looks like a success, because sales go up. The question is how much of that volume you would have sold anyway, and how much of the rest is customers who simply bought early. Separating base from incremental turns a promotion from a feel-good number into a return on money spent, and the category comparison tells you whether a drop is your problem or the market's.","steps":["Track your sales week by week, and mark the weeks with a promotion.","Estimate your base, your typical sales in weeks without a promotion.","In promotion weeks, the sales above the base are incremental. Compare them with what the promotion cost.","Compare your trend with the whole category's trend in the same store or market. The category is every product of that type, such as all sparkling water. If the category is steady while your brand drops, shoppers haven't left. The store is likely shifting sales to rivals, often by promoting them instead. If brand and category drop together, demand itself is falling, and promotions only buy short-term volume. Look at price, product or new uses instead."],"example":["The brand reviews a two-for-$10 promotion in the grocery chain. Contribution is $0.30 a can at full price.","Base sales in a normal week = 50,000 cans","Sales in the promotion week = 80,000 cans","Incremental sales = 80,000 − 50,000 = 30,000 cans","Incremental contribution = 30,000 × $0.30 = $9,000","Promotion cost = $0.20 discount × 80,000 cans + $5,000 store fee = $21,000","The promotion lost $12,000 in the week it ran. It only pays if enough of the 30,000 extra buyers become regular buyers. The brand checks the following four weeks. Base rises to 54,000 cans, which is worth about $1,200 a week in contribution, and the promotion pays back in ten weeks."],"watch":"Sales pulled forward are not incremental. If base sales dip in the weeks after a promotion, customers stocked up, and the real gain is smaller than the promotion week suggests."},
  {"id":"line-extension","name":"Line and Brand Extensions","what":"Chooses how to extend what you sell, and checks that the extension adds profit after it eats into what you already have.","def":"Once a product has launched, growth usually comes from extending it. A line extension adds a version in the same category, such as a new flavour or size. A brand extension takes the brand into a new category. A new brand is for a segment the existing brand would confuse. Each one borrows from what you already sell, and the math checks whether it gives back more than it takes.","why":"Extensions are the cheapest growth a brand has, because the name, the shelf and the customer are already there. They are also where brands lose discipline. A line extension counts its sales and forgets how many came from the original. A brand extension stretches the name into a category where the position no longer makes sense, and the parent brand pays for it. The fit test and the cannibalisation math are the two checks that keep extensions honest.","formula":"Incremental contribution = New product contribution − Extra SG&A − Launch marketing − Contribution lost from the core","steps":[["Pick the kind of extension and know what it borrows.",["**Line extension:** a new version in the same category. New flavour, size, format or price tier. Borrows the shelf and the existing buyers, which is also who it cannibalises.","**Brand extension:** the same brand in a new category. Borrows the brand's trust and position. Works when the position carries over, fails when it does not.","**New brand:** a separate name for a segment the parent brand would confuse, such as a premium brand launching a value line. Borrows the company's capabilities and nothing the customer can see."]],"Run the fit test for a brand extension. Say the position sentence from STP with the new category in it. If it still makes sense, the brand can carry it. If it sounds strange, the extension will dilute the parent.","Go back to STP for a brand extension or a new brand. A new category has its own segments, competitors and next best alternative, and the target you chose for the original product may not be the one to win there. A line extension usually keeps the original target, and the fit test is enough.","Estimate the extension's sales volume and its **contribution**, meaning sales minus variable costs.",["Subtract every new cost it creates.",["launch marketing","extra **SG&A** (selling, general and administrative costs, such as sales staff and overhead)"]],"Subtract **cannibalisation**, the profit you lose when existing customers switch from your original product to the new one.","If what's left is small or negative, test the extension in a few markets first, or sell it through a different channel to protect the original."],"example":["The sparkling water brand weighs two extensions after the flavoured line launches.","A cola flavour is a line extension. The math, at a contribution of $0.30 a can.","New product contribution = 2,000,000 cans × $0.30 = $600,000","Launch marketing = $150,000","Extra SG&A for the new line = $80,000","Cannibalisation = 30% of the new sales come from existing flavours = 600,000 cans × $0.30 = $180,000 lost","Incremental contribution = $600,000 − $150,000 − $80,000 − $180,000 = $190,000","A sparkling iced tea is a brand extension. The fit test passes, because “the sparkling drink without sweeteners” still makes sense in tea. A sweetened energy drink under the same brand fails it, and would need a new brand. The cola flavour launches in two regions first, with the team watching whether cannibalisation lands at 30% or higher."],"watch":"Cannibalisation estimates are guesses until launch, and the real number is usually higher than the deck. For a brand extension, the bigger risk is the one the math cannot show. A bad extension costs the parent brand its position."}
 ]},
{id:"b2b",name:"B2B Marketing",q:"How do businesses buy?",idea:"Businesses buy as a **group**, and they buy on **risk and return**. Map everyone who has to say yes, size the deal bottom-up, make a case they can put in a budget, prove it in forms they can forward, then choose the route that reaches them.",use:["Selling a product or service to companies","Sizing a business-to-business opportunity","Planning outreach to a few high-value accounts"],
 tools:[
  {"id":"committee","name":"Buying Committee Map","what":"Finds everyone who shapes a business purchase.","def":"When a business buys, a group decides. This group is called the **buying committee**. A buying committee map lists everyone who can say yes or no, and what each person needs to hear.","why":"Consumer sales have one decider. Business sales have a room full of them, and most deals die with a person the seller never met. The map exists because a pitch that wins the user and ignores the finance lead loses, and so does a pitch that wins the budget holder while IT quietly blocks it. Knowing who is in the room, and what each one is afraid of, is the first B2B skill.","steps":["List every role involved, such as operations, purchasing, finance, IT, legal, the people who'll use it and the executive sponsor.",["Mark the key roles.",["**Champion:** wants you to win and argues for you inside the company","**Economic buyer:** controls the budget and gives final approval","**Technical buyer:** can block the deal over security or fit","**Users:** will work with the product every day"]],"For each role, write what they fear and what they need, such as reliability, total cost, return, compliance or ease of use.","Give each role its own message and proof. Give your champion ready-made material to make your case when you're not in the room.",["Narrow to the **critical three**, the people whose yes moves the deal. Usually they are the one who owns the problem, the one who controls the money and the one who can block. Write each one's top concern in a single sentence and build the pitch so each concern gets a direct answer backed by evidence.",["In a family-owned plant the owner may be all three. Confirm the three before you build the pitch."]]],"example":"A start-up sells vibration sensors and software that predict machine breakdowns to mid-sized food manufacturing plants. For one plant, the map has seven roles. The maintenance manager is the champion, tired of 3am call-outs. The plant director is the economic buyer, judged on output and downtime. The IT lead is the technical buyer, worried about devices on the factory network. The maintenance technicians are the users, suspicious of a tool that might blame them. Purchasing wants three quotes. Finance wants the payback. The regional operations director is the executive sponsor who signs above $50,000. Each gets a message, and the champion gets a two-page internal case he can forward without the start-up in the room. The critical three are the maintenance manager, the plant director and the IT lead. Their concerns, in one sentence each. Will this cut my night call-outs. Will it pay back inside a year. Will it open a hole in my network.","watch":"The person who answers your emails is rarely the person who signs. Ask your champion, early, who else has to say yes."},
  {"id":"sizing","name":"Bottom-Up Opportunity Sizing","what":"Sizes a business opportunity from real units instead of industry totals.","def":"Bottom-up sizing estimates a business opportunity by counting real units and customers, instead of taking a percentage of a big industry total. Buyers and investors trust it more because every number can be checked.","why":"“One percent of a $4 billion market” convinces nobody, because nobody can check it. A bottom-up number is built from units a buyer or investor can count and argue with, and that is what makes it credible. It also tells you where the number is weakest, which is where the next conversation should go.","formula":"Opportunity = Price per unit × Units per customer × Number of customers","steps":["Use this to size a business opportunity you can defend line by line. It is the hands-on version of the SOM in Market Sizing, in the Entrepreneurial Innovation playbook.","Count how many units one customer would need, such as how many devices one hospital uses or how many licenses one team needs. Get a real number by visiting a site or interviewing staff.","Put a price on one unit.","Count how many customers you can realistically reach.","Opportunity = price × units per customer × number of customers.","Write down every assumption. A buyer or investor will want to check and adjust it."],"example":["The sensor start-up sizes its opportunity in mid-sized food plants.","Units per customer = 40 machines worth monitoring per plant, counted on three site visits","Price per unit = $900 per machine per year, sensor and software","Customers = 250 mid-sized food plants in the three states its field team can reach","Opportunity = $900 × 40 × 250 = $9,000,000 a year","Every line is a checkable assumption. The weakest is the 40 machines, since the three plants ranged from 25 to 60. The team sizes a low case at 25 machines, $5.6M, and a high case at 60, $13.5M, and leads with the range."],"watch":"A bottom-up number is only as honest as its weakest count. Say which assumption you are least sure of before the investor finds it."},
  {"id":"value-fast","name":"Economic Value Messaging","what":"Leads with what the buyer gains in money, time or risk.","def":"Business buyers have to justify every purchase. They respond to outcomes they can put in a budget. Lead with those.","why":"A feature is a cost to the buyer until it becomes an outcome. “Real-time vibration analysis” means nothing to a plant director. “Twelve fewer hours of unplanned downtime a month” is a line in her budget. Business buyers are judged on numbers, and they buy from sellers who hand them the number they need to defend the purchase.","steps":["Translate each feature into an outcome, such as hours saved, costs cut, failures avoided or revenue gained.","Put the biggest outcome first. In the first line of the email, at the top of the website and on the first slide.","Back it with a number from a real customer. How much they saved or gained, and how fast.","State the value before asking for anything, whether it's a click, a call or a meeting."],"example":["The sensor start-up rewrites its pitch for the plant director, starting from her downtime cost.","Unplanned downtime at the plant = 30 hours a month × $8,000 an hour = $240,000 a month","Reference plant result = unplanned downtime cut by 40% within six months","Value to this plant = 12 hours × $8,000 = $96,000 a month, or about $1.15M a year","Cost = 40 machines × $900 = $36,000 a year","The first line of the email now reads “A plant like yours cut unplanned downtime 40% in six months, worth about $96,000 a month at your downtime cost.” The features follow on page two, and the ask for a site visit comes after the number, not before."],"watch":"A value claim without a source is a slogan. Name the reference customer, or say it is a model built on the buyer's own numbers."},
  {"id":"b2b-proof","name":"Proof and Thought Leadership","what":"Promotes to businesses the way businesses are persuaded, with evidence they can forward to the rest of the committee.","def":"Consumers are persuaded by stories and feelings. Business buyers are persuaded by proof they can defend to a colleague. B2B promotion is the work of producing that proof in the forms buyers trust. Case studies, reference calls, ROI calculators, pilots, and the kind of expertise that makes a company the one buyers call first.","why":"A business buyer has to justify the purchase to people who were not in the demo. Every piece of promotion is really written for that second audience. The case study gets forwarded to the plant director. The ROI calculator becomes the finance lead's spreadsheet. The webinar is where the IT lead decides you understand her world. Promotion that cannot be forwarded does half its job.","steps":[["Build the proof ladder, from cheapest to most convincing.",["**Thought leadership:** articles, talks and data the industry does not have, published under named people. It earns the first meeting. “The real cost of unplanned downtime in food plants, from 60 sites” gets read by every plant director in the sector.","**Case studies:** one named customer, the problem in their words, the result as a number, and a quote from the role you most need to convince. Write one per segment and per critical-three role.","**ROI calculator:** a simple model the buyer fills with their own numbers. It turns your claim into their number, which is the one they will defend.","**Reference calls:** a current customer who will talk to a prospect, peer to peer, with no seller on the line.","**Pilot:** a paid trial at one site with a success measure agreed in writing. The most expensive proof and the one that closes."]],"Match the proof to the stage. Thought leadership opens the door, case studies and the calculator carry the middle, references and a pilot close.","Write every piece for the person who was not in the room. Short enough to forward, specific enough to defend.","Measure proof by what it moves, not by views. Case studies by how often sales sends them, calculators by how many are completed, pilots by conversion."],"example":"The sensor start-up publishes a downtime benchmark built from its first sixty installations, which gets it invited to speak at the sector's main conference and lands fourteen inbound enquiries. It writes three case studies, one for each critical-three role, and the plant director one, “12 fewer hours of downtime a month at a 3-shift bakery,” is the most forwarded document it has. The ROI calculator asks for three numbers, downtime hours, cost per hour and machine count, and finance leads complete it 180 times in a year. Reference calls with two existing plants close most deals that reach them. For the largest prospects it offers a paid 90-day pilot on ten machines with a written target of a 30% drop in unplanned stops.","watch":"A case study with no number and no named customer is a brochure. Buyers forward numbers and names. If a customer will not be named, use the number and the sector."},
  {"id":"outreach","name":"Account-Based Outreach","what":"Picks the accounts worth winning and reaches each person in them with a message built for their role.","def":"Account-based outreach treats a handful of target companies as markets of one. You choose the accounts, research each, and write to every member of its buying committee about their own job. It is the B2B version of targeting, and it replaces volume with precision.","why":"One message sent to everyone at a company reads as spam to all of them, because it is. The IT lead and the plant director have different jobs, different fears and different words for the problem. Writing to each about their own job is slower per message and far faster per deal, and the sequence matters as much as the words. Automation handles the first touch. A person handles the moments where trust is won.","steps":["Pick your target accounts, usually twenty to fifty. Look for companies that feel the problem most, can decide quickly and look like your best existing customers.","Research each company. Its current challenges and who plays each buying role.","Write a different message for each role, such as technical, financial, champion and compliance.","Plan the sequence from first contact to a demo. Keep a real person on every high-trust moment, such as introductions, demos and pricing conversations."],"example":"The sensor start-up picks forty plants that run three shifts, where downtime hurts most, and researches each one. Recent recalls, hiring posts for maintenance staff, the names behind each role. The maintenance manager gets a short note about night call-outs and a two-minute video of the sensor on a similar line. The plant director gets the downtime number. The IT lead gets the security document before anyone asks for it. The sequence runs over three weeks, with the introduction, the site demo and the pricing conversation all done by a person. Fourteen of the forty agree to a site visit.","watch":"Research that shows in the first line is what gets a reply. A message that could have been sent to any plant gets deleted by every plant."},
  {"id":"route","name":"Channel Strategy","what":"Chooses how the product reaches business buyers, and matches the route to the size and complexity of the deal.","def":"A route to market is the path a product takes from you to the buyer. Field sales, inside sales, self-serve, partners such as distributors and resellers, and marketplaces each suit a different kind of deal. Most companies use more than one, and the mistake is using the wrong one for the deal in front of them.","formula":"Cost of a route ≤ Gross profit on the deals it wins","why":"A field sales rep costs several hundred thousand dollars a year and can close a six-figure deal that needs ten meetings. The same rep selling a $2,000 subscription loses money on every call. Self-serve wins the small deal and cannot handle the plant director who wants a site visit. The route decides your cost of sale, how fast you can grow and how much of the customer relationship you own, and it has to be chosen deal by deal.","steps":[["Know the five routes and what each one costs.",["**Field sales:** your own people meeting buyers in person. Highest cost, highest control. For large, complex deals with a committee to work.","**Inside sales:** your own people selling by phone and video. Mid cost. For mid-sized deals that need a conversation but not a visit.","**Self-serve:** the buyer signs up and pays online. Lowest cost. For small deals and for the first step of a larger one.","**Partners:** distributors, resellers and integrators who sell for you to customers they already have. Fast reach, lower margin, less control, and they push what pays them.","**Marketplaces:** cloud and procurement platforms where buyers already have a budget approved. Low effort to list, a fee on every sale."]],"Segment your deals by size and complexity. Deal value, number of people who must say yes, and whether a site visit or integration is needed.","Assign a route to each segment. Check that the cost of the route is below the gross profit on the deals it wins. A route that loses money per deal is a marketing expense, and should be judged as one.","Decide what the partner owns and what you keep. Pricing, the customer relationship and the renewal are the three things most companies regret giving away.","Avoid routes competing for the same deal. A distributor who finds your field rep in their account stops selling for you."],"example":["The sensor start-up segments its deals and assigns a route to each.","Plants with 100+ machines, $90,000 a year, a seven-person committee = field sales, two reps, cost per deal about $18,000 against $70,000 gross profit","Plants with 20 to 100 machines, $18,000 to $90,000 a year = inside sales, three reps, cost per deal about $4,000","Workshops with under 20 machines, under $18,000 a year = self-serve, with a starter kit of five sensors ordered online","Regions with no field presence = an industrial equipment distributor, at 18% margin, which keeps pricing and the renewal with the start-up","The distributor is told the field reps' named accounts are off limits, and the field reps stay out of the distributor's regions. The route map goes into every rep's territory plan."],"watch":"Adding a partner because it is quick is how companies end up with a channel that undercuts their own reps. Decide the rules of engagement before the first partner signs."},
  {"id":"channel","name":"Channel Incentives","what":"Keeps distributors and retailers pushing your product.","def":"Distributors and retailers sit between you and the end customer. They're customers too, and they push the products that earn them the most. Watching their incentives explains many sudden sales drops.","why":"A distributor carries hundreds of products and pushes the ones that earn it the most for the least effort. That is its business model, and it is why a product can lose shelf or sales attention without a single end customer changing their mind. Reading the channel's incentives before reading the market saves months of chasing the wrong problem. The partner is a buyer, and it has a buying committee of its own.","steps":["When a channel partner cools on your product, compare what they earn selling it with what they earn selling rivals' products.","Check whether rivals pay for promotions, displays or shelf space that you don't.",["Respond with a reason that makes your product worth their effort.",["better **trade terms**, such as discounts or longer payment terms","exclusive products or deals","shared marketing"]],"Map the distributor's buying committee the way you would a customer's. Its sales director, its category manager and its finance lead each have a reason to push or ignore you."],"example":["Two years in, the sensor start-up sells through an industrial equipment distributor, and orders through it fall 30% in a quarter.","Distributor margin on the start-up's sensors = 18%","Distributor margin on a rival's sensors, launched that quarter = 25%, plus a $20,000 co-marketing fund","End-customer interest, from the start-up's own inbound enquiries = up 10% in the same quarter","Shoppers have not left. The distributor has. The start-up raises the margin to 24% on orders above a volume threshold, adds a shared demo budget and gives the distributor an exclusive on the new wireless model for six months. Orders recover the following quarter."],"watch":"When sales through a channel fall, check the channel's incentives before you assume shoppers lost interest."}
 ]},
{id:"negotiation",name:"Negotiation & Persuasion",q:"How do I get to yes?",idea:"Most of a negotiation is settled **before you sit down**, and the relationship outlasts the deal. Prepare thoroughly, manage the table with discipline, and hold your position without losing the room.",use:["Negotiating a salary, vendor contract or sale","Preparing for a hard conversation","Working across cultures"],
 tools:[
  {"id":"four-numbers","name":"The Four Numbers","what":"The numbers to know before any negotiation.","steps":["**BATNA** (best alternative to a negotiated agreement): what you'll do if this deal falls through, such as take another job offer. A strong BATNA is your real source of power.","**Walkaway point:** the worst deal you'll accept. Set it just better than your BATNA.","**Target:** an ambitious result you can justify with facts.","**Opening:** your first offer. Set it beyond your target to leave room to move.","Estimate the same four numbers for the other side. The overlap between your walkaway point and theirs is the **ZOPA** (zone of possible agreement): the range where a deal can happen."],"def":"These are the four numbers to work out before any negotiation, whether it's a salary, a contract or a sale. Knowing them keeps you from accepting a bad deal or walking away from a good one."},
  {"id":"anchoring","name":"Anchoring","what":"Uses the first number to shape the range.","steps":["Make the first offer when you know enough to justify it.","Back it with two or three hard facts, such as market data, what you've invested or past offers.","If they open with an extreme number, don't negotiate from it. Say calmly that it's far off, and restart the conversation from your own facts."],"def":"Anchoring is the pull the first number has on a negotiation. Once a number is on the table, the final deal tends to land closer to it."},
  {"id":"dist-int","name":"Distributive vs. Integrative","what":"Tells you which game you're playing.","steps":[["**In a distributive negotiation:**",["open with a strong, well-backed number","make small, careful concessions"]],["**In an integrative negotiation:**",["list every issue, such as price, timing, payment terms and support","trade what's cheap for you but valuable to them"]],"Most real deals have integrative room. Ask questions to learn what the other side cares about most, then build trades around it."],"def":"Negotiations come in two kinds. **Distributive** ones split a fixed amount, usually price, and one side's gain is the other's loss. **Integrative** ones cover several issues the sides value differently, and trades can leave both better off. Knowing which you're in tells you which tactics to use."},
  {"id":"concessions","name":"Concession Plan","what":"Decides what you'll give, in what order.","steps":["Rank every issue by how much it matters to you.","List what you're willing to concede, in what order and in small steps. Big early concessions signal there's much more to give.","List what you won't concede at all.","Never make a concession without getting one back. Use the form “If you can do X, I can do Y.”"],"def":"A concession plan decides in advance what you're willing to give up, and in what order. It keeps you from giving away value in the heat of the moment."},
  {"id":"power","name":"Sources of Power","what":"Maps leverage on both sides.","steps":[["Map each source of power for both sides:",["**Legitimacy:** facts, standards, precedent and track record that back your position","**Alternatives:** your BATNA. The side with the better fallback can walk away.","**Time:** whoever needs the deal sooner has less power.","**Information:** what each side knows about the other's needs and limits"]],"Show your power through calm, unhurried behavior.","Keep your own deadline to yourself."],"def":"Power in a negotiation is your ability to get a better deal. It comes from several sources, and both sides have some. Mapping them shows where you're strong and where you're exposed."},
