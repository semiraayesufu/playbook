const PB = [
{id:"strategy",name:"Strategy",q:"Where should we play?",idea:"Good strategy is a set of choices that reinforce each other, tested against what the company can actually execute. Work in three stages: **diagnose**, then **decide**, then **deliver**.",use:["Sizing up a company, an industry or a competitor","Weighing an acquisition, partnership or new market","Turning a strategy into goals people can track"],
 tools:[
  {"id":"vrio","name":"VRIO","what":"Tests whether a capability gives a lasting advantage.","steps":[["List the two or three **capabilities** that seem to drive the company's success. A capability can be:",["a **resource** it owns, such as a brand, a patent or a location","something it's **good at doing**, such as sourcing, design or service"]],["Ask four questions about each capability, in order:",["**Valuable:** does it help win customers or lower costs?","**Rare:** do few competitors have it?","**Costly to imitate:** would copying it take years, a special culture or secret know-how?","**Organized:** are the company's structure, incentives and processes set up to make full use of it?"]],"Stop at the first “no.” The further a capability gets, the bigger its advantage. The quick guide below shows what each stopping point means.","Look at how the capabilities work together. Several ordinary strengths that reinforce each other can be harder to copy than one standout strength."],"read":["No to Valuable: a **disadvantage**","Valuable only: **parity**, meaning you match competitors","Valuable and Rare: a **temporary advantage**, until others copy it","Valuable, Rare and Costly to imitate, without the organization to use it: an **advantage left unused**","All four: a **sustained advantage**"],"def":"VRIO tests whether something a company has or does gives it a lasting edge over competitors. The name comes from its four questions: Valuable, Rare, Inimitable (hard to copy) and Organized."},
  {"id":"steep","name":"STEEP","what":"Scans the outside forces a company can't control.","steps":[["Look at the world outside the company through five lenses:",["**Socio-cultural:** values, demographics and how people live and buy","**Technological:** new tools, platforms and inventions","**Economic:** interest rates, costs, exchange rates and the business cycle","**Environmental:** climate rules and pressure to be sustainable","**Political and legal:** regulation, trade policy and labor law"]],"Under each lens, list two or three trends that actually affect this business. Back each with a source or a number. Skip trends that are true but don't matter here.","Label each trend an **opportunity** (it could help the company) or a **threat** (it could hurt it). These become the O and T of a SWOT."],"def":"STEEP is a scan of the big outside forces that shape a business but that it can't control. The name comes from its five lenses: Socio-cultural, Technological, Economic, Environmental and Political. Use it to spot opportunities and threats early."},
  {"id":"five-forces","name":"Five Forces","what":"Shows how much profit an industry lets companies keep.","steps":["Rate each force below as high, moderate or low, and write one sentence on why.",["**Threat of new entrants:** how easy is it for a newcomer to start competing?",["High startup costs, strong brands and hard-to-get licenses keep this threat low."]],["**Buyer power:** can customers push prices down?",["Power is high when a few big buyers make up most sales, or when switching is easy."]],["**Supplier power:** can suppliers raise prices?",["Power is high when a few suppliers control something the industry can't do without."]],["**Threat of substitutes:** could customers meet the same need with a different kind of product?",["For example, video calls substitute for business travel."]],["**Rivalry:** how hard do existing competitors fight?",["Many similar players, high fixed costs and slow growth usually lead to price wars."]]],"read":["The more forces rated high, the less profit is left in the industry.","Then ask where the company can position itself to escape the strongest forces."],"def":"Five Forces, a framework from Harvard professor Michael Porter, explains how much profit an industry lets its companies keep. Five pressures compete for that profit. The stronger they are, the less is left for the companies in it."},
  {"id":"swot","name":"SWOT","what":"Pulls the diagnosis together and turns it into options.","steps":["Fill in **Strengths** and **Weaknesses**, the things inside the company. Your VRIO and Business Model Canvas work are good sources.","Fill in **Opportunities** and **Threats**, the things outside the company. Pull them from your STEEP scan and Five Forces.","For every line, add the evidence and a “so what”: why it matters for the decision you face.",["Turn the grid into options by pairing items:",["use a **strength** to capture an **opportunity**","fix a **weakness** before a **threat** exploits it"]]],"def":"SWOT pulls your analysis together into four lists: Strengths and Weaknesses inside the company, Opportunities and Threats outside it. The last step matters most: turning those lists into options you can act on.","watch":"A SWOT that stops at four lists is only a summary. The options are the point."},
  {"id":"bmc","name":"Business Model Canvas","what":"Maps how a company creates, delivers and captures value on one page.","steps":[["Fill in the nine boxes, a line or two each:",["**Customer segments:** who you serve","**Value proposition:** the problem you solve for them","**Channels:** how you reach them","**Customer relationships:** how you keep them","**Revenue streams:** how money comes in","**Key resources:** what you need to have","**Key activities:** what you must do well","**Key partners:** who you rely on","**Cost structure:** where the money goes"]],"Mark each box as a strength or a weakness.","Find the **fragile box**, the one the others depend on. Ask: if this broke, what else would fall over? Focus there first."],"def":"The Business Model Canvas describes how a company makes money on one page, in nine boxes. Use it to understand a business quickly and to find the part everything else depends on."},
  {"id":"s-curve","name":"S-curve","what":"Shows when a growth engine is running out, so you can jump to the next one in time.","steps":["Place the company's main business on the curve. Is growth just starting, climbing fast or flattening?","If it's flattening, name the **next curve**: the new technology, customer group or business model where growth is moving.","List what the company would need to win on that next curve that it lacks today, such as skills, customers or technology.",["Decide how to get it:",["**Build** it yourself: slowest, with full control","**Partner** for it: faster, with shared control","**Buy** a company that has it: fastest and most expensive"]]],"def":"The S-curve shows how most products and businesses grow: slowly at first, then fast, then flattening as the market fills up. Knowing where you are on the curve tells you when to start building the next source of growth.","watch":"Start the next curve while the current one is still growing. Once it flattens, the money and time to build something new are harder to find."},
  {"id":"make-buy","name":"Make or Buy","what":"Decides whether to own a supplier or partner (vertical integration) or contract with it.","steps":["Name the activity you're deciding on, such as making a key part, running delivery or building software.",["Score how hard it would be to write a complete contract for it, from low to high. Contracts get hard when:",["the work needs equipment or skills built just for you","the future is uncertain, so you can't spell out every case","you'd deal with the supplier constantly"]],"Score how much it matters to your **competitive advantage**, from low to high. Is it part of why customers choose you?","Place it on the grid. The harder it is to contract and the more it matters, the stronger the case for owning it."],"read":["Both high: **own it**","Both low: **buy it** on the market","Mixed: use a **partnership or long-term contract**"],"def":"Make or buy decides whether to do something yourself (or own the company that does it) or pay an outside supplier. Owning more steps of your supply chain is called **vertical integration**."},
  {"id":"hypothesis","name":"Hypothesis Testing","what":"Turns a big bet into a clear go, pivot or stop decision.","steps":["Write the bet as one testable sentence: “Doing X is the best way to achieve Y.” For example: “Buying this company is the fastest way to enter mobile gaming.”",["List the **conditions** that must all be true for the bet to pay off. For a purchase like that, they might be:",["the value created is greater than the price paid","regulators will allow it","the two companies can be combined smoothly","the alternatives are worse"]],"For each condition, name the data that would prove or disprove it, and go get that data.",["Agree on the decision rule before you look at the results:",["all conditions hold: **go**","one fails: **pivot** to the next-best option","several fail: **stop**"]]],"def":"Hypothesis testing turns a big strategic bet into a statement you can prove or disprove with data. You also agree in advance what you'll do with the answer."},
  {"id":"ambidexterity","name":"Ambidexterity","what":"Runs the core business and a new venture at the same time without one starving the other.","steps":["Give the new venture its **own team and structure**, with fewer approval layers, so it can move fast.","Give it **its own goals**, tied to learning and milestones. Judging it on the core business's profit targets will end it early.","Have a senior leader **champion it openly** and celebrate early wins, so people see it matters.","Share only what genuinely helps, such as customers, technology or brand. Keep everything else separate."],"watch":"The core business is the funding engine and can quietly starve the new unit of money and talent.","def":"Ambidexterity means running the established business and a new venture at the same time. The two need different things, so each gets its own structure, goals and support."},
  {"id":"scorecard","name":"Balanced Scorecard","what":"Translates a strategy into goals and measures across four views.","steps":[["Set goals in each of the four views:",["**Financial:** how success shows up in growth, margins and cash","**Customer:** what customers should experience, measured by adoption, satisfaction or market share","**Internal process:** what the company must do well, such as speed, quality or efficiency","**Learning and growth:** the people, skills and culture needed to deliver"]],"Write two goals per view.","Give each goal one number and a date, such as “raise repeat purchases to 40% by December.” If you can't measure a goal, rewrite it until you can."],"def":"A Balanced Scorecard turns a strategy into a short list of goals across four views of the business. Tracking all four keeps a company from chasing short-term profit at the expense of customers, operations or people."}
 ]},
{id:"innovation",name:"Entrepreneurial Innovation",q:"Is this idea worth building?",idea:"Strong founders keep learning until they understand the problem well enough to build the right thing. **Validate before you scale**, and tie every round of spending to evidence.",use:["Judging a startup, product idea or new venture","Choosing between technologies, partners or vendors","Deciding whether to keep going, pivot or stop"],
 tools:[
  {"id":"problem","name":"Problem Framing","what":"Makes sure you're solving the right problem before designing a solution.","steps":[["Write the problem in one sentence that names:",["**who** has it","**when** it shows up","**what it costs them** in time, money or frustration"]],"Talk to five to ten people who have the problem. Ask how they deal with it today and what they've already tried. Listen more than you pitch.","Rewrite your sentence after each round of conversations. If it keeps changing, you're learning.","Start designing solutions once the sentence stops changing."],"def":"Problem framing means defining the problem clearly before you design a solution. Many new ventures fail because they solve a problem people don't really have. A clear problem makes good solutions much easier to spot."},
  {"id":"tam-sam-som","name":"Market Sizing","what":"Estimates how big the opportunity is, from the whole market down to what you can win soon.","formula":"TAM → SAM → SOM","steps":["**TAM (total addressable market):** everyone who could ever use this kind of product, multiplied by what each would spend per year.","**SAM (serviceable available market):** the part of the TAM you can actually reach today, given your product, location and sales channels.",["**SOM (serviceable obtainable market):** the part of the SAM you can realistically win in your first two to three years. Build it from the bottom up:",["count the real customers in each group you'll target","multiply by how much each would buy per year"]],"Choose a **beachhead**: one small group of customers you can win clearly first. Winning it gives you proof, revenue and references for the bigger groups."],"watch":"Investors trust a bottom-up SOM far more than \"1% of a huge market.\"","def":"Market sizing estimates how much money a business could make, in three layers that go from biggest to most realistic: TAM, SAM and SOM. Investors use it to judge whether an idea is worth backing."},
  {"id":"validation","name":"Validation Ladder","what":"Proves customers will pay, in steps of rising commitment.","steps":[["**Interviews:** talk to people one on one about the problem.",["What it proves: the problem is real and painful."]],["**Surveys:** ask many people the same short set of questions.",["What it proves: how many people have the problem, and which kinds of people have it most."]],["**Letters of intent:** ask customers to sign a short, non-binding note saying they plan to buy.",["What it proves: they'll put their name to it."]],["**Paid pilots:** sell a small trial at your real price and on your real terms.",["What it proves: they'll pay. This is the strongest proof you can get before launch."]],"Climb one step at a time. Move up only when the step you're on gives a clear yes, and spend money in line with how high you've climbed."],"watch":"Test your real price and terms. A long contract or a share of revenue can be a reason to say no on its own.","def":"The validation ladder tests whether customers will really pay for your idea, in four steps. Each step asks customers for more commitment, so each gives you stronger proof. Saying a problem hurts costs people nothing. Paying for a fix proves it."},
  {"id":"plan-review","name":"Investor Readiness Check","what":"Reads your plan the way an investor will, before you pitch it.","steps":[["Score each area of your plan out of 10:",["**Value proposition:** the problem you solve, and why your solution is better","**Market:** how big it is, and who you'll win first","**Go-to-market:** how you'll reach and win your first customers","**Operations:** how you'll build and deliver","**Team:** whether you have the people and skills to do this","**Financials:** revenue, costs and how much money you need","**Risks:** what could go wrong, and your plan for it","**Milestones:** what you'll achieve, and by when","**Exit:** how investors eventually get their money back, usually through a sale of the company or a stock listing"]],"Find your lowest score. That's where an investor will push hardest.","Write the investor's biggest objection in one sentence, then your answer in two.",["Give the plan an honest verdict:",["**ready**","**ready with conditions**","**not yet**"]]],"read":["Any area below 5 needs fixing before you pitch.","If you can't answer the main objection in two sentences, the plan isn't ready."],"def":"An investor readiness check reviews your business plan the way an investor will, before you pitch. It shows your weakest area so you can fix it first."},
  {"id":"gates","name":"Spending Gates","what":"Makes each round of money earn the next one.","steps":["Split the plan into stages, such as building a prototype, winning first customers and expanding.","For each stage, set the **milestone** that releases the next round of money, such as a working prototype, ten paying customers or a sales target.",["Give each gate three things:",["a **date** to check","a **number** that counts as success","a **rule** for a miss: try once more, change course or stop"]],"Spend only what the current stage needs."],"watch":"Without gates, money gets spent before the idea is proven, and stopping feels impossible.","def":"Spending gates release money in stages instead of all at once. Each stage has to hit a goal before the next round of money is released, which limits how much you can lose if the idea doesn't work."},
  {"id":"pivot","name":"Pivot Triggers","what":"Decides in advance what would make you change course.","steps":["Pick the one or two numbers that would prove the plan wrong, such as customer sign-ups, how often customers use the product or profit per customer.","Set the date you'll check them and the level that counts as a miss, such as “fewer than 50 sign-ups by March 1.”","Write your fallback plan now. A cheaper or simpler version of the same idea is often the best one."],"watch":"Decide the trigger before you start. Once you're invested, every miss starts to look like bad luck.","def":"A pivot is a deliberate change of direction when evidence shows the current plan won't work. Pivot triggers are the warning signs you agree on in advance, while you can still judge them calmly."},
  {"id":"options","name":"Option Scorecard","what":"Compares technologies, partners or vendors fairly on the same scale.","steps":["Describe each option in one sentence: what it does and who it's for. If you can't, learn more before you score it.",["Rate each option from 1 (weak) to 5 (strong) on four lenses:",["**Fit:** does it solve your problem?","**Traction:** who already uses or pays for it?","**Legal and regulatory:** patents, approvals and compliance","**Cost and terms:** price, contract length and how much you'd depend on them"]],"Give each lens a weight that reflects how much it matters to you, with the weights adding up to 100%. Multiply each rating by its weight, then add them up for a total.","Compare the totals. Then sanity-check the winner. If it doesn't feel right, ask which weight is off."],"read":["A low legal score can rule an option out on its own, whatever its total.","If two options tie, the one with more traction usually carries less risk."],"def":"An option scorecard compares several choices, such as technologies, partners or vendors, on the same scale. It makes the comparison fair and shows clearly why one option wins."},
  {"id":"recommend","name":"The Recommendation","what":"Ends the work with one clear decision.","steps":["**Name one priority:** the single thing you recommend doing.","**Give the next action** with an owner and a date, so the recommendation turns into movement.","**Give the longer-term move,** and what would need to be true for it to make sense.","If you genuinely need two paths, explain why both are needed, what each costs and what will decide between them later."],"def":"The recommendation is how every analysis should end: one clear decision someone can act on. Without it, even good analysis leaves people unsure what to do.","watch":"Listing options without choosing one reads as indecision."}
 ]},
{id:"finance",name:"Finance & Accounting",q:"Is it worth the money?",idea:"Every money question comes down to **what it earns, what it costs and what could go wrong**. Pick the tool that matches your question, then test how much the answer moves when your assumptions change.",use:["Someone wants to cut a product that \"loses money\"","You need to know how much to sell to stop losing money","You're deciding if a project, loan or acquisition is worth it","You want to know if a stock or bond is fairly priced"],
 tools:[
  {"id":"contribution","name":"Contribution Margin","what":"Shows what a product really adds before fixed costs.","formula":"Contribution = Sales − Variable costs","steps":[["Split costs into two kinds:",["**Variable costs** rise and fall with each unit sold, such as materials, packaging and shipping.","**Fixed costs** stay the same whatever you sell, such as rent, salaries and equipment."]],"Subtract the variable costs from sales. What's left is the contribution.","Before cutting a product that “loses money” on paper, ask which fixed costs would actually disappear without it. Usually very few do. The rent and salaries stay, so cutting the product can lower total profit.","If the contribution is positive and you have spare capacity, keep the product for now. Revisit when something more profitable could use that capacity."],"def":"Contribution margin is what a product earns from each sale after paying the costs that come with that sale. It's the money left over to pay the company's fixed bills and then make a profit. Use it before deciding to keep or cut a product."},
  {"id":"break-even","name":"Break-even","what":"Tells you how much you need to sell to cover fixed costs.","formula":"Break-even units = Fixed costs ÷ Contribution per unit","steps":["Work out the **contribution per unit**: the price minus the variable cost of one unit.","Divide total fixed costs by the contribution per unit. The answer is your break-even volume.","Compare it with what you sell today. The gap shows how far you are from profit.",["Pick the easiest lever to close the gap:",["raise the price","lower the variable cost per unit","sell more units","cut fixed costs"]]],"def":"Break-even is the number of units you must sell to cover all your fixed costs. Below it you lose money. Above it you make a profit."},
  {"id":"dupont","name":"DuPont Analysis","what":"Breaks return on equity into the three things that drive it.","formula":"ROE = Profit margin × Asset turnover × Equity multiplier","steps":[["Calculate the three parts:",["**Profit margin** = net income ÷ revenue. How much of each sales dollar the company keeps as profit.","**Asset turnover** = revenue ÷ total assets. How much the company sells for each dollar of things it owns.","**Equity multiplier** = total assets ÷ equity. How much of the company is funded with borrowed money. Higher means more debt."]],"Multiply the three to get ROE.","Compare each part with a competitor's to see why one company earns a higher return than the other."],"watch":"A high ROE built on **leverage** (borrowed money) is riskier than one built on margin, because debt magnifies losses as well as gains.","def":"Return on equity (ROE) measures how much profit a company earns for each dollar its owners have put in. DuPont analysis splits ROE into three parts, so you can see where the return really comes from."},
  {"id":"npv","name":"NPV and Sensitivity","what":"Shows whether a project creates value and how much room for error it has.","formula":"NPV = Present value of future cash flows − Upfront cost","steps":["Estimate the cash the project will bring in each year: year 1, year 2, year 3 and so on. “Today” (year 0) is when you pay the upfront cost.","Choose your **required return**: the minimum yearly return you'd accept for this level of risk, such as 10%.","**Discount** each year's cash back to today. This converts future dollars into what they're worth now. Spreadsheets do it with the NPV function.","Add up the discounted cash and subtract the upfront cost. That's the NPV.",["Read the result:",["**positive:** the project creates value","**negative:** it destroys value"]],"Test how sure you can be. Build a grid that varies the two most uncertain inputs, such as upfront cost and yearly cash, and see where the NPV turns negative."],"def":"Net present value (NPV) tells you whether an investment is worth more than it costs. It accounts for a simple fact: a dollar received in a few years is worth less than a dollar today, because today's dollar could be invested and earn a return in the meantime."},
  {"id":"ddm","name":"Dividend Discount Model","what":"Values a mature, steady dividend-paying stock.","formula":"Price = Next year's dividend ÷ (Cost of equity − Dividend growth)","steps":["Find next year's expected **dividend per share**: the cash each share will pay out.","Estimate a realistic long-term **growth rate** for that dividend.","Find the **cost of equity**: the yearly return investors expect for owning this stock, given its risk.","Divide next year's dividend by the cost of equity minus the growth rate. Compare the result with today's share price.","Change the growth rate by 1 percentage point up and down. Small changes swing the value a lot, so treat the answer as a range."],"watch":"It breaks for high-growth companies whose value isn't in near-term dividends.","def":"The dividend discount model values a stock by the dividends it will pay its owners over time. It works best for mature, stable companies that pay steady dividends.","read":["Value above today's price: the stock may be **underpriced**.","Value below today's price: it may be **overpriced**."]},
  {"id":"bonds","name":"Bond Yield and Spread","what":"Tells you whether a bond pays enough for its risk.","formula":"Spread = Bond yield to maturity − Treasury yield (same maturity)","steps":["Find the bond's **yield to maturity**: the yearly return you'd earn if you bought it at today's price and held it until it's repaid. In Excel, use the YIELD function.","Find the yield on a US **Treasury** bond that matures at about the same time. Treasuries are treated as risk-free.","Subtract the Treasury yield from the bond's yield. The difference is the **spread**: your extra reward for taking on the company's risk.","Compare that spread with the average for bonds with the same **credit rating**, a grade such as AAA or BB that shows how likely a borrower is to repay."],"def":"This test shows whether a company's bond pays enough extra interest to make up for the risk of lending to that company, compared with lending to the US government.","read":["Spread higher than average: a possible bargain, or a sign the market sees extra risk.","Spread lower than average: you're paid less than usual for the risk."]},
  {"id":"sharpe","name":"Sharpe Ratio","what":"Judges a return against the risk taken to earn it.","formula":"Sharpe = (Portfolio return − Risk-free rate) ÷ Volatility","steps":["Gather the investment's monthly returns over several years.","Calculate its average yearly return.","Calculate its **volatility**: how much its returns swing up and down, measured as standard deviation.","Subtract the **risk-free rate** (what you'd earn on short-term Treasury bills) from the return, then divide by the volatility.","Compare the result with a benchmark, such as the S&P 500."],"read":["Higher is better: more return for each unit of risk.","To raise it, add assets that don't move together. Diversifying cuts volatility without giving up much return."],"def":"The Sharpe ratio measures how much return an investment earns for each unit of risk it takes. It lets you compare investments fairly, even when one is much riskier than another."},
  {"id":"affordability","name":"Debt Affordability","what":"Tests whether a person or business can safely carry a loan.","steps":[["Set a ceiling for loan payments:",["**For a person:** lenders often cap all debt payments at about 36% of gross monthly income, meaning income before tax.","**For a business:** compare payments with **operating cash flow**, the cash the business generates from its normal operations."]],"Calculate the monthly payment at today's interest rate.","Recalculate with the rate 1 percentage point higher and 1 lower. Check that the payment still fits under the ceiling.","Name the trade-off: a smaller loan is safer but buys less."],"def":"This tests whether a person or business can safely take on a loan, including if interest rates rise."},
  {"id":"buyout","name":"Buyout Returns","what":"Checks whether an acquisition returns enough to the investor.","formula":"Enterprise value = Equity value + Net debt","steps":["Find the **entry price** of the whole company, called its **enterprise value**: the value of the owners' stake plus the company's debt, minus its cash.","Project the company's **EBITDA** five years out. EBITDA is earnings before interest, taxes, depreciation and amortization, a rough measure of operating profit.","Estimate the **exit value**: that future EBITDA multiplied by the **exit multiple**, the price-to-EBITDA ratio you expect a buyer to pay.","Subtract the debt still owed at exit. What's left is the investors' **exit equity**.","Divide exit equity by the cash the investors put in. That's the **money multiple**.","List the specific moves that would grow EBITDA, such as new products, better margins or selling directly to customers."],"read":["Investors often look for a money multiple of about 2 to 3 times over five years.","If the return only works when you sell at a higher multiple than you paid, treat that as a risk."],"def":"This checks whether buying a company, often with a lot of borrowed money, will pay back enough to the investors who put in their own cash. Private equity firms use it to judge buyouts."}
 ]},
{id:"data",name:"Data & Research",q:"Can I trust this finding?",idea:"A finding earns trust only after you know **who's in the data, who's missing and what else could explain it**.",use:["Designing a survey or study","Someone hands you a striking statistic","Choosing which analysis to run"],
 tools:[
  {"id":"process","name":"The 8-Step Research Process","what":"Takes you from a question to a decision.","steps":["**Question:** what decision will this research inform?","**Outcome:** what exactly will you measure to answer it? For example, monthly sales per store.",["**Hypothesis:** what do you expect to find?",["The **null hypothesis** is the opposite: that there's no effect at all. Your data has to give you good reason to reject it."]],"**Alternatives:** what else could explain the result? Most people skip this step, and it catches most bad conclusions.","**Measure:** define the units, the time period and any cutoffs before you collect data.","**Sample:** decide who or what you'll collect data from, and check that it represents the group you care about.","**Method:** choose the test that fits the question. See Choosing a Method.","**Interpret and recommend:** say how big the effect is in everyday words, how sure you are and what to do about it."],"def":"The research process takes you from a business question to a decision backed by data, in eight steps. Use it to plan your own study or to judge someone else's."},
  {"id":"methods","name":"Choosing a Method","what":"Matches the question to the right test.","steps":[["**Comparing the averages of two groups,** such as sales in stores with and without a promotion:",["use a **t-test**"]],["**Checking whether two categories are related,** such as region and product choice, or whether a sample matches a population:",["use a **chi-square test**"]],["**Understanding how several factors together drive an outcome,** such as price, ads and season on sales:",["use **regression**","read each factor's direction and size","read its **p-value**: below 0.05 suggests the effect is real","read **R²**: the share of the ups and downs in the outcome that the model explains"]],["**Measuring the impact of a one-time event,** such as an announcement, on a stock:",["use an **event study**, which compares the stock's returns before and after the event with the overall market"]]],"watch":"A significant model can still explain little. A regression with R² of 0.20 leaves 80% of the variation unexplained.","def":"Each kind of question has a statistical test built for it. Choosing the right one keeps you from drawing a conclusion the data can't support."},
  {"id":"representativeness","name":"Representativeness Check","what":"Finds out who's missing from the sample.","steps":["Pick the traits that matter for your question, such as gender, region or company size.","Find the real population's mix for each trait, for example from census or industry data.","Compare your sample's mix with the population's. A **chi-square test** tells you whether a gap is too big to be chance.","Where a gap is real, add a caveat to any finding about that group.","Next time, close the gap by reaching out directly to the under-represented group."],"def":"A sample is the group you actually collected data from. It's only useful if it looks like the larger group you want to learn about. This check finds out who is over- or under-represented."},
  {"id":"survey","name":"Survey Design","what":"Makes sure a survey can answer the question it's for.","steps":["Write down the one decision the survey must inform. Then make sure you ask the central question directly. It's surprisingly easy to forget.","Use the same rating scale throughout. Decide on purpose whether to include a neutral middle option. Leaving it out pushes people to lean one way.","Add at least one open question, so people can tell you things you didn't think to ask.","If price matters to the decision, ask about **willingness to pay**: the most they would pay.","Include the background questions you'll need to compare groups later, such as age, role or region. You can't add them after the survey closes."],"def":"Survey design makes sure a survey can actually answer the question it's for. Small choices in wording and structure decide whether the results are useful."},
  {"id":"qualitative","name":"Interviews and Focus Groups","what":"Learns how people solve the problem today before testing new ideas.","steps":["Spend the first part of every conversation on **current behavior**: how they solve the problem today, what tools they use and where it's painful.","Only then show your ideas, and watch how they react.","Afterward, look for patterns across conversations. A pattern is stronger evidence than one memorable quote.","Expect the simplest idea that fits people's existing routine to win."],"def":"Interviews (one person at a time) and focus groups (a small group together) show how and why people behave the way they do. Use them before surveys or launches, to learn what's worth testing."},
  {"id":"pareto","name":"Pareto Analysis","what":"Finds the few causes driving most of the effect.","steps":["List the causes and how much each contributes, such as delay minutes by reason, revenue by customer or complaints by issue.","Sort them from largest to smallest.","Add a running total: each cause's share added to all the ones before it.","Find where the running total crosses 80%. The causes up to that point are your short list.","Fix those first. They give the most improvement for the effort."],"def":"Pareto analysis finds the few causes behind most of a problem. It rests on the Pareto principle: often about 80% of results come from about 20% of causes."},
  {"id":"base-incremental","name":"Base vs. Incremental Sales","what":"Separates what sells anyway from what promotions add.","steps":["Track your sales week by week, and mark the weeks with a promotion.","Estimate your base: your typical sales in weeks without a promotion.","In promotion weeks, the sales above the base are incremental. Compare them with what the promotion cost.","Compare your trend with the whole category's trend in the same store or market. The category is every product of that type, such as all yogurt."],"def":"**Base sales** are what you'd sell with no promotion running. **Incremental sales** are the extra units a promotion brings in. Separating the two shows whether promotions are really paying off.","read":["Category steady while your brand drops: shoppers haven't left. The store is likely shifting sales to rivals, often by promoting them instead.","Brand and category drop together: demand itself is falling. Promotions only buy short-term volume, so look at price, product or new uses."]}
 ]},
{id:"marketing",name:"Marketing",q:"Who buys, and why us?",idea:"Marketing decides **who you serve, what you promise them and how you reach them**. Understand the market, choose a target, build the offer, then launch with messages that answer real worries.",use:["Positioning or launching a product","Pricing and picking channels","Extending a product line or entering a new market"],
 tools:[
  {"id":"5cs","name":"The 5Cs","what":"Maps the situation before any plan.","steps":[["Write a few lines on each area:",["**Customers:** who they are, what they need and how they decide to buy","**Company:** your strengths, limits and goals","**Collaborators:** partners, suppliers and channels that help you reach customers","**Competitors:** direct ones (same product), secondary ones (different product, same need) and indirect ones (competing for the same budget)","**Context:** economic, legal, technology and social trends"]],"Highlight the two or three facts that will shape your plan most. Carry them into STP."],"def":"The 5Cs is a checklist for understanding a market before you plan anything. It covers the five areas that shape every marketing decision."},
  {"id":"stp","name":"STP","what":"Chooses who to serve and how to stand out.","steps":[["**Segment:** split the market into groups with different needs. Common ways to group people:",["where they live","who they are, such as age, income or job","what they value","how they behave and buy","the benefit they want most"]],"**Target:** choose the groups with the best mix of size, growth, fit with your strengths and ease of reaching them.","**Position:** write one sentence that says why your target should choose you, using the template above. If you can't fill in the “because,” the position isn't ready yet."],"formula":"For [target], [brand] is the [category] that [benefit], because [proof].","def":"STP stands for segment, target and position. It's how you decide who to serve and why they should choose you over the alternatives."},
  {"id":"4ps","name":"The 4Ps","what":"Turns the position into a plan.","steps":["**Product:** decide the features, the range of versions and the packaging.","**Price:** decide whether to price above, at or below competitors. Price signals quality as well as earning revenue.","**Place:** decide where and how people buy: online, in stores, through partners or through a sales team.","**Promotion:** decide the message and where you'll say it.","Check all four against your positioning. A premium position with discount pricing, for example, confuses customers."],"watch":"Going global, keep the brand consistent and adapt the 4Ps to each market's culture, income and channels.","def":"The 4Ps (product, price, place and promotion) turn your positioning into concrete decisions. All four should tell customers the same story."},
  {"id":"plc","name":"Product Life Cycle","what":"Matches the move to the product's stage.","steps":["**Introduction:** few people know the product exists. Focus on awareness and getting people to try it.","**Growth:** sales are rising fast. Expand distribution and win new customers before competitors catch up.","**Maturity:** growth slows and competition is fierce. Stand out, launch variations or find new uses.","**Decline:** sales are falling. Cut costs and collect the remaining profit, or reinvent the product."],"def":"The product life cycle describes the four stages most products move through, from launch to decline. The right marketing move depends on which stage yours is in."},
  {"id":"line-extension","name":"Line Extension Math","what":"Checks whether a new product pays after it eats into the core.","formula":"Incremental contribution = New product contribution − Extra SG&A − Launch marketing − Contribution lost from the core","steps":["Estimate the new product's sales volume and its **contribution**: sales minus variable costs.",["Subtract every new cost it creates:",["launch marketing","extra **SG&A** (selling, general and administrative costs, such as sales staff and overhead)"]],"Subtract **cannibalization**: the profit you lose when existing customers switch from your original product to the new one.","If what's left is small or negative, test the product in a few markets first, or sell it through a different channel to protect the original."],"def":"A line extension is a new version of an existing product, such as a new flavor, size or light version. This calculation checks whether it actually adds profit once you count the sales it takes from the original."},
  {"id":"messaging","name":"Barrier-Based Messaging","what":"Writes one message for each reason people don't act.","steps":[["List what stands between your audience and the action you want. The usual four:",["**Awareness:** they haven't heard of it","**Trust:** they doubt it","**Cost:** it seems too expensive or risky","**Access:** it seems too hard to get"]],"Write each barrier as the worry in their own words, such as “I've never heard of this” or “Who sees my data?”","Write one clear message that answers each worry directly.","End every message with one next step: sign up, call, visit or book."],"watch":"Inform before you persuade. When trust is the barrier, pushy messages make it worse.","def":"Barrier-based messaging writes one message for each reason people don't act on a good offer. People rarely ignore something useful for no reason. Something stops them, and each barrier needs its own answer."},
  {"id":"channel-mix","name":"Channel Mix","what":"Splits the budget by the job each channel does.","steps":[["Give each channel one **job**:",["**capture** people already looking (search)","**build awareness** (social, video)","**build trust** (community, referrals)","**convert** interest into sales (email, sales calls)"]],"Decide each channel's share of the budget based on how important its job is right now.","Pick one measure per channel that matches its job, such as cost per sign-up for search or number of referrals for community.","Start small, compare results after a few weeks and move money toward what works."],"def":"A channel is a place where you reach people, such as search, social media, email, events or partners. A channel mix splits your budget by the job each channel does best."}
 ]},
{id:"b2b",name:"B2B Marketing",q:"How do businesses buy?",idea:"Businesses buy as a **group**, on **risk and return**. Map everyone who decides, size the opportunity from the ground up, and make the economic value impossible to miss.",use:["Selling a product or service to companies","Sizing a business-to-business opportunity","Planning outreach to a few high-value accounts"],
 tools:[
  {"id":"committee","name":"Buying Committee Map","what":"Finds everyone who shapes a business purchase.","steps":["List every role involved, such as operations, purchasing, finance, IT, legal, the people who'll use it and the executive sponsor.",["Mark the key roles:",["**Champion:** wants you to win and argues for you inside the company","**Economic buyer:** controls the budget and gives final approval","**Technical buyer:** can block the deal over security or fit","**Users:** will work with the product every day"]],"For each role, write what they fear and what they need, such as reliability, total cost, return, compliance or ease of use.","Give each role its own message and proof. Give your champion ready-made material to make your case when you're not in the room."],"def":"When a business buys something, a group decides. This group is called the **buying committee**. A buying committee map lists everyone who can say yes or no, and what each person needs to hear."},
  {"id":"critical-three","name":"The Critical Three","what":"Narrows a large buying group to the people who decide.","steps":[["From the full committee, pick three roles. Usually they are:",["whoever owns the problem","whoever controls the money","whoever can block the deal"]],"Write each one's top concern in a single sentence.","Build your pitch so each concern gets a direct answer backed by evidence."],"def":"Big buying committees can have ten or more people. The critical three narrows your focus to the three people whose “yes” actually moves the deal."},
  {"id":"sizing","name":"Bottom-Up Opportunity Sizing","what":"Sizes a business opportunity from real units instead of industry totals.","formula":"Opportunity = Price per unit × Units per customer × Number of customers","steps":["Count how many units one customer would need, such as how many devices one hospital uses or how many licenses one team needs. Get a real number by visiting a site or interviewing staff.","Put a price on one unit.","Count how many customers you can realistically reach.","Multiply: price × units per customer × number of customers.","Write down every assumption, so a buyer or investor can check and adjust it."],"def":"Bottom-up sizing estimates a business opportunity by counting real units and customers, instead of taking a percentage of a big industry total. Buyers and investors trust it more because every number can be checked."},
  {"id":"value-fast","name":"Economic Value Messaging","what":"Leads with what the buyer gains in money, time or risk.","steps":["Translate each feature into an outcome, such as hours saved, costs cut, failures avoided or revenue gained.","Put the biggest outcome first: in the first line of the email, at the top of the website and on the first slide.","Back it with a number from a real customer: how much they saved or gained, and how fast.","State the value before asking for anything, whether it's a click, a call or a meeting."],"def":"Economic value messaging leads with what a business buyer gains in money, time or reduced risk. Business buyers have to justify every purchase, so they respond to outcomes they can put in a budget."},
  {"id":"outreach","name":"Persona-Based Outreach","what":"Reaches the right people at target accounts with messages built for their role.","steps":["Pick your target companies. Look for ones that feel the problem most and can decide quickly.","Research each company: its current challenges and who plays each buying role.","Write a different message for each role, such as technical, financial, champion and compliance.","Plan the sequence from first contact to a demo. Keep a real person on every high-trust moment: introductions, demos and pricing conversations."],"def":"A persona is a profile of one type of person, such as a finance lead or an IT manager. Persona-based outreach writes to each person at a target company about their own job and worries."},
  {"id":"channel","name":"Channel Incentives","what":"Keeps distributors and retailers pushing your product.","steps":["When a channel partner cools on your product, compare what they earn selling it with what they earn selling rivals' products.","Check whether rivals pay for promotions, displays or shelf space that you don't.",["Respond with something that makes your product worth their effort:",["better **trade terms**, such as discounts or longer payment terms","exclusive products or deals","shared marketing"]]],"watch":"When sales through a channel fall, check the channel's incentives before you assume shoppers lost interest.","def":"Distributors and retailers sit between you and the end customer. They're customers too, and they push the products that earn them the most. Watching their incentives explains many sudden sales drops."}
 ]},
{id:"negotiation",name:"Negotiation & Persuasion",q:"How do I get to yes?",idea:"Most of a negotiation happens **before you sit down**, and the relationship lasts longer than the deal.",use:["Negotiating a salary, vendor contract or sale","Preparing for a hard conversation","Working across cultures"],
 tools:[
  {"id":"four-numbers","name":"The Four Numbers","what":"The numbers to know before any negotiation.","steps":["**BATNA** (best alternative to a negotiated agreement): what you'll do if this deal falls through, such as take another job offer. A strong BATNA is your real source of power.","**Walkaway point:** the worst deal you'll accept. Set it just better than your BATNA.","**Target:** an ambitious result you can justify with facts.","**Opening:** your first offer. Set it beyond your target to leave room to move.","Estimate the same four numbers for the other side. The overlap between your walkaway point and theirs is the **ZOPA** (zone of possible agreement): the range where a deal can happen."],"def":"These are the four numbers to work out before any negotiation, whether it's a salary, a contract or a sale. Knowing them keeps you from accepting a bad deal or walking away from a good one."},
  {"id":"anchoring","name":"Anchoring","what":"Uses the first number to shape the range.","steps":["Make the first offer when you know enough to justify it.","Back it with two or three hard facts, such as market data, what you've invested or past offers.","If they open with an extreme number, don't negotiate from it. Say calmly that it's far off, and restart the conversation from your own facts."],"def":"Anchoring is the pull the first number has on a negotiation. Once a number is on the table, the final deal tends to land closer to it."},
  {"id":"dist-int","name":"Distributive vs. Integrative","what":"Tells you which game you're playing.","steps":[["**In a distributive negotiation:**",["open with a strong, well-backed number","make small, careful concessions"]],["**In an integrative negotiation:**",["list every issue, such as price, timing, payment terms and support","trade what's cheap for you but valuable to them"]],"Most real deals have integrative room. Ask questions to learn what the other side cares about most, then build trades around it."],"def":"Negotiations come in two kinds. **Distributive** ones split a fixed amount, usually price, so one side's gain is the other's loss. **Integrative** ones cover several issues the sides value differently, so trades can leave both better off. Knowing which you're in tells you which tactics to use."},
  {"id":"concessions","name":"Concession Plan","what":"Decides what you'll give, in what order.","steps":["Rank every issue by how much it matters to you.","List what you're willing to concede, in what order and in small steps. Big early concessions signal there's much more to give.","List what you won't concede at all.","Never give something without getting something back. Use the form “If you can do X, I can do Y.”"],"def":"A concession plan decides in advance what you're willing to give up, and in what order. It keeps you from giving away value in the heat of the moment."},
  {"id":"power","name":"Sources of Power","what":"Maps leverage on both sides.","steps":[["Map each source of power for both sides:",["**Legitimacy:** facts, standards, precedent and track record that back your position","**Alternatives:** your BATNA. The side with the better fallback can walk away.","**Time:** whoever needs the deal sooner has less power.","**Information:** what each side knows about the other's needs and limits"]],"Show your power through calm, unhurried behavior.","Keep your own deadline to yourself."],"def":"Power in a negotiation is your ability to get a better deal. It comes from several sources, and both sides have some. Mapping them shows where you're strong and where you're exposed."},
  {"id":"pre-table","name":"Win Before the Table","what":"Sets up the outcome before the meeting starts.","steps":["Build the relationship early, before there's anything to negotiate.","Build credibility through results, so your word carries weight.","Prepare your numbers, your strategy and how you'll open.","Remember that signals start the moment you walk in: what you lead with, how you listen and how relaxed you seem."],"def":"Much of a negotiation's outcome is settled before the meeting starts, through relationships, reputation and preparation."},
  {"id":"intangibles","name":"Intangibles","what":"Uses what isn't money to close the gap on a deal.","steps":["Ask what the other person needs to show their boss or team to count this as a win.","Ask about their timing and any pressures they're under.","Ask whose reputation is at stake, and how.","Offer things that cost you little but matter to them, such as a quick start, public credit or a favorable announcement."],"def":"Intangibles are the parts of a deal that aren't money, such as credit, timing or reputation. They can close gaps that price can't."},
  {"id":"ethics","name":"Ethics Line","what":"Separates tough tactics from deception.","steps":[["**Acceptable:**",["an ambitious opening offer","keeping your deadline or walkaway point private","holding firm"]],["**Not acceptable:**",["making promises you won't keep","misstating facts","getting information through improper means"]],"When unsure, ask yourself: would I be comfortable if the other side later learned exactly what I did?"],"watch":"Trust is the most valuable and most fragile currency in a negotiation. Deception can win a round and lose the relationship, and it can carry legal risk.","def":"The ethics line marks where tough negotiating ends and deception begins. Staying on the right side protects your reputation, the relationship and sometimes your legal standing."},
  {"id":"culture","name":"Across Cultures","what":"Reads the other side's cultural defaults.","steps":[["Check three dimensions:",["**Direct or indirect:** is disagreement said plainly or only implied?","**Individual or group:** does one person decide, or the group?","**Task-first or relationship-first:** do people want to get straight to business, or get to know you first?"]],"Adjust your style. Directness can feel rude in indirect cultures, and silence may simply mean the group hasn't agreed yet.","In relationship-first cultures, invest time in the relationship before pushing on the deal."],"def":"People from different cultures bring different default expectations to a negotiation. Reading them avoids friction that has nothing to do with the deal itself."},
  {"id":"steady","name":"Staying Steady","what":"Keeps emotion from driving concessions.","steps":["Pause before you respond, even for a few seconds.","Name the emotion to yourself, such as “I'm feeling pressured,” without letting it drive your reply.","Repeat the other side's point back to them before making yours. They feel heard, and you gain time to think.","Speak in short, clear sentences, cut filler words and check that your key point landed."],"def":"Emotions can make people concede too much or walk away too soon. These four habits keep you steady under pressure."}
 ]},
{id:"ai",name:"AI at Work",q:"How do I put AI to work?",idea:"AI is fastest at **research, drafting and repetitive work**. People stay on judgment and anything that builds trust. Work through four stages: decide where AI fits, build it so it's reliable, get output you can check, then roll it out so people actually use it.",use:["Your team loses hours to research, first drafts or copy-paste work","You're deciding whether an AI idea is worth building","You need AI answers you can trust and check","You're rolling out an AI tool and want people to use it"],
 tools:[
  {"id":"hitl","name":"Human-in-the-Loop Map","what":"Splits a workflow between AI and people.","steps":["Write down the workflow you want to improve, one step per line, from start to finish.",["Label every step with one of four tags:",["**Research:** gathering or summarizing information.","**Drafting:** writing a first version of an email, summary or report.","**Execution:** routine actions, such as scheduling, sending reminders or updating records.","**Trust moment:** anything where a customer's or colleague's trust is on the line, such as a demo, a negotiation, a hard decision or a sensitive message."]],"Let AI lead the research, drafting and execution steps. They are repetitive and easy to check.","Keep a person in charge of every trust moment. A mistake there costs more than the time AI would save.","Add a human review before anything AI made reaches a customer, even on the steps AI leads."],"def":"A human-in-the-loop map shows which steps of a workflow AI can handle on its own and which steps need a person. Use it before adding AI to a process, so you speed up the routine work and keep people on the moments that need judgment."},
  {"id":"adoption","name":"AI Adoption Plan","what":"Rolls out AI in a team as a change-management project.","steps":["**Start small.** Pick one team or one workflow where the frustration is most visible, such as hours spent retyping the same information.",["**Learn how the work really happens.** Before introducing anything, ask the people doing it:",["“Walk me through a typical day.”","“Where do things slow down?”","“Where do you copy or retype the same information?”"]],"**Build momentum.** Help a few curious people use the tool first, then share their small wins, such as an hour saved each week or fewer errors.",["**Set guardrails** before use spreads. Agree on:",["what data can go into the tool and what must stay out","who has access","who reviews AI output before it's used"]],"**Measure, then expand.** Write down what worked and what didn't, give each next step an owner, then roll out to the next team."],"watch":"Mandates rarely stick on their own. If people can't see what the tool saves them, they go back to the old way.","def":"An AI adoption plan is a step-by-step way to get a team to actually use a new AI tool. People change habits when a tool removes a frustration they already feel, so the plan starts with their daily work and grows from small wins."},
  {"id":"fit-check","name":"AI Project Fit Check","what":"Tests whether an AI idea fits your needs and resources before you build.","steps":[["Answer six questions about what you **need**:",["**Scale:** how many people will use it?","**Customization:** how specific to your business must it be?","**Interaction:** will people chat with it, or will it run quietly in the background?","**Privacy:** how sensitive is the data it will see?","**Speed:** how fast must it respond?","**Connectivity:** will it run online, offline or on a device like a phone?"]],["Answer three questions about what you **have**:",["people with AI skills","budget","time"]],["Pick the lightest option that meets your needs. From lightest to heaviest:",["**Ready-made tool:** an AI product you can buy and use today.","**Adjusted model:** an existing AI model trained further on your own data, often called fine-tuning.","**Custom build:** a system designed for you from scratch."]],"Check your data before you commit. It should be accurate, complete and easy to reach."],"read":["High privacy or offline needs push toward smaller models running on your own systems or devices.","Few people and little time point to an existing tool before anything custom."],"watch":"Most AI projects stall on data and people. A strong model can't fix messy data or a team that won't use it.","def":"A fit check is a short set of questions to answer before building anything with AI. It tells you whether the idea is worth doing and which kind of AI solution matches it, so you don't spend months on a custom build when a ready-made tool would do."},
  {"id":"two-way","name":"Top-Down Meets Bottom-Up","what":"Sets an AI strategy that leaders steer and employees actually use.","steps":["**From the top:** leaders set the goal for AI and choose two or three uses with clear business value, such as faster customer replies or cheaper reporting.","**From the ground up:** invite employees to try AI in their own work and share what helps. Collect their ideas in one place.",["**Invest in the basics** both groups need:",["clean data people can reach","tools the company already pays for","training on how to use them well"]],"**Set responsible AI rules early.** Agree on security, privacy and fairness before use spreads, so nobody has to undo bad habits later.","**Measure against business goals,** such as time saved or revenue gained, and keep the uses that move them."],"watch":"A vision with no bottom-up experiments stays a slide. Experiments with no vision scatter into tools nobody maintains.","def":"This is a way to set an AI strategy that combines direction from leaders with ideas from employees. Leaders know where the business needs to go. Employees know where the daily work is slow. A strategy that uses both gets adopted."},
  {"id":"prompting","name":"Prompting for Analysis","what":"Gets analysis from AI that you can use and check.","steps":["**Give context.** Say who you are, what decision you're making and why it matters. For example: “I'm a product manager deciding whether to raise our price.”","**Give the exact inputs.** Paste or attach the numbers, files or data the AI should use, and say which ones matter most.","**State the task in one sentence.** For example: “Estimate how revenue changes if we raise the price by 5%.”","**Say what you want back:** a table, a chart, a short memo or a file, and how long it should be.",["**Ask in stages,** so you can check each one:",["first a base case","then variations, such as a higher and a lower price","then a chart"]],"**Ask it to show its formulas or reasoning,** so you can check the math yourself."],"def":"A prompt is the instruction you give an AI tool. For analysis, a good prompt reads like a clear brief to a capable colleague: who you are, what you need, from which data and in what form. A clear brief gets a usable answer the first time."},
  {"id":"prompt-patterns","name":"Prompt Patterns","what":"Gives you a menu of ways to ask, from quick to structured.","steps":[["Pick the pattern that fits your task:",["**Zero-shot:** just ask, with no examples. Good for simple tasks.","**Few-shot:** show one or more examples of the output you want. Good when format matters.","**Role:** tell it who to act as, such as “a CFO reviewing this budget,” to set its tone and focus.","**Chaining:** split a big task into smaller prompts and feed each answer into the next.","**Step-by-step:** ask it to reason through the problem one step at a time. Good for logic and math.","**Prompt improvement:** ask the AI to rewrite your prompt so it's clearer, then use the better version."]],"If the answer misses, switch patterns using the quick guide below.","Save prompts that work as templates your team can reuse."],"read":["Wrong format: add an example.","Wrong tone: add a role.","Wrong logic: ask for the steps, then check them."],"def":"Prompt patterns are standard ways of asking an AI for help. Each suits a different kind of task. Knowing them lets you fix a weak answer by changing how you ask."},
  {"id":"grounding","name":"Grounding and RAG","what":"Ties AI answers to your own documents so they stay accurate and current.","steps":["Collect the documents the AI should rely on, such as policies, product information and past work. Remove duplicates and old versions.",["Sort them into two groups:",["**Stable knowledge** that rarely changes, such as definitions and policies.","**Project knowledge** that changes often, such as this quarter's numbers or a current client."]],["When someone asks a question, the system works in three moves:",["**Retrieve:** it searches your documents for the most relevant passages.","**Augment:** it adds those passages to the question it sends the AI.","**Generate:** the AI writes an answer from those passages and cites them."]],"Review the documents regularly. Update or remove anything out of date."],"watch":"The answer can only be as good as what gets retrieved. Messy, outdated or duplicate documents produce confident wrong answers.","def":"Grounding means making an AI answer from your own trusted documents instead of from its general memory. The most common method is **RAG** (retrieval-augmented generation). It keeps answers accurate and current, and shows people where each answer came from."},
  {"id":"verify","name":"Verify the Output","what":"Catches confident AI mistakes before they reach anyone.","steps":["Recompute one or two key numbers yourself, by hand or in a spreadsheet.","Check the method. Did it use the formula, data and time period you asked for?","Ask it to list its assumptions, then check each one.","Look up any names, dates, quotes and figures it states. Made-up details, called **hallucinations**, most often appear there.","If something is wrong, tell it exactly what and ask it to redo that part."],"def":"Verifying means checking an AI's work before you rely on it. AI can sound confident and still be wrong, so a quick check belongs in every important use."},
  {"id":"guardrails","name":"Guardrails in the Pipeline","what":"Builds checks into an AI product so mistakes get caught before users see them.","steps":["**Before the AI sees anything:** remove personal data, such as emails, phone numbers and card numbers.","**In the instructions:** state the exact task, the audience and the level of detail, so the AI stays on topic.","**After it answers:** check how confident it is. When confidence is low, show the user a “please verify” note.","**Against the source:** compare the answer with the documents it was given. If they don't match, warn the user.","**After launch:** filter harmful or biased language, and give users a “report a wrong answer” button. Make sure someone reads the reports."],"watch":"Guardrails cost speed. Put the heaviest checks where an error would hurt most.","def":"Guardrails are automatic checks built into an AI product. They catch mistakes and risks before a user sees them, at every stage from the question going in to the answer coming out."},
  {"id":"agents","name":"Agent Anatomy","what":"Explains what an AI agent is made of, so you can scope one.","steps":["**Define the goal.** Describe what a finished task looks like, such as “a meeting booked with the right people.”",["**Name its three parts:**",["**Model:** the AI that does the thinking.","**Reasoning loop:** how it works. It observes, decides, acts, then repeats until the goal is met.","**Tools:** what it uses to act, such as search, a calendar or a database."]],["**Choose the type:**",["**Rule-based:** follows fixed steps. Predictable, but rigid.","**Generative:** decides its own steps. Flexible, but less predictable."]],["**Set its freedom,** also called autonomy. It can:",["only suggest actions","act after a person approves","act on its own"]],"**List every tool it can touch** and exactly what it may do with each, such as read the calendar but never delete events."],"read":["Money, health or anything hard to undo: keep a person approving each action.","Low-risk, repeatable tasks: more autonomy is fine."],"def":"An AI agent is an AI system that works toward a goal by taking actions on its own, such as searching, booking or updating records. Breaking an agent into its parts helps you decide what it should do and how much freedom to give it."},
  {"id":"north-star","name":"Outcome Metric for AI","what":"Picks one metric that shows the AI is actually helping.","steps":["Define a **completed outcome** for the user, such as a task finished, a question resolved or a purchase made.",["Check that it shows value for everyone involved at once:",["the **user**, who got something done","any **partners**, such as sellers or providers","the **business**, which earns from it"]],"Choose it over usage counts, such as logins or messages. Usage can grow while nobody is helped.","Track a few supporting numbers under it, such as success rate, time saved and errors caught."],"def":"An outcome metric is the one number that shows an AI product is actually helping people. It counts finished results, such as questions resolved, instead of activity, such as messages sent."},
  {"id":"examiner","name":"AI as Examiner","what":"Uses AI to test what you know.","steps":["Paste in your notes or reading material.","Ask for questions that test whether you can apply the ideas and make judgments, beyond recalling facts.","Ask for one question at a time, with all feedback held until you've answered every one.","Read the feedback, study what you missed, then ask for a new set on those areas."],"def":"This uses AI as a study partner that quizzes you. Answering questions shows what you actually understand, which makes it a fast way to learn a new field."},
  {"id":"phases","name":"Phased Rollout","what":"Scales an AI tool without losing trust.","steps":["**Prototype:** use it for one narrow task, with a person reviewing every output.","**Integrate:** connect it to your real systems and data, and let a wider group use it.","**Scale:** automate the parts that proved reliable, then add new uses.",["Before each phase, set two things:",["a **cost limit:** the most you'll spend","a **success measure:** the result that lets you move on, such as 95% of answers correct"]],"Move to the next phase only when the success measure is met."],"def":"A phased rollout brings in an AI tool in stages. Each stage proves the tool works before more people depend on it, so trust grows along with use."},

/* flow(): stages left to right, one box per tool, so every tool in the playbook appears in its sketch */
function flow(pid,title,stages){
  const p = PB.find(x=>x.id===pid), name = id => p.tools.find(t=>t.id===id).name;
  const n = stages.length, gap = 15, W = 720, cw = (W-gap*(n-1))/n, nodes = [], arrows = [];
  let most = 0;
  stages.forEach(([lab,sub,ids],i) => {
    const x = 20 + i*(cw+gap);
    nodes.push(['h'+i,x,20,cw,80,(i+1)+' '+lab,sub,ids[0],i===0]);
    ids.forEach((id,j) => nodes.push(['n'+i+'_'+j,x+8,128+j*70,cw-16,60,name(id),'',id,false,'']));
    if (i<n-1) arrows.push([x+cw+1,55,x+cw+gap-1,55,0]);
    most = Math.max(most,ids.length);
  });
  return {h:128+most*70+6,title,nodes,arrows};
}
/* biggest size (up to cap) at which a label fits a box width, on one line or split over two */
function fitLabel(label, w, cap){
  const est = l => l.length*0.43, one = {size:Math.min(cap, w/est(label)), lines:[label]};
  const parts = label.match(/[^\s-]+-?/g) || [label]; let best = one;
  for (let k=1;k<parts.length;k++){
    const join = a => a.reduce((s,t,i) => s + (i && !a[i-1].endsWith('-') ? ' ' : '') + t, '');
    const lines = [join(parts.slice(0,k)), join(parts.slice(k))], size = Math.min(cap, w/Math.max(...lines.map(est)));
    if (size > best.size + .5) best = {size, lines};
  }
  return best;
}

  const path = (g,d,extra) => g.appendChild(R ? R.path(d,o(extra)) : el('path',{d,fill:'none'}));
  const text = (g,x,y,t,cls,anchor='middle') => { const e = el('text',{x,y,class:cls,'text-anchor':anchor},g); e.textContent = t; return e; };
  const arrow = (g,[x1,y1,x2,y2,b]) => { const mx=(x1+x2)/2 + b, my=(y1+y2)/2 - Math.abs(b)/2; path(g,`M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}`); const a=Math.atan2(y2-my,x2-mx), L=10; path(g,`M${x2-L*Math.cos(a-0.45)} ${y2-L*Math.sin(a-0.45)} L${x2} ${y2} L${x2-L*Math.cos(a+0.45)} ${y2-L*Math.sin(a+0.45)}`); };
  const wire = (g,label,target) => {
    if (mini) return;
    g.setAttribute('tabindex',0); g.setAttribute('role','button'); g.setAttribute('aria-label',label);
    const act = () => onPick(target);
    g.addEventListener('click',act); g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act()}});
  };
  const top = 50; const root = el('g',{transform:`translate(0 ${top})`},svg);
  text(svg,20,32,spec.title,'note','start').setAttribute('style','font-size:25px');
  if (spec.lanes) spec.lanes.forEach(([x,y,w,h,lab]) => { const g = el('g',{},root); rect(g,x,y,w,h,{strokeLineDash:[7,6],strokeWidth:1.1}); text(g,x+16,y+26,lab,'k','start').setAttribute('style','font-size:19px;font-weight:700'); });
  if (spec.center) {
    const c = spec.center, cy = c.cy, dg = el('g',{},root);
    (spec.nodes||[]).forEach(([id,x,y,w,h]) => { const mid = x < 380 && x+w > 380, nx = mid ? x+w/2 : (x < 380 ? x+w : x), ny = mid ? y : y+h/2, dx = nx-380, dy = ny-cy, k = 1/Math.sqrt((dx/122)**2+(dy/66)**2); if (k<1) path(dg,`M${nx} ${ny} L${380+dx*k} ${cy+dy*k}`,{strokeLineDash:[6,6],strokeWidth:1.1}); });
    const g = el('g',{class:'node'+(mini?' on':''),'data-t':c.go},root);
    el('ellipse',{cx:380,cy,rx:112,ry:58,class:'hlr'},g);
    g.appendChild(R ? R.ellipse(380,cy,240,128,o()) : el('ellipse',{cx:380,cy,rx:120,ry:64,fill:'none'}));
    text(g,380,cy-6,c.t,'t'); text(g,380,cy+22,c.s,'s');
    wire(g,c.t,c.go);
  }
  if (spec.arrows) { const g = el('g',{},root); spec.arrows.forEach(a => arrow(g,a)); }
  if (spec.line) {
    const g = el('g',{class:'node','data-t':'four-numbers'},root); const ly = 104;
    el('rect',{x:220,y:ly-18,width:340,height:36,class:'band'},g);
    rect(g,220,ly-18,340,36,{strokeWidth:1.2}); g.lastChild.classList.add('accent');
    text(g,330,ly-26,'deal zone (ZOPA)','note');
    path(g,`M30 ${ly} L728 ${ly}`,{strokeWidth:1.6}); arrow(g,[700,ly,730,ly,0]);
    text(g,728,ly+30,'better for you','k','end');
    spec.marks.forEach(([x,lab,sub,up]) => { path(g,`M${x} ${ly-16} L${x} ${ly+16}`,{strokeWidth:2.4}); const ty = up ? ly-62 : ly+52; text(g,x,ty,lab,'t'); text(g,x,ty+22,sub,'s'); });
    wire(g,'Open The Four Numbers','four-numbers');
  }
  (spec.nodes||[]).forEach(([id,x,y,w,h,label,sub,target,hi,kicker,fsz]) => {
    const g = el('g',{class:'node','data-t':target},root);
    el('rect',{x:x+3,y:y+3,width:w-6,height:h-6,class:'hlr'},g);
    rect(g,x,y,w,h);
    const lines = (sub||'').split('\n').filter(Boolean);
    let ty = y + h/2 - (lines.length? (lines.length*24)/2 : -9) + (kicker? 10 : 5);
    if (kicker) text(g,x+w/2,y+28,kicker,'k');
    const fit = fitLabel(label, w-12, fsz || 24);
    if (lines.length) { const lt = text(g,x+w/2,ty,label,'t'); if (fsz) lt.setAttribute('style','font-size:'+fsz.toFixed(1)+'px'); }
    else fit.lines.forEach((l,k,a) => text(g,x+w/2,y+h/2+(k-(a.length-1)/2)*(fit.size+2)+fit.size*0.35,l,'t').setAttribute('style','font-size:'+fit.size.toFixed(1)+'px'));
    lines.forEach((l,i) => { if (l.includes(' · ')) { const [a,b] = l.split(' · '); text(g,x+w/2,ty+26+i*22,a+'  ·  '+b,'s'); } else text(g,x+w/2,ty+26+i*22,l,'s'); });
    wire(g,'Open '+label,target);
  });
  (spec.notes||[]).forEach(([x,y,t,a]) => { const n = text(root,x,y,t,'note',a); if (t==='×') n.setAttribute('style','font-size:30px'); });
  return svg;
}

        <p class="rv" style="--i:3">I'm an MBA candidate at Indiana University's Kelley School of Business. Prior to business school, I worked in product management and design across fintech, e-commerce and enterprise. Most recently, I spent an amazing summer as an AI Strategist intern at The New York Times.</p>
