<script>
/* ---------- CONTENT ---------- */
const LAST_CHECKIN = '2026-10-22'; /* updated by the monthly check-in */
const PB = [
{id:'strategy',name:'Strategy',q:'Where should we play?',
 idea:'Good strategy is a set of choices that reinforce each other, tested against what the company can actually execute. Work in three stages: **diagnose**, then **decide**, then **deliver**.',
 use:['Sizing up a company, an industry or a competitor','Weighing an acquisition, partnership or new market','Turning a strategy into goals people can track'],
 tools:[
 {id:'vrio',name:'VRIO',what:'Tests whether a capability gives a lasting advantage.',
  steps:['List the two or three **capabilities** that seem to drive the company\'s success. A capability can be a resource (a brand, a patent, a location) or something the company is good at doing (sourcing, design, service).','Test each one with four questions, in order. **Valuable:** does it help win customers or cut costs? **Rare:** do few competitors have it? **Costly to imitate:** would copying it take years, a special culture or secret know-how? **Organized:** are the company\'s structure, incentives and processes set up to make the most of it?','Stop at the first "no." How far a capability gets tells you how much advantage it gives, as shown below.','Look at how the capabilities work together. Several ordinary strengths that reinforce each other can be harder to copy than one standout strength.'],
  read:['No to Valuable: a **disadvantage**','Valuable only: **parity**','Valuable and Rare: a **temporary advantage**','All four: a **sustained advantage**']},
 {id:'steep',name:'STEEP',what:'Scans the outside forces a company can\'t control.',
  steps:['Scan the world outside the company through five lenses. **Socio-cultural:** values, demographics and how people behave. **Technological:** new tools and platforms. **Economic:** interest rates, costs, currency and the business cycle. **Environmental:** climate rules and sustainability pressure. **Political and legal:** regulation, trade policy and labor law.','Under each lens, list two or three trends that actually affect this business, with a source or number for each. Skip trends that are true but irrelevant.','Label each trend an **opportunity** (it could help the company) or a **threat** (it could hurt it). These feed straight into the O and T of a SWOT.']},
 {id:'five-forces',name:'Five Forces',what:'Shows how much profit an industry lets companies keep.',
  steps:['Think of an industry\'s profit as a pie that five forces compete for. Rate each force high, moderate or low, and write one sentence on why.','**Threat of new entrants:** how easy is it for a newcomer to start competing? High startup costs, strong brands and hard-to-get licenses keep it low.','**Buyer power:** can customers easily switch or push prices down? Power is high when a few big buyers account for most sales.','**Supplier power:** do a few suppliers control something the industry can\'t do without? If so, they can raise prices and take profit.','**Threat of substitutes:** could customers meet the same need with a different kind of product? Video calls, for example, substitute for business travel.','**Rivalry:** how hard do existing competitors fight? Many similar players, high fixed costs and slow growth usually lead to price wars.'],
  read:['The more forces rated high, the less profit is left in the industry.','Then ask where the company can position itself to escape the strongest forces.']},
 {id:'swot',name:'SWOT',what:'Pulls the diagnosis together and turns it into options.',
  steps:['Fill in **Strengths and Weaknesses** from inside the company. Your VRIO and Business Model Canvas work are the best sources.','Fill in **Opportunities and Threats** from outside the company. Pull them from your STEEP scan and Five Forces.','For every line, add evidence and a "so what": why does this matter for the decision you\'re facing?','Turn the grid into options by pairing items. Use a strength to capture an opportunity, or fix a weakness before a threat exploits it. A SWOT that doesn\'t end in options is just a list.']},
 {id:'bmc',name:'Business Model Canvas',what:'Maps how a company creates, delivers and captures value on one page.',
  steps:['Describe how the business works in nine boxes, a line or two each. **Customer segments:** who you serve. **Value proposition:** what problem you solve for them. **Channels:** how you reach them. **Customer relationships:** how you keep them. **Revenue streams:** how money comes in. **Key resources, key activities and key partners:** what you need, do and rely on. **Cost structure:** where money goes.','Mark each box as a strength or a weakness.','Find the **fragile box**: the one the rest of the model depends on. If it broke, what else would fall over? That\'s where to focus first.']},
 {id:'s-curve',name:'S-curve',what:'Shows when a growth engine is running out, so you can jump to the next one in time.',
  steps:['Most products and businesses grow in an S shape: a slow start, a fast climb, then a flattening as the market fills up. Place the company\'s main business on that curve.','If growth is flattening, name the next curve: the new technology, customer group or business model where growth is moving.','Ask what the company would need to win on that new curve that it doesn\'t have today, such as skills, content, customers or technology.','Decide how to get it: **build** it yourself (slow, full control), **partner** for it (faster, shared control) or **buy** a company that has it (fastest, most expensive).']},
 {id:'make-buy',name:'Make or Buy',what:'Decides whether to own a supplier or partner (vertical integration) or contract with it.',
  steps:['This tool decides whether to do something in-house (or own the supplier outright) or buy it from someone else.','Score **how hard it would be to write a complete contract** for it. Contracts get hard when the work needs specialized investment, when the future is uncertain, or when you deal with the supplier constantly.','Score **how important it is to your competitive advantage**. Is this part of why customers choose you?','Place it on the grid below. The harder it is to contract and the more it matters, the stronger the case for owning it.'],
  read:['Both high: **own it**','Both low: **buy it** on the market','Mixed: use a **partnership or long-term contract**']},
 {id:'hypothesis',name:'Hypothesis Testing',what:'Turns a big bet into a clear go, pivot or stop decision.',
  steps:['Write the big bet as one testable sentence: "Doing X is the best way to achieve Y." For example, "Acquiring this company is the fastest way to enter mobile gaming."','List the **conditions** that all have to be true for the bet to pay off: the value created must exceed the price paid, regulators must allow it, the integration must work, and the alternatives must be worse.','For each condition, name the data that would prove or disprove it, and go get that data.','Agree on the decision rule before you look at the results. All conditions hold: **go**. One fails: **pivot** to the next-best option. Several fail: **stop**.']},
 {id:'ambidexterity',name:'Ambidexterity',what:'Runs the core business and a new venture at the same time without one starving the other.',
  steps:['Ambidexterity means running the established business and a new venture at the same time. The two need different things, so treat them differently.','Give the new unit its **own structure**, with its own team and fewer approval layers, so it can move fast.','Give it **its own incentives and metrics**, tied to learning and milestones. Judging a new venture on the core business\'s profit targets will kill it early.','Make sure a senior leader **visibly champions** it and celebrates early wins, so people see it\'s a priority.','Share what genuinely helps, such as customers, technology or brand, and keep everything else separate.'],
  watch:'The core business is the funding engine and can quietly starve the new unit of money and talent.'},
 {id:'scorecard',name:'Balanced Scorecard',what:'Translates a strategy into goals and measures across four views.',
  steps:['A Balanced Scorecard turns a strategy into a short set of goals across four views, so you don\'t track money alone.','**Financial:** how the strategy should show up in growth, margins and cash.','**Customer:** what customers should experience, measured by things like adoption, satisfaction or market share.','**Internal process:** what the company must do well, such as speed to market, quality or efficiency.','**Learning and growth:** the people, skills and culture needed to deliver it.','Write two objectives per view, each with one number and a date. If you can\'t measure it, rewrite it until you can.']}
 ]},

{id:'innovation',name:'Entrepreneurial Innovation',q:'Is this idea worth building?',
 idea:'Strong founders keep learning until they understand the problem well enough to build the right thing. **Validate before you scale**, and tie every round of spending to evidence.',
 use:['Judging a startup, product idea or new venture','Choosing between technologies, partners or vendors','Deciding whether to keep going, pivot or stop'],
 tools:[
 {id:'problem',name:'Problem Framing',what:'Makes sure you\'re solving the right problem before designing a solution.',
  steps:['Write the problem in one sentence: **who** has it, **when** it shows up and **what it costs them** in time, money or frustration.','Talk to at least five to ten people who have the problem. Ask how they deal with it today and what they\'ve already tried. Listen more than you pitch.','Rewrite your sentence after each round of conversations. If it keeps changing, you\'re learning. That\'s good.','Only start designing solutions once the sentence stops changing. A clear problem makes good solutions much easier to spot.']},
 {id:'tam-sam-som',name:'Market Sizing',what:'Estimates how big the opportunity is, from the whole market down to what you can win soon.',
  formula:'TAM → SAM → SOM',
  steps:['Market sizing tells you how big the prize is, from the whole market down to what you can realistically win.','**TAM (total addressable market):** everyone who could ever use this kind of product, multiplied by what each would spend per year.','**SAM (serviceable available market):** the part of the TAM your product, location and channels can actually reach today.','**SOM (serviceable obtainable market):** what you can realistically win in the next two to three years. Build it bottom-up: count real customers in each segment and how much each would buy.','Pick a **beachhead**: one small segment you can win clearly. Winning it gives you proof, revenue and references that open the bigger segments.'],
  watch:'Investors trust a bottom-up SOM far more than "1% of a huge market."'},
 
{id:'validation',name:'Validation Ladder',what:'Proves customers will pay, in steps of rising commitment.',
  steps:['Validation means proving people will pay for your solution, using steps that ask for more commitment each time. Climb one rung before spending on the next.','**Interviews:** do people describe the problem without prompting, and does it really hurt?','**Surveys:** how many people have the problem, and which kinds of people have it most?','**Letters of intent:** will they sign a non-binding statement saying they plan to buy?','**Paid pilots:** will they pay your actual price, on your actual terms, for a small trial? This is the strongest signal you can get before launch.'],
  watch:'Agreeing that a problem hurts is a weaker signal than paying to fix it. Test your real price and terms, because a long contract or a share of revenue is its own reason to say no.'},
 {id:'plan-review',name:'Investor Readiness Check',what:'Reads your plan the way an investor will, before you pitch it.',
  steps:['Read your business plan the way an investor will, before you pitch it.','Score each area out of 10: **value proposition, market, go-to-market** (how you\'ll reach and win customers), **operations, team, financials, risks, milestones** and **exit** (how investors eventually get their money back).','Find the lowest score. That\'s where an investor will push hardest.','Write the investor\'s biggest objection in one sentence, then your answer in two.','Give the plan an honest verdict: **ready, ready with conditions, or not yet**.'],
  read:['Any area below 5 needs fixing before you pitch.','If you can\'t answer the main objection in two sentences, the plan isn\'t ready.']},
 {id:'gates',name:'Spending Gates',what:'Makes each round of money earn the next one.',
  steps:['Spending gates release money in stages, so each stage has to earn the next one. This limits how much you can lose if the idea doesn\'t work.','Split the plan into stages, such as prototype, first customers and expansion, instead of funding everything up front.','For each stage, set the **milestone** that unlocks the next round of money: a working prototype, a number of paying customers or a sales target.','Give each gate a **date, a number and a rule** for what happens if you miss it: try again once, change course or stop.','Spend only what the current stage needs.'],
  watch:'Without gates, money gets spent before the idea is proven, and stopping feels impossible.'},
 {id:'pivot',name:'Pivot Triggers',what:'Decides in advance what would make you change course.',
  steps:['A pivot is a deliberate change of direction when the evidence says the current plan won\'t work. Deciding the triggers in advance keeps the call objective.','Pick the one or two numbers that would prove the plan wrong, such as customer sign-ups, how often customers use the product or profit per customer.','Set the date you\'ll check them and the level that counts as a miss.','Write the fallback plan now, while you\'re calm. A cheaper or simpler version of the same idea is often the best one.'],
  watch:'Decide the trigger before you start. Once you\'re invested, every miss starts to look like bad luck.'},
 {id:'options',name:'Option Scorecard',what:'Compares technologies, partners or vendors fairly on the same scale.',
  steps:['Use this when you have to choose between several technologies, partners or vendors and want to compare them fairly.','Describe each option in one plain sentence: what it does and who it\'s for. If you can\'t, you don\'t understand it well enough yet.','Rate each option from 1 to 5 on four lenses. **Fit:** does it solve your problem? **Traction:** who already uses or pays for it? **Legal and regulatory:** patents, approvals and compliance. **Cost and terms:** price, contract length and how much you depend on them.','Weight the lenses by what matters most to you, multiply and add up a total for each option.','Put the options side by side. Pick the top score, then sanity-check it: does the winner feel right, and if not, which weight is off?'],
  read:['A low legal score can rule an option out on its own, whatever its total.','If two options tie, the one with more traction usually carries less risk.']},
 {id:'recommend',name:'The Recommendation',what:'Ends the work with one clear decision.',
  steps:['Every analysis should end in a decision someone can act on.','Name **one priority**: the single thing you recommend doing.','Give the **next action** with an owner and a date, so the recommendation turns into movement.','Give the **longer-term move** and what would need to be true for it.','If you truly recommend two paths, explain why both are needed, what each costs and what will decide between them later. Hedging without that reads as indecision.']}
 ]},

{id:'finance',name:'Finance & Accounting',q:'Is it worth the money?',
 idea:'Every money question comes down to **what it earns, what it costs and what could go wrong**. Pick the tool that matches your question, then test how much the answer moves when your assumptions change.',
 use:['Someone wants to cut a product that "loses money"','You need to know how much to sell to stop losing money','You\'re deciding if a project, loan or acquisition is worth it','You want to know if a stock or bond is fairly priced'],
 tools:[
 {id:'contribution',name:'Contribution Margin',what:'Shows what a product really adds before fixed costs.',
  formula:'Contribution = Sales − Variable costs',
  steps:['Contribution margin shows how much each sale actually adds to the business before fixed costs. It\'s the right number to use when deciding whether to keep or cut a product.','Split costs in two. **Variable costs** rise and fall with each unit sold, like materials and packaging. **Fixed costs** stay the same whatever you sell, like rent, salaries and equipment.','Subtract the variable costs from sales. What\'s left is the contribution: the money this product brings in to help pay the fixed costs.','Before cutting a product that "loses money" on paper, ask which fixed costs would actually disappear if it were gone. Usually very few do, so cutting it can make overall profit worse.','If contribution is positive and you have spare capacity, keep the product for now. Revisit when a better use of that capacity comes along.']},
 {id:'break-even',name:'Break-even',what:'Tells you how much you need to sell to cover fixed costs.',
  formula:'Break-even units = Fixed costs ÷ Contribution per unit',
  steps:['Break-even is the number of units you must sell to cover all your fixed costs. Below it you lose money. Above it you make money.','Work out the **contribution per unit**: price minus variable cost per unit.','Divide total fixed costs by the contribution per unit. The answer is your break-even volume.','Compare it to what you sell today. The gap shows how far you are from profit, and whether price, cost or volume is the easiest lever to pull.']},
 {id:'dupont',name:'DuPont Analysis',what:'Breaks return on equity into the three things that drive it.',
  formula:'ROE = Profit margin × Asset turnover × Equity multiplier',
  steps:['Return on equity (ROE) measures how much profit a company earns for every dollar its owners have put in. DuPont analysis breaks it into three drivers so you can see where the return really comes from.','**Profit margin** = net income ÷ revenue. How much of each dollar of sales the company keeps as profit.','**Asset turnover** = revenue ÷ total assets. How much in sales the company generates from what it owns.','**Equity multiplier** = total assets ÷ equity. How much of the company is funded with borrowed money. Higher means more debt.','Multiply the three to get ROE. Compare each driver with a competitor\'s to see why one company earns more than another.'],
  watch:'A high ROE built on **leverage** (borrowed money) is riskier than one built on margin, because debt magnifies losses as well as gains.'},
 {id:'npv',name:'NPV and Sensitivity',what:'Shows whether a project creates value and how much room for error it has.',
  formula:'NPV = Present value of future cash flows − Upfront cost',
  steps:['Net present value (NPV) tells you whether an investment is worth more than it costs, once you account for the fact that money later is worth less than money today.','Estimate the cash the project will bring in each year.','**Discount** each year\'s cash back to today using your required return (the minimum return you\'d accept for this level of risk). Spreadsheets do this with the NPV function.','Subtract the upfront cost. A positive NPV means the project creates value. A negative NPV means it destroys value.','Test the answer. Build a grid that varies the two most uncertain inputs, such as upfront cost and yearly cash, and color it as a heat map to see where the project turns negative.']},
 {id:'ddm',name:'Dividend Discount Model',what:'Values a mature, steady dividend-paying stock.',
  formula:'Price = Next year\'s dividend ÷ (Cost of equity − Dividend growth)',
  steps:['The dividend discount model values a stock by the dividends it will pay its owners. It works best for mature, stable companies with steady dividends.','Find next year\'s expected **dividend per share** and a realistic long-term **growth rate** for it.','Find the **cost of equity**: the return investors expect for owning this stock, given its risk.','Divide next year\'s dividend by the cost of equity minus the growth rate. Compare the result with today\'s share price.','Change the growth rate by 1% up and down. Small changes can swing the value a lot, so treat the answer as a range.'],
  watch:'It breaks for high-growth companies whose value isn\'t in near-term dividends.'},
 {id:'bonds',name:'Bond Yield and Spread',what:'Tells you whether a bond pays enough for its risk.',
  formula:'Spread = Bond yield to maturity − Treasury yield (same maturity)',
  steps:['This tells you whether a company\'s bond pays enough extra to make up for the risk of lending to that company.','Calculate the bond\'s **yield to maturity**: the yearly return you\'d earn if you bought at today\'s price and held it until it\'s repaid. In Excel, use the YIELD function.','Subtract the yield on a US Treasury bond that matures at about the same time. Treasuries are treated as risk-free, so the difference, called the **spread**, is your reward for taking on the company\'s risk.','Compare that spread with the average for bonds with the same **credit rating**. Higher than average may be a bargain or a warning sign. Lower than average means you\'re being paid less for the risk.']},
 {id:'sharpe',name:'Sharpe Ratio',what:'Judges a return against the risk taken to earn it.',
  formula:'Sharpe = (Portfolio return − Risk-free rate) ÷ Volatility',
  steps:['The Sharpe ratio judges an investment\'s return against the risk taken to earn it, so you can compare portfolios fairly.','Gather monthly returns over several years.','Calculate the average yearly return and the **volatility** (how much returns swing up and down, measured as standard deviation).','Subtract the **risk-free rate** (what you\'d earn on Treasury bills) from the return, then divide by volatility.','Compare the ratio with a benchmark such as the S&P 500.'],
  read:['Higher is better: more return for each unit of risk.','To raise it, add assets that don\'t move together. Diversifying cuts volatility without giving up much return.']},
 {id:'affordability',name:'Debt Affordability',what:'Tests whether a person or business can safely carry a loan.',
  steps:['This tests whether a person or business can safely take on a loan, including if interest rates move against them.','Set a ceiling for payments. For a person, lenders often cap all debt payments at about 36% of gross monthly income. For a business, compare payments with operating cash flow (the cash the business generates before financing).','Calculate the monthly payment at today\'s interest rate.','Recalculate with rates 1% higher and 1% lower to see if the payment still fits under the ceiling.','Name the trade-off: a smaller loan is safer but buys less.']},
 {id:'buyout',name:'Buyout Returns',what:'Checks whether an acquisition returns enough to the investor.',
  formula:'Enterprise value = Equity value + Net debt',
  steps:['This checks whether buying a company, often with a lot of borrowed money, will return enough to the investors who put in their own cash (the equity).','Find the **entry enterprise value**: the price for the whole company, meaning its equity plus its debt, minus its cash.','Project **EBITDA** five years out. EBITDA is earnings before interest, taxes, depreciation and amortization, a rough measure of operating profit.','Multiply future EBITDA by an **exit multiple** (the price-to-EBITDA ratio you expect a buyer to pay) to get the exit value, then subtract the debt still owed to get exit equity.','Divide exit equity by the equity you put in. That\'s your money multiple.','List the specific moves that would grow EBITDA, such as new products, better margins or selling directly to customers.'],
  read:['Investors often look for a money multiple of about 2 to 3 times over five years.','If the return only works when you sell at a higher multiple than you paid, treat that as a risk.']}
 ]},

{id:'data',name:'Data & Research',q:'Can I trust this finding?',
 idea:'A finding earns trust only after you know **who\'s in the data, who\'s missing and what else could explain it**.',
 use:['Designing a survey or study','Someone hands you a striking statistic','Choosing which analysis to run'],
 tools:[
 {id:'process',name:'The 8-Step Research Process',what:'Takes you from a question to a decision.',
  steps:['Use these eight steps whenever you need data to answer a business question, whether you\'re running a study or judging someone else\'s.','**Question:** what decision will this research inform?','**Outcome:** what exactly will you measure to answer it?','**Hypothesis:** what do you expect to find? The **null hypothesis** is the boring alternative, that there\'s no effect at all.','**Alternatives:** what else could explain the result? This is the step most people skip, and the one that catches most bad conclusions.','**Measure:** define units, time period and any yes-or-no cutoffs before collecting data.','**Method:** choose the test that fits the question (see Choosing a Method).','**Interpret and recommend:** say how big the effect is in plain words, how confident you are, and what to do about it.']},
 {id:'methods',name:'Choosing a Method',what:'Matches the question to the right test.',
  steps:['Match the question you\'re asking to the statistical test built for it.','**Comparing the averages of two groups**, like sales in stores with and without a promotion: use a **t-test**.','**Checking whether a sample matches a population, or whether two categories are related**, like region and product choice: use a **chi-square test**.','**Understanding how several factors together drive an outcome**, like price, ads and season on sales: use **regression**. Read the direction and size of each factor, its **p-value** (below 0.05 suggests the effect is real) and **R²** (the share of the ups and downs the model explains).','**Measuring the impact of a one-time event**, like an announcement, on a stock: use an **event study**, which compares returns before and after with the overall market.'],
  watch:'A significant model can still explain little. A regression with R² of 0.20 leaves 80% of the variation unexplained.'},
 {id:'representativeness',name:'Representativeness Check',what:'Finds out who\'s missing from the sample.',
  steps:['A sample is only useful if it looks like the group you want to learn about. This check finds out who is over- or under-represented.','Pick the traits that matter for your question, such as gender, region or company size, and find the real population\'s mix for each.','Compare your sample\'s mix with the population\'s. A **chi-square test** tells you whether a gap is big enough to be real rather than chance.','Where a gap is real, add a caveat to any finding about that group.','Fix the gap next time with targeted outreach to the under-represented group.']},
 {id:'survey',name:'Survey Design',what:'Makes sure a survey can answer the question it\'s for.',
  steps:['Write down the one decision the survey must inform, then ask the central question directly. It\'s surprisingly easy to forget.','Use the same rating scale throughout, and decide on purpose whether to include a neutral middle option. Leaving it out forces people to lean one way.','Add at least one open-ended question so people can tell you things you didn\'t think to ask.','If price matters to the decision, ask about **willingness to pay** directly.','Include the background questions (age, role, region) you\'ll need to compare groups later. You can\'t add them after the fact.']},
 {id:'qualitative',name:'Interviews and Focus Groups',what:'Learns how people solve the problem today before testing new ideas.',
  steps:['Interviews and focus groups tell you how and why people behave the way they do. Use them before surveys or launches.','Spend the first part of every conversation on **current behavior**: how they solve the problem today, what tools they use and where it\'s painful.','Only then show your concepts and watch how they react.','Look for patterns across conversations rather than single quotes. Expect the simplest idea that fits people\'s existing routine to win.']},
 {id:'pareto',name:'Pareto Analysis',what:'Finds the few causes driving most of the effect.',
  steps:['The Pareto principle says a few causes usually drive most of the effect, often about 80% of results from 20% of causes. This finds those few.','List the causes and how much each contributes, such as delay minutes by reason, revenue by customer or complaints by issue.','Sort from largest to smallest and add a running total.','Find where the running total crosses about 80%. Everything above that line is your short list.','Fix those first. They give you the most improvement for the least effort.']},
 {id:'base-incremental',name:'Base vs. Incremental Sales',what:'Separates what sells anyway from what promotions add.',
  steps:['Use this to tell how much of your sales would happen anyway and how much your promotions actually add.','**Base sales** are what you\'d sell with no promotion. **Incremental sales** are the extra units a promotion brings in.','Compare your trend with the whole category\'s trend in the same store or market.','If the category is flat while your brand drops, shoppers haven\'t left the category. The store is shifting sales from you to rivals, often because it\'s promoting them instead.','If your brand and the category drop together, demand itself is falling. Promotions will buy only short-term volume, so look at price, product or new uses instead.']}
 ]},

{id:'marketing',name:'Marketing',q:'Who buys, and why us?',
 idea:'Marketing decides **who you serve, what you promise them and how you reach them**. Understand the market, choose a target, build the offer, then launch with messages that answer real worries.',
 use:['Positioning or launching a product','Pricing and picking channels','Extending a product line or entering a new market'],
 tools:[
 {id:'5cs',name:'The 5Cs',what:'Maps the situation before any plan.',
  steps:['Before any marketing plan, map the situation across five areas.','**Customers:** who they are, what they need and how they decide to buy.','**Company:** your strengths, limits and goals.','**Collaborators:** partners, suppliers and channels that help you reach customers.','**Competitors:** direct ones (same product), secondary ones (different product, same need) and indirect ones (competing for the same budget).','**Context:** economic, regulatory, technology and social trends that could change the picture.']},
 {id:'stp',name:'STP',what:'Chooses who to serve and how to stand out.',
  steps:['STP stands for segment, target and position: decide who to serve and why they should pick you.','**Segment:** split the market into groups with different needs. Group them by geography, demographics, values and motives, behavior or the benefit they want.','**Target:** choose the segments with the best mix of size, growth, fit with your strengths and how easily you can reach them.','**Position:** write one sentence that says why your target should choose you, using the template above. If you can\'t fill in the "because," the position isn\'t real yet.'],
  formula:'For [target], [brand] is the [category] that [benefit], because [proof].'},
 {id:'4ps',name:'The 4Ps',what:'Turns the position into a plan.',
  steps:['The 4Ps turn your positioning into concrete decisions. Every P should tell the same story.','**Product:** features, the range you offer and packaging.','**Price:** above, at or below competitors. Price signals quality as much as it earns revenue.','**Place:** where and how people buy: online, in stores, through partners or a sales team.','**Promotion:** the message and where you say it.','Check the four against your positioning. A premium position with discount pricing, for example, confuses customers.'],
  watch:'Going global, keep the brand consistent and adapt the 4Ps to each market\'s culture, income and channels.'},
 {id:'plc',name:'Product Life Cycle',what:'Matches the move to the product\'s stage.',
  steps:['Products move through four stages. The right marketing move depends on where yours is.','**Introduction:** few people know it exists. Focus on awareness and getting it tried.','**Growth:** sales are rising fast. Expand distribution and reach new customers before competitors catch up.','**Maturity:** growth slows and competition is fierce. Differentiate, launch variations or find new uses.','**Decline:** sales are falling. Cut costs and collect the remaining profit, or reinvent the product.']},
 {id:'line-extension',name:'Line Extension Math',what:'Checks whether a new product pays after it eats into the core.',
  formula:'Incremental contribution = New product contribution − Extra SG&A − Launch marketing − Contribution lost from the core',
  steps:['A line extension is a new version of an existing product, like a light or flavored version. This checks whether it actually adds profit.','Estimate the new product\'s market share and volume, then its **contribution** (sales minus variable costs).','Subtract every new cost it creates: launch marketing and extra **SG&A** (selling, general and administrative costs such as sales staff and overhead).','Subtract **cannibalization**: the profit lost when existing customers switch from your core product to the new one.','If what\'s left is thin or negative, test in a few markets first, or sell it through a different channel to protect the core.']},
 {id:'messaging',name:'Barrier-Based Messaging',what:'Writes one message for each reason people don\'t act.',
  steps:['People rarely ignore a good offer for no reason. Something stops them. This writes one message for each of those barriers.','List the barriers between your audience and the action you want. The usual four are **awareness** (they haven\'t heard of it), **trust** (they doubt it), **cost** (too expensive or risky) and **access** (too hard to get).','Write each barrier as the worry in their own words, such as "I\'ve never heard of this" or "Who sees my data?"','Write one plain message that answers each worry directly.','End every message with one clear next step: sign up, call, visit or book.'],
  watch:'Inform before you persuade. When trust is the barrier, pushy messages make it worse.'},
 {id:'channel-mix',name:'Channel Mix',what:'Splits the budget by the job each channel does.',
  steps:['Channels are the places you reach people: search, social, email, events, partners, and so on. Each one is good at a different job.','Give each channel one **role**: capture people already looking (search), build awareness (social, video), build trust (community, referrals) or convert (email, sales).','Decide each channel\'s **share of the budget** based on that role.','Pick **one metric** per channel that matches its role, such as cost per sign-up for search or number of referrals for community partners.','Start small, compare results after a few weeks and move money toward what works.']}

 ]},

{id:'b2b',name:'B2B Marketing',q:'How do businesses buy?',
 idea:'Businesses buy as a **group**, on **risk and return**. Map everyone who decides, size the opportunity from the ground up, and make the economic value impossible to miss.',
 use:['Selling a product or service to companies','Sizing a business-to-business opportunity','Planning outreach to a few high-value accounts'],
 tools:[
 {id:'committee',name:'Buying Committee Map',what:'Finds everyone who shapes a business purchase.',
  steps:['When a business buys, a group decides. This maps everyone who can say yes or no.','List every role involved: operations, purchasing, finance, IT, legal, the people who\'ll use it and the executive sponsor.','Mark the key roles. The **champion** wants you to win and argues for you internally. The **economic buyer** controls the budget and signs off on return on investment. The **technical buyer** can veto on security or fit. **Users** live with the product every day.','For each role, write what they fear and what they need: reliability, total cost, return, compliance or ease of use.','Give each role its own message and proof, and give your champion ready-made material to sell for you when you\'re not in the room.']},
 {id:'critical-three',name:'The Critical Three',what:'Narrows a large buying group to the people who decide.',
  steps:['Big buying groups can have ten or more people. You can\'t win everyone equally, so focus.','From the full committee, pick the three roles whose "yes" actually moves the deal. Usually that\'s whoever owns the problem, whoever controls the money and whoever can block it.','Write each one\'s top concern in a single sentence.','Build your pitch so each of the three concerns gets a direct answer backed by evidence.']},
 {id:'sizing',name:'Bottom-Up Opportunity Sizing',what:'Sizes a business opportunity from real units instead of industry totals.',
  formula:'Opportunity = Price per unit × Units per customer × Number of customers',
  steps:['This sizes a business opportunity by counting real units, which buyers and investors trust far more than a slice of an industry total.','Count how many units one customer would need, such as how many devices one hospital uses or how many licenses one team needs. Get a real number by visiting a site or interviewing staff.','Put a price on one unit.','Multiply price × units per customer × the number of customers you can realistically reach.','Write down every assumption so a buyer or investor can check it and adjust it.']},
 {id:'value-fast',name:'Economic Value Messaging',what:'Leads with what the buyer gains in money, time or risk.',
  steps:['Business buyers care about outcomes, so lead with what they gain in money, time or reduced risk.','Translate each feature into an outcome: hours saved, costs cut, failures avoided, revenue gained.','Put the biggest outcome first: the first line of the email, the top of the website, the first slide.','Back it with a number from a real customer: how much they saved or gained, and how fast.','State the value before asking for anything, whether it\'s a click, a call or a meeting.']},
 {id:'outreach',name:'Persona-Based Outreach',what:'Reaches the right people at target accounts with messages built for their role.',
  steps:['Persona-based outreach means writing to each person at a target company in terms of their own job and worries.','Pick your target accounts. Look for companies that feel the problem most and can move quickly.','Research each account: its current challenges and who plays each buying role.','Write a different message for each role, such as technical, financial, champion and compliance.','Plan the sequence, from first contact through to a demo, and keep a real person on every high-trust moment: introductions, demos and pricing conversations.']},
 {id:'channel',name:'Channel Incentives',what:'Keeps distributors and retailers pushing your product.',
  steps:['Distributors and retailers sit between you and the end customer, and they\'re customers too. They push the products that earn them the most.','When a channel partner cools on you, compare what they earn selling your product with what they earn selling rivals\'.','Check whether rivals are paying for promotions, displays or shelf space that you aren\'t.','Respond with better trade terms (discounts, payment terms), exclusives or shared marketing that makes your product worth their effort.'],
  watch:'When sales through a channel fall, check the channel\'s incentives before you assume shoppers lost interest.'}
 ]},

{id:'negotiation',name:'Negotiation & Persuasion',q:'How do I get to yes?',
 idea:'Most of a negotiation happens **before you sit down**, and the relationship lasts longer than the deal.',
 use:['Negotiating a salary, vendor contract or sale','Preparing for a hard conversation','Working across cultures'],
 tools:[
 {id:'four-numbers',name:'The Four Numbers',what:'The numbers to know before any negotiation.',
  steps:['Before any negotiation, whether it\'s salary, a contract or a sale, know four numbers.','**BATNA** (best alternative to a negotiated agreement): what you\'ll do if this deal falls through. A strong BATNA is your real source of power.','**Walkaway:** the worst deal you\'ll accept. Set it just better than your BATNA.','**Target:** an ambitious outcome you can justify with facts.','**Opening:** your first offer, set beyond your target to leave room to move.','Estimate the same four for the other side. The overlap between your walkaway and theirs is the **ZOPA** (zone of possible agreement), where a deal can happen.']},
 {id:'anchoring',name:'Anchoring',what:'Uses the first number to shape the range.',
  steps:['The first number on the table pulls the final outcome toward it. That\'s anchoring.','Make the first offer when you know enough to justify it.','Back it with two or three hard facts: what you\'ve invested, market data, past offers or the other side\'s deadline.','If they anchor first and the number is extreme, don\'t negotiate from it. Say plainly that it\'s off base, and reset the conversation with your own facts.']},
 {id:'dist-int',name:'Distributive vs. Integrative',what:'Tells you which game you\'re playing.',
  steps:['Figure out what kind of negotiation you\'re in, because the tactics differ.','**Distributive:** one issue, usually price, and a fixed pie. Whatever one side gains, the other loses. Use strong anchors and small, careful concessions.','**Integrative:** several issues that each side values differently, like price, timing, payment terms and support. Trade what\'s cheap for you but valuable to them.','Most real deals have integrative room. Ask questions to find out what the other side cares about most, then build trades around it.']},
 {id:'concessions',name:'Concession Plan',what:'Decides what you\'ll give, in what order.',
  steps:['Plan what you\'ll give up before you sit down, so you don\'t give away value in the heat of the moment.','Rank every issue by how much it matters to you.','List what you\'re willing to concede, in what order and in small steps. Big early concessions signal there\'s much more to give.','List what you won\'t concede at all.','Never give something without getting something back. "If you can do X, I can do Y."']},
 {id:'power',name:'Sources of Power',what:'Maps leverage on both sides.',
  steps:['Power in a negotiation comes from several sources. Map them for both sides.','**Legitimacy:** facts, standards, precedent and your track record.','**Alternatives:** your BATNA. The side with the better fallback can walk away.','**Time:** whoever needs the deal sooner has less power.','**Information:** what each side knows about the other\'s needs and limits.','Show your power through calm, unhurried behavior, and keep your own deadline to yourself.']},
 {id:'pre-table',name:'Win Before the Table',what:'Sets up the outcome before the meeting starts.',
  steps:['Much of a negotiation\'s outcome is set before the meeting starts.','Build the relationship early, before there\'s anything to negotiate.','Build credibility through results, so your word carries weight.','Prepare your numbers, your strategy and how you\'ll open.','Remember that signals start the moment you walk in: what you lead with, how you listen and how relaxed you seem.']},
 {id:'intangibles',name:'Intangibles',what:'Uses what isn\'t money to close the gap on a deal.',
  steps:['Not everything in a deal is about money. Intangibles can close gaps that price can\'t.','Ask what the other person needs to show their boss or team to count this as a win.','Ask about their timing and any pressures they\'re under.','Ask whose reputation is at stake, and how.','Use what you learn to offer things that cost you little but matter to them, like a quick start, public credit or a favorable announcement.']},
 {id:'ethics',name:'Ethics Line',what:'Separates tough tactics from deception.',
  steps:['Know where tough negotiating ends and deception begins.','**Acceptable:** an ambitious opening, keeping your deadline or walkaway private, and holding firm.','**Not acceptable:** making promises you won\'t keep, misstating facts, or getting information through improper means.','When unsure, ask whether you\'d be comfortable if the other side later learned exactly what you did.'],
  watch:'Trust is the most valuable and most fragile currency in a negotiation. Deception can win a round and lose the relationship, and it can carry legal risk.'},
 {id:'culture',name:'Across Cultures',what:'Reads the other side\'s cultural defaults.',
  steps:['People from different cultures bring different default expectations to a negotiation. Reading them avoids needless friction.','Check three dimensions. **Direct vs. indirect:** is disagreement said plainly or implied? **Individual vs. group:** does one person decide, or the group? **Task-first vs. relationship-first:** do people want to get to business or get to know you first?','Adjust your style. Directness can feel rude in indirect cultures, and silence may simply mean the group hasn\'t agreed yet.','In relationship-first cultures, invest time in the relationship before pushing on the deal.']},
 {id:'steady',name:'Staying Steady',what:'Keeps emotion from driving concessions.',
  steps:['Emotions make people concede too much or walk away too soon. These habits keep you steady.','Pause before you respond, even for a few seconds.','Name the emotion to yourself ("I\'m feeling pressured") without letting it drive your reply.','Repeat back the other side\'s point before making yours, so they feel heard and you gain time.','Speak in short, clear sentences, cut filler words and check that your key point landed.']}
 ]},

{id:'ai',name:'AI at Work',q:'How do I put AI to work?',
 idea:'AI is fastest at **research, drafting and repetitive work**. People stay on judgment and anything that builds trust. Work through four stages: decide where AI fits, build it so it\'s reliable, get output you can check, then roll it out so people actually use it.',
 use:['Your team loses hours to research, first drafts or copy-paste work','You\'re deciding whether an AI idea is worth building','You need AI answers you can trust and check','You\'re rolling out an AI tool and want people to use it'],
 tools:[
 {id:'hitl',name:'Human-in-the-Loop Map',what:'Splits a workflow between AI and people.',
  steps:['Human-in-the-loop means deciding which steps AI can handle and where a person must stay involved.','Break the workflow into its individual steps.','Tag each step: **research** (gathering information), **drafting** (first versions of messages or summaries), **execution** (follow-ups, scheduling, prep) or **trust moment** (anything where a customer\'s or colleague\'s trust is on the line: demos, deals, decisions, sensitive messages).','Let AI lead research, drafting and execution.','Keep a person on every trust moment, and add a human review before anything AI-made reaches a customer.']},
 {id:'adoption',name:'AI Adoption Plan',what:'Rolls out AI in a team as a change-management project.',
  steps:['Rolling out AI is a change in how people work, so treat it like any other change project.','**Start small:** pick one team or workflow where the frustration is most visible.','**Learn first:** ask how work really happens. "Walk me through a typical day. Where do things slow down? Where do you retype the same information?"','**Build momentum:** find enthusiastic early users and share small wins like time saved or errors avoided.','**Set guardrails:** decide how data is protected, who has access and who reviews AI output.','**Measure and expand:** write down what worked and what didn\'t, assign owners, then roll out further.'],
  watch:'People adopt AI when it removes a frustration they already feel. Mandates without that rarely stick.'},
 {id:'fit-check',name:'AI Project Fit Check',what:'Tests whether an AI idea fits your needs and resources before you build.',
  steps:['Before building anything with AI, check that the idea fits what you need and what you have.','Answer six **needs** questions. **Scale:** how many people will use it? **Customization:** how specialized must it be for your business? **Interaction:** will people chat with it, or will it run in the background? **Privacy:** how sensitive is the data? **Speed:** how quickly must it respond? **Connectivity:** will it run online, offline or on a device?','Answer three **resource** questions: do you have people with AI skills, enough budget and enough time?','Choose the lightest option that meets the needs: an off-the-shelf AI tool, an existing model adjusted with your own data (often called fine-tuning), or a custom build.'],
  read:['High privacy or offline needs push toward smaller models running on your own systems or devices.','Few people and little time point to an existing tool before anything custom.'],
  watch:'Most AI projects stall on data and people. Check that your data is accurate, complete and easy to reach before you pick a model.'},
 {id:'two-way',name:'Top-Down Meets Bottom-Up',what:'Sets an AI strategy that leaders steer and employees actually use.',
  steps:['The strongest AI strategies combine direction from leaders with ideas from the people doing the work.','**From the top:** leaders set the vision and choose a few use cases with clear business value.','**From the ground up:** employees try AI in their own work and share what helps.','Invest in the basics: clean, accessible data, tools you already pay for and training.','Set **responsible AI** rules early, covering security, privacy and fairness.','**Measure impact** against business goals, then keep refining based on what you learn.'],
  watch:'A vision with no bottom-up experiments stays a slide. Experiments with no vision scatter into tools nobody maintains.'},
 
{id:'prompting',name:'Prompting for Analysis',what:'Gets analysis from AI that you can use and check.',
  steps:['A good analysis prompt reads like a clear brief to a capable colleague.','Give context: who you are, what decision you\'re making and why it matters.','Give the exact inputs: the numbers, files or data to use.','State the task in one sentence.','Say what you want back: a table, a chart, a short memo, a file name.','Ask for it in stages, starting with a base case, then variations, then a visual, and ask it to show its formulas so you can check them.']},
 {id:'prompt-patterns',name:'Prompt Patterns',what:'Gives you a menu of ways to ask, from quick to structured.',
  steps:['Different tasks call for different ways of asking. Pick from this menu.','**Zero-shot:** just ask, with no examples. Fine for simple tasks.','**One-shot or few-shot:** show one or a few examples of the output you want. Best when format matters.','**Role:** tell it who to act as, such as "a CFO reviewing this budget," to set tone and focus.','**Chaining:** break a big task into a series of smaller prompts, using each answer in the next.','**Step-by-step reasoning:** ask it to work through the problem step by step. Useful for logic and math.','**Prompt improvement:** ask the AI to rewrite or improve your prompt, then use the better version. Save prompts that work as templates for your team.'],
  read:['Wrong format: add an example.','Wrong tone: add a role.','Wrong logic: ask for the steps, then check them.']},
 {id:'grounding',name:'Grounding and RAG',what:'Ties AI answers to your own documents so they stay accurate and current.',
  steps:['Grounding ties an AI\'s answers to your own trusted documents, so it answers from your facts. **RAG** (retrieval-augmented generation) is the most common way to do it.','Collect the sources it should rely on: policies, product information, past work. Keep them current and remove duplicates.','**Retrieve:** for each question, the system finds the most relevant passages from those sources.','**Augment:** those passages are added to the prompt.','**Generate:** the AI answers using them, ideally citing which source each point came from.','Organize sources in two groups: stable knowledge that rarely changes (definitions, policies) and project knowledge that changes often (this quarter, this client).'],
  watch:'The answer can only be as good as what gets retrieved. Messy, outdated or duplicate documents produce confident wrong answers.'},
 {id:'verify',name:'Verify the Output',what:'Catches confident AI mistakes before they reach anyone.',
  steps:['AI can sound confident and still be wrong. Build a quick check into every important use.','Recompute one or two numbers yourself.','Check that the formulas or method match what you asked for.','Ask it to list its assumptions, and check them.','Treat any confident claim as something to verify, especially names, dates, quotes and figures.']},
 {id:'guardrails',name:'Guardrails in the Pipeline',what:'Builds checks into an AI product so mistakes get caught before users see them.',
  steps:['Guardrails are checks built into an AI product so mistakes get caught before users see them.','**Before the AI sees anything:** strip out personal data like emails, phone numbers and card numbers.','**In the instructions:** state the exact task, audience and level of detail.','**After it answers:** check its confidence, and show a "please verify" note when it\'s low.','**Against the source:** if the answer doesn\'t match the documents it was given, warn the user.','Filter harmful or biased language, and give users a "report a wrong answer" button whose reports someone actually reviews.'],
  watch:'Guardrails cost speed. Put the heaviest checks where an error would hurt most.'},
 {id:'agents',name:'Agent Anatomy',what:'Explains what an AI agent is made of, so you can scope one.',
  steps:['An AI agent works toward a goal by taking actions on its own, such as searching, booking or updating records. Scoping one well starts with its parts.','Define the **goal**: what does a finished task look like?','Name its three parts. The **model** is the AI that reasons. The **reasoning loop** is how it works: observe, think, act, repeat. **Tools** are what it can use to act, such as search, a calendar, a database or another app.','Choose the type. **Rule-based** agents follow fixed paths and are predictable. **Generative** agents decide their own steps and are more flexible but less predictable.','Decide how much **autonomy** it gets: only suggest, act after a person approves, or act alone.','List every tool it can touch and exactly what it\'s allowed to do with each.'],
  read:['Money, health or anything hard to undo: keep a person approving each action.','Low-risk, repeatable tasks: more autonomy is fine.']},
 {id:'north-star',name:'Outcome Metric for AI',what:'Picks one metric that shows the AI is actually helping.',
  steps:['Pick one metric that shows the AI is genuinely helping people.','Define a **completed outcome** for the user: a task finished, a question resolved, a purchase made.','Check that it reflects value for the **user**, for any **partners** and for the **business** at the same time.','Prefer it over usage counts like logins or messages sent, which can grow while nobody is actually helped.','Track a few supporting numbers underneath it, such as success rate, time saved and errors caught.']},
 {id:'examiner',name:'AI as Examiner',what:'Uses AI to test what you know.',
  steps:['AI is a good study partner for learning a new field quickly.','Paste in your notes or source material and ask for questions that test application and judgment, beyond simple recall.','Have it ask one question at a time, and hold off on feedback until you\'ve answered them all.','Review what you missed, study those areas, then ask for a new set of questions.']},
 {id:'phases',name:'Phased Rollout',what:'Scales an AI tool without losing trust.',
  steps:['Scaling AI in phases lets you build trust before you build reach.','**Prototype:** one narrow use, with a person reviewing every output.','**Integrate:** connect it to your real systems and data, and widen the group using it.','**Scale:** automate the parts that have proven reliable, then add new uses.','Put a cost and a success measure on each phase, and move on only when it\'s met.']},
 {id:'risk',name:'Risk Scoring',what:'Decides which AI risks to fix before launch.',
  steps:['Score AI risks before launch so you fix the serious ones first.','List what could go wrong: wrong or made-up answers, privacy leaks, breaking a regulation or losing users\' trust.','Score each risk on **likelihood** and **impact**, each from 1 to 5, then multiply.','Fix anything scoring 20 or more before launch, and assign an owner to watch the rest.']}
 ]},

{id:'leadership',name:'Career & Influence',q:'How do I land the role and grow in it?',

/* flow(): stages left to right, one box per tool, so every tool in the playbook appears in its sketch */
function flow(pid,title,stages){
  const p = PB.find(x=>x.id===pid), name = id => p.tools.find(t=>t.id===id).name;
  const n = stages.length, gap = 15, W = 720, cw = (W-gap*(n-1))/n, nodes = [], arrows = [];
  let most = 0;
  const all = stages.flatMap(st=>st[2]).map(name), fs = Math.min(20, Math.min(...all.map(l => Math.max(16,(cw-30)/(l.length*0.47)))));
  stages.forEach(([lab,sub,ids],i) => {
    const x = 20 + i*(cw+gap);
    nodes.push(['h'+i,x,20,cw,70,(i+1)+' '+lab,sub,ids[0],i===0]);
    ids.forEach((id,j) => nodes.push(['n'+i+'_'+j,x+8,118+j*60,cw-16,50,name(id),'',id,false,'',fs]));
    if (i<n-1) arrows.push([x+cw+1,55,x+cw+gap-1,55,0]);
    most = Math.max(most,ids.length);
  });
  return {h:118+most*60+6,title,nodes,arrows};
}

    wire(g,c.t,c.go);
  }
  if (spec.arrows) { const g = el('g',{},root); spec.arrows.forEach(a => arrow(g,a)); }
  if (spec.line) {
    const g = el('g',{class:'node','data-t':'four-numbers'},root); const ly = 104;
    el('rect',{x:220,y:ly-18,width:340,height:36,class:'band'},g);
    rect(g,220,ly-18,340,36,{strokeWidth:1.2}); g.lastChild.classList.add('accent');
    text(g,330,ly-26,'deal zone (ZOPA)','note');
    path(g,`M30 ${ly} L728 ${ly}`,{strokeWidth:1.6}); arrow(g,[700,ly,730,ly,0]);
    text(g,728,ly+30,'better for you','k','end');
    spec.marks.forEach(([x,lab,sub,up]) => { path(g,`M${x} ${ly-16} L${x} ${ly+16}`,{strokeWidth:2.4}); const ty = up ? ly-62 : ly+52; text(g,x,ty,lab,'t'); text(g,x,ty+22,sub,'s'); });
    wire(g,'Open The Four Numbers','four-numbers');
  }
  (spec.nodes||[]).forEach(([id,x,y,w,h,label,sub,target,hi,kicker,fsz]) => {
    const g = el('g',{class:'node'+(mini&&hi?' on':''),'data-t':target},root);
    el('rect',{x:x+3,y:y+3,width:w-6,height:h-6,class:'hlr'},g);
    rect(g,x,y,w,h);
    const lines = (sub||'').split('\n').filter(Boolean);
    let ty = y + h/2 - (lines.length? (lines.length*20)/2 : -8) + (kicker? 10 : 4);
    if (kicker) text(g,x+w/2,y+26,kicker,'k');
    const base = fsz || 20;
    if ((w-16)/(label.length*0.47) < base && label.includes(' ')) {
      const words = label.split(' '); let best = 1, diff = 1e9;
      for (let k=1;k<words.length;k++){ const d = Math.abs(words.slice(0,k).join(' ').length - words.slice(k).join(' ').length); if (d<diff){diff=d;best=k;} }
      const l1 = words.slice(0,best).join(' '), l2 = words.slice(best).join(' '), f2 = Math.min(base,(w-16)/(Math.max(l1.length,l2.length)*0.47));
      [l1,l2].forEach((l,k) => text(g,x+w/2,y+h/2-3+k*(f2+1)-(f2+1)/2+f2*0.35,l,'t').setAttribute('style','font-size:'+f2.toFixed(1)+'px;line-height:1'));
    } else { const lt = text(g,x+w/2,ty,label,'t'); if (fsz) lt.setAttribute('style','font-size:'+fsz.toFixed(1)+'px'); }
    lines.forEach((l,i) => { if (l.includes(' · ')) { const [a,b] = l.split(' · '); text(g,x+w/2,ty+22+i*20,a+'  ·  '+b,'s'); } else text(g,x+w/2,ty+22+i*20,l,'s'); });
    wire(g,'Open '+label,target);
  });
  (spec.notes||[]).forEach(([x,y,t,a]) => { const n = text(root,x,y,t,'note',a); if (t==='×') n.setAttribute('style','font-size:30px'); });
  return svg;
}

/* ---------- VIEWS ---------- */
const view = $('#view'), bar = $('#progress');
let io = null, onScroll = null;
function cleanup(){ if (io) { io.disconnect(); io = null; } if (onScroll) { removeEventListener('scroll',onScroll); onScroll = null; } bar.style.transform = 'scaleX(0)'; document.documentElement.style.removeProperty('--c'); }
const toolCount = PB.reduce((n,p)=>n+p.tools.length,0);
const teaser = p => plain(p.idea).split(/(?<=\.)\s/)[0];

/* Public link to the Notion form "Share a learning" (Playbook Submissions). Leave empty to hide the invite. */
const SUBMIT_URL = 'https://organized-fuschia-ac1.notion.site/d5f9b87b35df4cd9b0b0912d5c86cc35';
const GROUPS = [['all','All',null],['ai','AI',['ai']],['grow','Strategy & growth',['strategy','innovation','marketing','b2b']],['numbers','Numbers & data',['finance','data']],['people','People',['negotiation','leadership']],['ref','Reference',['glossary']]];
let homeFilter = 'all';
const ARROW = '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
function renderHome(){
  cleanup(); setNav(null); setCrumb(null);
  view.innerHTML = `
  <section class="gut"><div class="in">
    <div class="intro">
      <div><h1 class="rv" style="--i:0">Business school, <em>sketched out.</em></h1>
</div>
      <div class="stats rv" style="--i:2"><span class="chip"><b>${PB.length}</b> playbooks</span><span class="chip"><b>${toolCount}</b> tools</span><span class="chip"><b>${GLOSS.length}</b> terms</span></div>
    </div>
    <div class="filters" role="toolbar" aria-label="Filter playbooks">${GROUPS.map(([k,l])=>`<button class="pill" data-f="${k}" aria-pressed="${k===homeFilter}">${l}</button>`).join('')}</div>
    <div class="feed" id="feed"></div>
    ${SUBMIT_URL ? `<div class="share"><div><b>Learned something useful in business school?</b><p>Share a tool or lesson. Approved ones are rewritten for everyone and added to the playbooks.</p></div><a href="${SUBMIT_URL}" target="_blank" rel="noopener">Share a learning ${ARROW}</a></div>` : ''}
  </div></section>`;
  const feed = view.querySelector('#feed');
  PB.forEach((p,i) => {
    const b = document.createElement('button'); b.className = 'story rv'; b.dataset.id = p.id; b.style.cssText = colorVars(p.id)+`;--i:${i%4+2}`;
    b.setAttribute('aria-label',`${p.name}: ${p.q}`);
    const more = p.tools.length>5 ? `<span>+${p.tools.length-5} more</span>` : '';
    b.innerHTML = `<div class="thumb"><span class="num">${pad(i+1)}</span><div class="paper"></div><div class="peek" aria-hidden="true"><p>${esc(teaser(p))}</p></div><span class="go" aria-hidden="true">${ARROW}</span></div>
      <div class="meta"><h3>${esc(p.name)}</h3><span class="mono">${p.tools.length} tools</span></div><span class="q">${esc(p.q)}</span>`;
    b.querySelector('.paper').appendChild(drawSketch(p.id,null,true));
    b.onclick = () => go(p.id);
    feed.appendChild(b);
  });
  const g = document.createElement('button'); g.className = 'story rv'; g.dataset.id = 'glossary'; g.style.cssText = '--i:3';
  g.setAttribute('aria-label','Glossary: what does that word mean?');
  g.innerHTML = `<div class="thumb gl"><span class="num">${pad(PB.length+1)}</span><div class="az">A–Z<span>P&amp;L, SG&amp;A, EBITDA…</span></div><div class="peek" aria-hidden="true"><p>Plain definitions of the business terms used across the playbooks, from P&amp;L to ZOPA.</p></div><span class="go" aria-hidden="true">${ARROW}</span></div>
    <div class="meta"><h3>Glossary</h3><span class="mono">${GLOSS.length} terms</span></div><span class="q">What does that word mean?</span>`;
  g.onclick = () => go('glossary');
  feed.appendChild(g);
  const apply = () => { const grp = GROUPS.find(x=>x[0]===homeFilter)[2]; feed.querySelectorAll('.story').forEach(c => c.hidden = !!grp && !grp.includes(c.dataset.id)); view.querySelectorAll('.pill').forEach(p => p.setAttribute('aria-pressed', p.dataset.f===homeFilter)); };
  view.querySelectorAll('.pill').forEach(p => p.onclick = () => { homeFilter = p.dataset.f; apply(); });
  apply();
}
function setNav(active){
  $('#nav-pb').innerHTML = '<span class="lab">Playbooks</span>' + PB.map(p => `<button data-go="${p.id}" style="${colorVars(p.id)}" ${p.id===active?'aria-current="page"':''}><span class="sw"></span>${esc(p.name)}</button>`).join('');
  $('#nav-ref').innerHTML = `<span class="lab">Reference</span><button data-go="glossary" ${active==='glossary'?'aria-current="page"':''}><span class="sw" style="background:var(--ink)"></span>Glossary</button>`;
  document.querySelectorAll('.side [data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  document.querySelectorAll('.side .navgroup').forEach(nav => {
    const dot = document.createElement('span'); dot.className = 'navdot'; nav.appendChild(dot);
    const moveTo = b => { if (!b) { dot.style.opacity = 0; return; } dot.style.opacity = 1; dot.style.transform = `translateY(${b.offsetTop + b.offsetHeight/2 - 2.5}px)`; };
    const home = () => moveTo(nav.querySelector('[aria-current="page"]'));
    nav.querySelectorAll('button').forEach(b => { b.addEventListener('mouseenter', () => moveTo(b)); b.addEventListener('focus', () => moveTo(b)); });
    nav.addEventListener('mouseleave', home); home();
  });
}
function setCrumb(name){
  const c = $('#crumb');
  if (!name) { c.innerHTML = '<b>Playbooks</b><span>Business school tools for real problems</span>'; return; }
  c.innerHTML = `<button id="crumb-home">Playbooks</button><span>/</span><b style="color:var(--ink)">${esc(name)}</b>`;
  c.querySelector('#crumb-home').onclick = () => go('');
}

function renderGlossary(q){
  cleanup(); setNav('glossary'); setCrumb('Glossary');
  const terms = [...GLOSS].sort((a,b)=>a[0].localeCompare(b[0],'en',{sensitivity:'base'}));
  const letters = [...new Set(terms.map(t=>t[0][0].toUpperCase()))];
  view.innerHTML = `
  <section class="hero gut"><div class="in"><div class="block" style="--c:var(--ink);--cf:var(--bg)">
    <button class="back rv" style="--i:0" id="back">← All playbooks</button>
    <div class="kick rv" style="--i:0;margin-top:22px">Section ${pad(PB.length+1)}</div>
    <h1 class="rv" style="--i:1">Glossary</h1>
    <span class="hand rv" style="--i:2">What does that word mean?</span>
    <p class="lede rv" style="--i:3">Plain definitions of the business terms used across the playbooks, from <strong>margin</strong> to <strong>ZOPA</strong>.</p>
    <div class="big" aria-hidden="true">A–Z</div>
  </div></div></section>
  <section class="gut"><div class="in">
    <div class="gl-tools"><input id="gl-q" type="search" placeholder="Find a term, like EBITDA" aria-label="Find a term"><nav class="letters" aria-label="Jump to letter">${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(l=>letters.includes(l)?`<a href="#" data-l="${l}">${l}</a>`:`<span aria-hidden="true">${l}</span>`).join('')}</nav></div>
    <div class="gl-list" id="gl-list"></div>
  </div></section>`;
  const list = view.querySelector('#gl-list'), inp = view.querySelector('#gl-q');
  const draw = v => {
    const s = v.trim().toLowerCase();
    const hits = terms.filter(([t,d]) => !s || t.toLowerCase().includes(s) || d.toLowerCase().includes(s));
    const groups = {}; hits.forEach(h => { const l = h[0][0].toUpperCase(); (groups[l] = groups[l] || []).push(h); });
    list.innerHTML = Object.keys(groups).map(l => `<div class="gl-group" id="gl-${l}"><h3>${l}</h3><div>${groups[l].map(([t,d])=>`<div class="gl-item"><b>${esc(t)}</b><p>${esc(d)}</p></div>`).join('')}</div></div>`).join('') || '<p class="gl-empty">No terms match. Try a shorter word.</p>';
  };
  inp.oninput = () => draw(inp.value); inp.value = q||''; draw(inp.value);
  view.querySelector('#back').onclick = () => go('');
  view.querySelectorAll('.letters a').forEach(a => a.onclick = e => { e.preventDefault(); inp.value=''; draw(''); const h = document.getElementById('gl-'+a.dataset.l); if (h) h.scrollIntoView({behavior: reduce()?'auto':'smooth'}); });
  window.scrollTo({top:0});
}

function cardHTML(t,i){
  return `<article class="card" id="t-${t.id}" data-t="${t.id}">
   <div class="head"><span class="n">${pad(i+1)}</span><h3>${esc(t.name)}</h3><p class="what">${md(t.what)}</p></div>
   <div class="body">
    ${t.formula?`<div class="formula">${esc(t.formula)}</div>`:''}
    <div><h4>How to use it</h4><ol>${t.steps.map(s=>`<li><span>${md(s)}</span></li>`).join('')}</ol></div>
    ${t.read?`<div><h4>How to read it</h4><ul>${t.read.map(s=>`<li>${md(s)}</li>`).join('')}</ul></div>`:''}
    ${t.watch?`<p class="watch"><b>Watch out</b>${md(t.watch)}</p>`:''}
   </div></article>`;
}

function renderPlaybook(id,toolId){
  cleanup(); setNav(id); setCrumb(PB.find(p=>p.id===id).name);
  const i = PB.findIndex(p=>p.id===id), p = PB[i], next = PB[(i+1)%PB.length];
  document.documentElement.style.setProperty('--c',COL[id][0]);
  view.innerHTML = `
  <section class="hero gut"><div class="in"><div class="block" style="${colorVars(id)}">
    <button class="back rv" style="--i:0" id="back">← All playbooks</button>
    <div class="kick rv" style="--i:0">Playbook</div>
    <h1 class="rv" style="--i:1">${esc(p.name)}</h1>
    <span class="hand rv" style="--i:2">${esc(p.q)}</span>
    <p class="lede rv" style="--i:3">${md(p.idea)}</p>
    <div class="uses rv" style="--i:4"><span class="kick">Use it when…</span><ol>${p.use.map(u=>`<li>${esc(u)}</li>`).join('')}</ol></div>
    <div class="big" aria-hidden="true">${pad(i+1)} / ${pad(PB.length)}</div>
  </div></div></section>

  <section class="gut" style="${colorVars(id)}"><div class="in essay">
    <div class="stage">
      <details class="map" id="map"><summary>See the whole playbook on one page</summary><div class="pin"><div class="hint">Tap a box to jump to it.</div><div class="scroll" id="sk"></div></div></details>
      <div class="nowon" aria-live="polite"><span class="mono">Now reading</span><b id="nowon">${esc(p.tools[0].name)}</b></div>
    </div>
    <div class="steps">${p.tools.map(cardHTML).join('')}</div>
  </div></section>


  <section class="gut nextwrap"><div class="in"><button class="nextblock" id="next" style="${colorVars(next.id)}"><div><span class="kick">Next playbook</span><b>${esc(next.name)}</b><span class="hand">${esc(next.q)}</span></div><span class="arrow" aria-hidden="true">${ARROW}</span></button></div></section>`;

  const map = view.querySelector('#map'); if (!matchMedia('(max-width:600px)').matches) map.open = true;
  const svg = drawSketch(id, tid => scrollToTool(tid));
  view.querySelector('#sk').appendChild(svg);
  view.querySelector('#back').onclick = () => go('');
  view.querySelector('#next').onclick = () => go(next.id);

  const cards = [...view.querySelectorAll('.card')], nowon = view.querySelector('#nowon');
  const setActive = tid => {
    cards.forEach(c => c.classList.toggle('on', c.dataset.t===tid));
    const hasNode = svg.querySelector(`.node[data-t="${tid}"]`);
    svg.querySelectorAll('.node').forEach(n => n.classList.toggle('on', hasNode ? n.dataset.t===tid : false));
    const t = p.tools.find(x=>x.id===tid); if (t) nowon.textContent = t.name;
  };
  setActive(p.tools[0].id);
  io = new IntersectionObserver(es => { es.forEach(e => { if (e.isIntersecting) setActive(e.target.dataset.t); }); }, {rootMargin:'-40% 0px -55% 0px'});
  cards.forEach(c => io.observe(c));
  onScroll = () => { const h = document.documentElement; const max = h.scrollHeight - innerHeight; bar.style.transform = `scaleX(${max>0?Math.min(1,scrollY/max):0})`; };
  addEventListener('scroll',onScroll,{passive:true}); onScroll();

  if (toolId) requestAnimationFrame(()=>scrollToTool(toolId)); else window.scrollTo({top:0});
}
function scrollToTool(tid){
  const t = document.getElementById('t-'+tid); if (!t) return;
  t.scrollIntoView({behavior: reduce()?'auto':'smooth', block:'start'});
}

function renderSearch(q){
  cleanup(); setNav(null); setCrumb('Search');
  const s = q.toLowerCase(); const hits = [];
  PB.forEach(p => p.tools.forEach(t => { const hay = [t.name,t.what,(t.steps||[]).join(' '),t.ex||'',t.formula||''].join(' ').toLowerCase(); if (hay.includes(s)) hits.push([p,t]); }));
  const gh = GLOSS.filter(([t,d]) => t.toLowerCase().includes(s));
  view.innerHTML = `<section class="gut sec"><div class="in">${gh.length?`<div class="sechead"><h2>In the glossary</h2></div><div class="results" style="margin-bottom:34px">${gh.map(([t,d])=>`<button data-g="${esc(t)}"><b>${esc(t)}</b><small>${esc(d)}</small></button>`).join('')}</div>`:''}<div class="sechead"><h2>${hits.length} ${hits.length===1?'tool':'tools'} for “${esc(q)}”</h2></div>
   <div class="results">${hits.map(([p,t])=>`<button data-p="${p.id}" data-t="${t.id}"><b>${esc(t.name)}</b><small>${esc(p.name)} · ${md(t.what)}</small></button>`).join('') || '<p class="muted">No tools match. Try a framework name like SWOT, or a word like price.</p>'}</div></div></section>`;
  view.querySelectorAll('.results button[data-p]').forEach(b => b.onclick = () => { $('#q').value=''; go(b.dataset.p,b.dataset.t); });
  view.querySelectorAll('.results button[data-g]').forEach(b => b.onclick = () => { $('#q').value=''; try { history.replaceState(null,'','#glossary'); } catch(e){} renderGlossary(b.dataset.g); });
}
function go(p,t){
  const h = t ? `${p}.${t}` : (p||'');
  try { history.replaceState(null,'',h?'#'+h:location.pathname); } catch(e){}
  route(h);
}
function route(h){
  const [p,t] = (h||'').split('.');
  if (p==='glossary') renderGlossary(); else if (PB.some(x=>x.id===p)) renderPlaybook(p,t); else { renderHome(); window.scrollTo({top:0}); }
}
/* light / dark */
(() => { const root = document.documentElement; let saved = null; try { saved = localStorage.getItem('pb-theme'); } catch(e){}
  if (saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved);
  const toggle = () => { const cur = root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); const next = cur === 'dark' ? 'light' : 'dark'; root.setAttribute('data-theme', next); try { localStorage.setItem('pb-theme', next); } catch(e){} }; document.querySelectorAll('[data-theme-toggle]').forEach(b => b.onclick = toggle); })();
$('#home-link').onclick = $('#home-link-m').onclick = () => { $('#q').value=''; homeFilter='all'; go(''); };
let st; $('#q').addEventListener('input', e => { clearTimeout(st); const v=e.target.value.trim(); st=setTimeout(()=> v ? renderSearch(v) : route(location.hash.slice(1)),120); });

/* ---------- sound: soft clicks on buttons, always on (like recent.design) ---------- */
const Sound = (() => {
  let ctx = null;
  const ac = () => { if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); } if (ctx.state === 'suspended') ctx.resume(); return ctx; };
  const tone = (f1, f2, dur, vol, type='sine', delay=0) => {
    const c = ac(); if (!c) return; const t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  };
  return { play(kind){
    try {
      if (kind === 'open') { tone(620, 760, 0.07, 0.04, 'sine'); tone(930, 1100, 0.08, 0.025, 'sine', 0.045); }
      else if (kind === 'back') tone(760, 560, 0.08, 0.035, 'sine');
      else tone(1250, 950, 0.035, 0.03, 'triangle');
    } catch(e){}
  }};
})();
document.addEventListener('click', e => {
  const t = e.target.closest('button,a,.sk .node'); if (!t) return;
  if (t.matches('.story,.nextblock,.navgroup button,.results button')) Sound.play('open');
  else if (t.matches('.back,#crumb-home,.brand')) Sound.play('back');
  else Sound.play('tick');
}, true);

route(location.hash.slice(1));
</script>
